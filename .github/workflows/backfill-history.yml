name: BETLAB Import storico V4 - Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: '45 3 * * *'

permissions:
  contents: write

concurrency:
  group: betlab-import-history
  cancel-in-progress: false

jobs:
  import-history:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
      - name: Importa risultati verificati 2026-27
        run: |
          python3 <<'PY'
          import csv
          import hashlib
          import io
          import json
          import os
          import re
          import unicodedata
          import urllib.request
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          HISTORY_FILE = 'data/betlab-history.json'
          SEASON = '2026-27'
          BASE = 'https://www.football-data.co.uk/mmz4281/2627'
          TODAY = datetime.now(ZoneInfo('Europe/Rome')).date()

          # CSV dei principali campionati pubblicati da Football-Data.co.uk.
          DATASETS = [
              ('E0', 'England', 'Premier League'),
              ('E1', 'England', 'Championship'),
              ('E2', 'England', 'League One'),
              ('E3', 'England', 'League Two'),
              ('SC0', 'Scotland', 'Premiership'),
              ('SC1', 'Scotland', 'Championship'),
              ('D1', 'Germany', 'Bundesliga'),
              ('D2', 'Germany', '2. Bundesliga'),
              ('I1', 'Italy', 'Serie A'),
              ('I2', 'Italy', 'Serie B'),
              ('SP1', 'Spain', 'La Liga'),
              ('SP2', 'Spain', 'Segunda Division'),
              ('F1', 'France', 'Ligue 1'),
              ('F2', 'France', 'Ligue 2'),
              ('N1', 'Netherlands', 'Eredivisie'),
              ('B1', 'Belgium', 'Jupiler Pro League'),
              ('P1', 'Portugal', 'Primeira Liga'),
              ('T1', 'Turkey', 'Super Lig'),
              ('G1', 'Greece', 'Super League 1'),
          ]

          def normalize(value):
              value = unicodedata.normalize('NFKD', str(value or ''))
              value = ''.join(c for c in value if not unicodedata.combining(c))
              return ' '.join(re.sub(r'[^a-z0-9]+', ' ', value.lower()).split())

          def team_name(record, side):
              value = record.get(side)
              if isinstance(value, dict):
                  return value.get('name')
              return value

          def parse_date(value):
              value = str(value or '').strip()
              for fmt in ('%d/%m/%Y', '%d/%m/%y', '%Y-%m-%d'):
                  try:
                      return datetime.strptime(value, fmt).date()
                  except ValueError:
                      continue
              return None

          def nonnegative_int(value):
              value = str(value or '').strip()
              if not re.fullmatch(r'\d+', value):
                  return None
              return int(value)

          if not os.path.isfile(HISTORY_FILE):
              raise RuntimeError('Storico originale assente: nessun file creato per sicurezza')
          with open(HISTORY_FILE, encoding='utf-8') as file:
              root = json.load(file)
          if isinstance(root, list):
              history = root
              key = None
          elif isinstance(root, dict) and isinstance(root.get('matches'), list):
              history = root['matches']
              key = 'matches'
          elif isinstance(root, dict) and isinstance(root.get('history'), list):
              history = root['history']
              key = 'history'
          else:
              raise RuntimeError('Formato storico non riconosciuto: archivio lasciato intatto')
          initial_size = len(history)
          existing = {
              (str(row.get('date') or '')[:10], normalize(team_name(row, 'home')), normalize(team_name(row, 'away')))
              for row in history if isinstance(row, dict)
          }

          additions = []
          successful = failed = scored = 0
          for code, country, league in DATASETS:
              url = f'{BASE}/{code}.csv'
              try:
                  request = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'BETLAB-AI/4.0 (historical football results)', 'Accept': 'text/csv'},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read(3_000_001)
                  if len(raw) > 3_000_000:
                      raise ValueError('CSV troppo grande')
                  decoded = raw.decode('utf-8-sig', errors='replace')
                  reader = csv.DictReader(io.StringIO(decoded))
                  headers = set(reader.fieldnames or [])
                  required = {'Date', 'HomeTeam', 'AwayTeam', 'FTHG', 'FTAG'}
                  if not required.issubset(headers):
                      raise ValueError('Colonne risultato mancanti: ' + str(sorted(headers)[:12]))
                  successful += 1
                  imported_here = completed_here = 0
                  for row in reader:
                      if not isinstance(row, dict):
                          continue
                      match_date = parse_date(row.get('Date'))
                      if match_date is None or match_date >= TODAY:
                          continue
                      home = str(row.get('HomeTeam') or '').strip()
                      away = str(row.get('AwayTeam') or '').strip()
                      hg = nonnegative_int(row.get('FTHG'))
                      ag = nonnegative_int(row.get('FTAG'))
                      if not home or not away or normalize(home) == normalize(away) or hg is None or ag is None:
                          continue
                      completed_here += 1
                      date_text = match_date.isoformat()
                      identifier = (date_text, normalize(home), normalize(away))
                      if identifier in existing:
                          continue
                      token = hashlib.sha256(f'FD|{code}|{date_text}|{home}|{away}'.encode()).hexdigest()[:20]
                      additions.append({
                          'fixtureId': 'FD-' + token,
                          'source': 'Football-Data.co.uk',
                          'date': date_text,
                          'timestamp': 0,
                          'status': 'FT',
                          'country': country,
                          'league': league,
                          'season': SEASON,
                          'home': {'name': home},
                          'away': {'name': away},
                          'homeGoals': hg,
                          'awayGoals': ag,
                          'goals': {'home': hg, 'away': ag},
                      })
                      existing.add(identifier)
                      imported_here += 1
                  scored += completed_here
                  print(f'{code} {league}: {completed_here} risultati completi | +{imported_here} nuovi')
              except (OSError, ValueError, UnicodeError, csv.Error) as error:
                  failed += 1
                  print(f'{code} {league}: NON DISPONIBILE ({error})')

          print(f'Fonti disponibili: {successful} | fonti non disponibili: {failed}')
          print(f'Risultati completi nelle fonti: {scored}')
          print(f'Storico iniziale: {initial_size} | nuovi risultati: {len(additions)}')
          if successful == 0:
              raise RuntimeError('Nessuna fonte CSV valida: archivio originale non modificato')
          if not additions:
              print('Nessun risultato nuovo: storico originale conservato invariato')
          else:
              merged = history + additions
              merged.sort(key=lambda entry: str(entry.get('date') or ''))
              if len(merged) < initial_size:
                  raise RuntimeError('Protezione archivio: dimensione inattesa')
              if key is None:
                  output = merged
              else:
                  output = dict(root)
                  output[key] = merged
                  if 'total' in output:
                      output['total'] = len(merged)
                  output['updatedAt'] = datetime.now(ZoneInfo('Europe/Rome')).isoformat()
              temporary = HISTORY_FILE + '.tmp'
              with open(temporary, 'w', encoding='utf-8') as file:
                  json.dump(output, file, ensure_ascii=False, indent=2)
              with open(temporary, encoding='utf-8') as file:
                  verification = json.load(file)
              restored = verification if isinstance(verification, list) else verification[key]
              if len(restored) != len(merged):
                  raise RuntimeError('Validazione fallita, originale non modificato')
              os.replace(temporary, HISTORY_FILE)
              print(f'Storico aggiornato: {len(merged)} incontri, nessun dato precedente rimosso')
          PY
      - name: Commit solo se ci sono risultati nuovi
        run: |
          git config user.name 'BETLAB AI Bot'
          git config user.email 'actions@github.com'
          git add data/betlab-history.json
          if git diff --cached --quiet; then
            echo 'Nessun aggiornamento da salvare'
            exit 0
          fi
          git commit -m 'BETLAB: importa risultati 2026-27 da Football-Data'
          git pull --rebase origin main
          git push origin main
