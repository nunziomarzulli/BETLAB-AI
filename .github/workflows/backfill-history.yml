name: BETLAB Backfill storico

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Recupera storico BETLAB
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |
          mkdir -p data

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          from datetime import datetime, timedelta, timezone

          API_KEY = os.environ["API_FOOTBALL_KEY"]

          BASE_URL = "https://v3.football.api-sports.io"
          HISTORY_FILE = "data/betlab-history.json"

          # =====================================================
          # SICUREZZA QUOTA
          #
          # Recuperiamo 30 giorni per esecuzione.
          # 1 giorno = 1 richiesta.
          # =====================================================

          DAYS_TO_FETCH = 30

          # Non includiamo oggi:
          # il workflow giornaliero lo gestisce già.
          end_date = (
              datetime.now(timezone.utc).date()
              - timedelta(days=1)
          )

          start_date = (
              end_date
              - timedelta(days=DAYS_TO_FETCH - 1)
          )

          # =====================================================
          # CARICA STORICO ESISTENTE
          # =====================================================

          if os.path.exists(HISTORY_FILE):

              try:
                  with open(
                      HISTORY_FILE,
                      encoding="utf-8"
                  ) as f:
                      history_data = json.load(f)

                  history = history_data.get(
                      "matches",
                      []
                  )

              except Exception:
                  history = []

          else:
              history = []

          history_by_id = {
              str(match["fixtureId"]): match
              for match in history
              if match.get("fixtureId") is not None
          }

          print("=================================")
          print("BETLAB BACKFILL ENGINE")
          print("=================================")

          print(
              "Periodo:",
              start_date,
              "->",
              end_date
          )

          print(
              "Storico iniziale:",
              len(history_by_id)
          )

          print()

          completed_statuses = {
              "FT",
              "AET",
              "PEN"
          }

          total_requests = 0
          total_received = 0
          total_added = 0

          current_date = start_date

          # =====================================================
          # DOWNLOAD GIORNO PER GIORNO
          # =====================================================

          while current_date <= end_date:

              date_string = current_date.isoformat()

              url = (
                  f"{BASE_URL}/fixtures"
                  f"?date={date_string}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY
                  }
              )

              print(
                  "Scarico:",
                  date_string,
                  "...",
                  end=" "
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      body = response.read().decode(
                          "utf-8"
                      )

                      payload = json.loads(body)

                      remaining = response.headers.get(
                          "x-ratelimit-requests-remaining"
                      )

                  total_requests += 1

              except Exception as e:

                  print("ERRORE:", e)
                  break

              if payload.get("errors"):

                  print(
                      "ERRORE API:",
                      payload["errors"]
                  )

                  break

              fixtures = payload.get(
                  "response",
                  []
              )

              total_received += len(fixtures)

              added_today = 0

              for match in fixtures:

                  fixture = match.get(
                      "fixture",
                      {}
                  )

                  status = (
                      fixture
                      .get("status", {})
                      .get("short")
                  )

                  if status not in completed_statuses:
                      continue

                  fixture_id = fixture.get("id")

                  if fixture_id is None:
                      continue

                  teams = match.get(
                      "teams",
                      {}
                  )

                  home = teams.get(
                      "home",
                      {}
                  )

                  away = teams.get(
                      "away",
                      {}
                  )

                  goals = match.get(
                      "goals",
                      {}
                  )

                  if not home.get("id"):
                      continue

                  if not away.get("id"):
                      continue

                  if goals.get("home") is None:
                      continue

                  if goals.get("away") is None:
                      continue

                  league = match.get(
                      "league",
                      {}
                  )

                  item = {
                      "fixtureId":
                          fixture_id,

                      "date":
                          fixture.get("date"),

                      "timestamp":
                          fixture.get("timestamp"),

                      "status":
                          status,

                      "country":
                          league.get("country"),

                      "league":
                          league.get("name"),

                      "leagueId":
                          league.get("id"),

                      "season":
                          league.get("season"),

                      "round":
                          league.get("round"),

                      "home": {
                          "id":
                              home.get("id"),

                          "name":
                              home.get("name")
                      },

                      "away": {
                          "id":
                              away.get("id"),

                          "name":
                              away.get("name")
                      },

                      "goals": {
                          "home":
                              goals.get("home"),

                          "away":
                              goals.get("away")
                      }
                  }

                  key = str(fixture_id)

                  if key not in history_by_id:
                      added_today += 1
                      total_added += 1

                  history_by_id[key] = item

              print(
                  f"{len(fixtures)} partite | "
                  f"+{added_today} risultati | "
                  f"quota residua: {remaining}"
              )

              # Fermata prudenziale:
              # lasciamo almeno 20 richieste disponibili
              # per il workflow giornaliero e i test.

              if remaining is not None:

                  try:
                      if int(remaining) <= 20:

                          print()
                          print(
                              "STOP DI SICUREZZA:"
                          )

                          print(
                              "Quota residua <= 20."
                          )

                          break

                  except ValueError:
                      pass

              # Piano Free: evitiamo raffiche.
              time.sleep(7)

              current_date += timedelta(days=1)

          # =====================================================
          # SALVA STORICO
          # =====================================================

          history = list(
              history_by_id.values()
          )

          history.sort(
              key=lambda x:
                  x.get("timestamp") or 0
          )

          output = {
              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "total":
                  len(history),

              "matches":
                  history
          }

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("=================================")
          print("RISULTATO BACKFILL")
          print("=================================")

          print(
              "Richieste utilizzate:",
              total_requests
          )

          print(
              "Partite ricevute:",
              total_received
          )

          print(
              "Nuovi risultati aggiunti:",
              total_added
          )

          print(
              "Totale storico BETLAB:",
              len(history)
          )

          print()
          print(
              "BETLAB BACKFILL ENGINE OK"
          )

          PY

      - name: Salva storico BETLAB
        run: |
          git config user.name "BETLAB AI Bot"
          git config user.email "actions@github.com"

          git add data/betlab-history.json

          if git diff --cached --quiet
          then
            echo "Nessun nuovo risultato."
          else
            git commit -m "Backfill storico BETLAB"

            git pull --rebase origin main

            git push origin main
          fi
