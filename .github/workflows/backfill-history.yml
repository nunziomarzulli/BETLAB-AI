name: BETLAB Import storico

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-history:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Importa storico OpenFootball
        run: |
          mkdir -p data

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import hashlib

          from datetime import datetime, timezone

          HISTORY_FILE = "data/betlab-history.json"

          BASE = (
              "https://raw.githubusercontent.com/"
              "openfootball/football.json/master"
          )

          # =====================================================
          # CAMPIONATI DA IMPORTARE
          # STAGIONE 2025/26
          # =====================================================

          DATASETS = [
              ("2025-26", "en.1.json", "England", "Premier League"),
              ("2025-26", "en.2.json", "England", "Championship"),

              ("2025-26", "it.1.json", "Italy", "Serie A"),
              ("2025-26", "it.2.json", "Italy", "Serie B"),

              ("2025-26", "es.1.json", "Spain", "La Liga"),
              ("2025-26", "es.2.json", "Spain", "Segunda División"),

              ("2025-26", "de.1.json", "Germany", "Bundesliga"),
              ("2025-26", "de.2.json", "Germany", "2. Bundesliga"),

              ("2025-26", "fr.1.json", "France", "Ligue 1"),
              ("2025-26", "fr.2.json", "France", "Ligue 2"),

              ("2025-26", "pt.1.json", "Portugal", "Primeira Liga"),
              ("2025-26", "nl.1.json", "Netherlands", "Eredivisie"),
              ("2025-26", "be.1.json", "Belgium", "Jupiler Pro League"),
              ("2025-26", "tr.1.json", "Turkey", "Süper Lig"),
              ("2025-26", "sco.1.json", "Scotland", "Premiership"),

              ("2025-26", "at.1.json", "Austria", "Bundesliga"),
              ("2025-26", "gr.1.json", "Greece", "Super League 1")
          ]

          # =====================================================
          # CARICA STORICO BETLAB ESISTENTE
          # =====================================================

          if os.path.exists(HISTORY_FILE):
              try:
                  with open(
                      HISTORY_FILE,
                      encoding="utf-8"
                  ) as f:
                      existing = json.load(f)

                  history = existing.get(
                      "matches",
                      []
                  )

              except Exception:
                  history = []
          else:
              history = []

          print("=================================")
          print("BETLAB OPENFOOTBALL IMPORT")
          print("=================================")
          print()

          print(
              "Storico BETLAB iniziale:",
              len(history)
          )

          # =====================================================
          # INDICE DATI GIÀ PRESENTI
          # =====================================================

          history_keys = set()

          for match in history:

              key = (
                  str(match.get("date", ""))[:10],
                  match.get("home", {}).get("name", ""),
                  match.get("away", {}).get("name", "")
              )

              history_keys.add(key)

          total_downloaded = 0
          total_imported = 0
          successful_datasets = 0
          failed_datasets = 0

          # =====================================================
          # NORMALIZZAZIONE RISULTATO
          # =====================================================

          def extract_score(score):

              if score is None:
                  return None

              # Alcuni file OpenFootball usano:
              # "score": [1, 0]

              if isinstance(score, list):

                  if len(score) >= 2:

                      if (
                          isinstance(score[0], int)
                          and isinstance(score[1], int)
                      ):
                          return [
                              score[0],
                              score[1]
                          ]

                  return None

              # Altri usano:
              # "score": {"ft":[1,0], "ht":[0,0]}

              if isinstance(score, dict):

                  ft = score.get("ft")

                  if (
                      isinstance(ft, list)
                      and len(ft) >= 2
                      and isinstance(ft[0], int)
                      and isinstance(ft[1], int)
                  ):
                      return [
                          ft[0],
                          ft[1]
                      ]

              return None

          # =====================================================
          # ID INTERNO BETLAB
          # =====================================================

          def create_id(
              season,
              country,
              league,
              date,
              home,
              away
          ):

              raw = (
                  f"openfootball|"
                  f"{season}|"
                  f"{country}|"
                  f"{league}|"
                  f"{date}|"
                  f"{home}|"
                  f"{away}"
              )

              digest = hashlib.sha1(
                  raw.encode("utf-8")
              ).hexdigest()[:16]

              return (
                  "OF-" + digest
              )

          # =====================================================
          # DOWNLOAD DATASET
          # =====================================================

          for (
              season,
              filename,
              country,
              league
          ) in DATASETS:

              url = (
                  f"{BASE}/"
                  f"{season}/"
                  f"{filename}"
              )

              print(
                  f"Scarico {country} - "
                  f"{league}..."
              )

              try:

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                              "BETLAB-AI/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      payload = json.loads(
                          response
                          .read()
                          .decode("utf-8")
                      )

              except Exception as e:

                  failed_datasets += 1

                  print(
                      "  ERRORE:",
                      e
                  )

                  continue

              successful_datasets += 1

              matches = payload.get(
                  "matches",
                  []
              )

              total_downloaded += len(matches)

              imported_league = 0

              # =================================================
              # IMPORT PARTITE
              # =================================================

              for match in matches:

                  date = match.get("date")

                  home = match.get("team1")
                  away = match.get("team2")

                  if not date:
                      continue

                  if not home:
                      continue

                  if not away:
                      continue

                  result = extract_score(
                      match.get("score")
                  )

                  # Se non c'è risultato finale,
                  # la partita non entra nello storico.
                  if result is None:
                      continue

                  home_goals = result[0]
                  away_goals = result[1]

                  key = (
                      str(date)[:10],
                      home,
                      away
                  )

                  if key in history_keys:
                      continue

                  fixture_id = create_id(
                      season,
                      country,
                      league,
                      date,
                      home,
                      away
                  )

                  item = {

                      "fixtureId":
                          fixture_id,

                      "source":
                          "OpenFootball",

                      "date":
                          date,

                      "timestamp":
                          0,

                      "status":
                          "FT",

                      "country":
                          country,

                      "league":
                          league,

                      "leagueId":
                          None,

                      "season":
                          season,

                      "round":
                          match.get("round"),

                      "home": {
                          "id":
                              None,

                          "name":
                              home
                      },

                      "away": {
                          "id":
                              None,

                          "name":
                              away
                      },

                      "goals": {
                          "home":
                              home_goals,

                          "away":
                              away_goals
                      }
                  }

                  history.append(item)

                  history_keys.add(key)

                  imported_league += 1
                  total_imported += 1

              print(
                  f"  {len(matches)} partite | "
                  f"+{imported_league} importate"
              )

          # =====================================================
          # ORDINA
          #
          # OpenFootball non usa timestamp Unix nel nostro formato,
          # quindi usiamo la data come ordinamento principale.
          # =====================================================

          history.sort(
              key=lambda x: (
                  str(
                      x.get("date", "")
                  )[:10],
                  str(
                      x.get("fixtureId", "")
                  )
              )
          )

          # =====================================================
          # SALVA
          # =====================================================

          output = {

              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "total":
                  len(history),

              "sources": [
                  "API-Football",
                  "OpenFootball"
              ],

              "matches":
                  history
          }

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("=================================")
          print("RISULTATO IMPORT")
          print("=================================")

          print(
              "Dataset riusciti:",
              successful_datasets
          )

          print(
              "Dataset falliti:",
              failed_datasets
          )

          print(
              "Partite lette:",
              total_downloaded
          )

          print(
              "Nuove partite importate:",
              total_imported
          )

          print(
              "Totale storico BETLAB:",
              len(history)
          )

          print()
          print(
              "BETLAB OPENFOOTBALL IMPORT OK"
          )

          PY

      - name: Salva storico BETLAB
        run: |
          git config user.name "BETLAB AI Bot"
          git config user.email "actions@github.com"

          git add data/betlab-history.json

          if git diff --cached --quiet
          then
            echo "Nessun nuovo dato."
          else
            git commit -m "Importa storico OpenFootball"

            git pull --rebase origin main

            git push origin main
          fi
