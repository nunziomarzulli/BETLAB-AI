          # ==========================================================
          # ANALISI + QUOTE
          # ==========================================================

          analysis = []

          matches_with_candidates = 0
          total_market_candidates = 0
          total_candidates_with_odds = 0
          exact_scores_with_odds = 0
          stale_or_insufficient_matches = 0
          recent_eligible_matches = 0


          # ==========================================================
          # DATI CONTESTUALI PRE-PARTITA - SOLO FONTI VERIFICABILI
          # ==========================================================
          # Il piano API-Football Free non consente /injuries?ids=.
          # Non inviamo richieste vietate e non deduciamo la rosa completa.
          # Le assenze non cambiano probabilita' senza dati sull'impatto.

          # Piano API-Football Free: il parametro "ids" di /injuries e'
          # stato rifiutato dal provider. Evitiamo chiamate note come vietate
          # e non trasformiamo mai la mancanza di dati in "rosa completa".
          injuries_by_fixture = {}
          requested_injury_ids = set()
          injuries_api_status = "non_disponibile_piano"
          injury_fetch_note = (
              "Indisponibilita' non verificabili con il piano API attuale: "
