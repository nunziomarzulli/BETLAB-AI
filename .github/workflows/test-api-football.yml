name: Aggiorna feed BETLAB

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: BETLAB Prediction Engine V7
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import math
          import unicodedata
          import urllib.request
          import urllib.parse

          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo


          API_KEY = os.environ["API_FOOTBALL_KEY"]

          ROME = ZoneInfo("Europe/Rome")

          TODAY = datetime.now(ROME).date()
          TOMORROW = TODAY + timedelta(days=1)

          DAYS = [
              TODAY.isoformat(),
              TOMORROW.isoformat()
          ]

          MAX_HISTORY = 10
          MAX_SCORE_GOALS = 5

          MIN_MARKET_INDEX = 55.0
          MIN_EXACT_SCORE_PROBABILITY = 0.025


          # ==========================================================
          # UTILITA
          # ==========================================================

          def normalize(value):

              value = str(value or "")

              value = unicodedata.normalize(
                  "NFKD",
                  value
              )

              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )

              value = value.lower()

              value = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  value
              )

              return " ".join(
                  value.split()
              )


          ALIASES = {

              "atletico mg":
                  "atletico mineiro",

              "ca mineiro":
                  "atletico mineiro",

              "clube atletico mineiro":
                  "atletico mineiro",

              "atletico mineiro":
                  "atletico mineiro",

              "rb bragantino":
                  "bragantino",

              "red bull bragantino":
                  "bragantino",

              "bragantino":
                  "bragantino",

              "real sociedad ii":
                  "real sociedad b",

              "real sociedad b":
                  "real sociedad b",

              "ud las palmas":
                  "las palmas",

              "las palmas":
                  "las palmas",

              "valladolid":
                  "real valladolid",

              "real valladolid":
                  "real valladolid",

              "sporting gijon":
                  "sporting gijon",

              "real sporting de gijon":
                  "sporting gijon",

              "sporting de gijon":
                  "sporting gijon",

              "castellon":
                  "castellon",

              "cd castellon":
                  "castellon",

              "rcd mallorca":
                  "mallorca",

              "mallorca":
                  "mallorca",

              "internazionale":
                  "inter",

              "inter milan":
                  "inter",

              "ac milan":
                  "milan",

              "manchester united":
                  "manchester united",

              "man utd":
                  "manchester united",

              "manchester city":
                  "manchester city",

              "man city":
                  "manchester city",

              "wolverhampton wanderers":
                  "wolves",

              "paris saint germain":
                  "psg",

              "paris sg":
                  "psg",

              "bayern munich":
                  "bayern munchen",

              "bayern munchen":
                  "bayern munchen",

              "atletico madrid":
                  "atletico madrid",

              "atletico de madrid":
                  "atletico madrid"

          }


          def canonical(value):

              key = normalize(value)

              return ALIASES.get(
                  key,
                  key
              )


          def safe_float(value):

              try:
                  return float(value)

              except:
                  return None


          def clamp(value, low, high):

              return max(
                  low,
                  min(
                      high,
                      value
                  )
              )


          # ==========================================================
          # API
          # ==========================================================

          def api_get(endpoint, params):

              query = urllib.parse.urlencode(
                  params
              )

              url = (
                  "https://v3.football.api-sports.io/"
                  + endpoint
                  + "?"
                  + query
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key":
                          API_KEY
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=45
              ) as response:

                  payload = json.loads(
                      response.read().decode(
                          "utf-8"
                      )
                  )

              errors = payload.get(
                  "errors"
              )

              if errors:
                  raise RuntimeError(
                      f"API ERROR {endpoint}: {errors}"
                  )

              return payload


          # ==========================================================
          # FILE JSON
          # ==========================================================

          def load_json(path, default):

              if not os.path.exists(path):
                  return default

              try:

                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      return json.load(f)

              except:

                  return default


          def save_json(path, data):

              os.makedirs(
                  os.path.dirname(path),
                  exist_ok=True
              )

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # ==========================================================
          # SCARICA OGGI + DOMANI
          # ==========================================================

          all_api_matches = []

          print("")
          print("==============================================")
          print("BETLAB MULTI-MARKET ENGINE V7")
          print("==============================================")
          print("")


          for day in DAYS:

              payload = api_get(
                  "fixtures",
                  {
                      "date": day
                  }
              )

              fixtures = (
                  payload.get("response")
                  or
                  []
              )

              all_api_matches.extend(
                  fixtures
              )

              future_path = (
                  f"data/future/{day}.json"
              )

              save_json(
                  future_path,
                  payload
              )

              print(
                  day,
                  ":",
                  len(fixtures),
                  "partite"
              )


          # ==========================================================
          # DEDUPE API
          # ==========================================================

          api_by_id = {}

          for item in all_api_matches:

              fixture_id = (
                  item.get("fixture", {})
                  .get("id")
              )

              if fixture_id is not None:

                  api_by_id[
                      fixture_id
                  ] = item


          all_api_matches = list(
              api_by_id.values()
          )


          print(
              "Partite API uniche:",
              len(all_api_matches)
          )


          # ==========================================================
          # STORICO
          # ==========================================================

          history_payload = load_json(
              "data/betlab-history.json",
              []
          )


          if isinstance(
              history_payload,
              dict
          ):

              history = (
                  history_payload.get("matches")
                  or
                  history_payload.get("history")
                  or
                  []
              )

          else:

              history = history_payload


          print(
              "Storico iniziale:",
              len(history)
          )


          # ==========================================================
          # FUNZIONI STORICO
          # ==========================================================

          def historical_team_name(
              record,
              side
          ):

              value = record.get(side)

              if isinstance(value, dict):

                  return value.get(
                      "name"
                  )

              return value


          def historical_goals(record):

              home_goals = record.get(
                  "homeGoals"
              )

              away_goals = record.get(
                  "awayGoals"
              )

              if (
                  home_goals is not None
                  and
                  away_goals is not None
              ):

                  return (
                      home_goals,
                      away_goals
                  )


              goal_data = (
                  record.get("goals")
                  or
                  {}
              )

              return (
                  goal_data.get("home"),
                  goal_data.get("away")
              )


          def logical_history_key(record):

              date = str(
                  record.get("date")
                  or
                  ""
              )[:10]

              home = historical_team_name(
                  record,
                  "home"
              )

              away = historical_team_name(
                  record,
                  "away"
              )

              return (
                  date,
                  canonical(home),
                  canonical(away)
              )


          # ==========================================================
          # AGGIUNGI RISULTATI COMPLETATI API
          # ==========================================================

          existing_keys = set()

          for record in history:

              key = logical_history_key(
                  record
              )

              if (
                  key[0]
                  and
                  key[1]
                  and
                  key[2]
              ):

                  existing_keys.add(
                      key
                  )


          new_results = 0


          for item in all_api_matches:

              fixture = (
                  item.get("fixture")
                  or
                  {}
              )

              status = (
                  fixture.get("status")
                  or
                  {}
              ).get("short")


              if status not in {
                  "FT",
                  "AET",
                  "PEN"
              }:
                  continue


              teams = (
                  item.get("teams")
                  or
                  {}
              )

              goals = (
                  item.get("goals")
                  or
                  {}
              )


              home = (
                  teams.get("home")
                  or
                  {}
              ).get("name")

              away = (
                  teams.get("away")
                  or
                  {}
              ).get("name")


              hg = goals.get("home")
              ag = goals.get("away")


              if (
                  not home
                  or
                  not away
                  or
                  hg is None
                  or
                  ag is None
              ):
                  continue


              date = str(
                  fixture.get("date")
                  or
                  ""
              )[:10]


              key = (
                  date,
                  canonical(home),
                  canonical(away)
              )


              if key in existing_keys:
                  continue


              league = (
                  item.get("league")
                  or
                  {}
              )


              history.append({

                  "source":
                      "api-football",

                  "fixtureId":
                      fixture.get("id"),

                  "date":
                      date,

                  "timestamp":
                      fixture.get(
                          "timestamp",
                          0
                      ),

                  "country":
                      league.get(
                          "country"
                      ),

                  "league":
                      league.get(
                          "name"
                      ),

                  "home":
                      home,

                  "away":
                      away,

                  "homeGoals":
                      int(hg),

                  "awayGoals":
                      int(ag)

              })


              existing_keys.add(
                  key
              )

              new_results += 1


          # ==========================================================
          # DEDUPE STORICO LOGICO
          # ==========================================================

          unique_history = {}

          for record in history:

              key = logical_history_key(
                  record
              )

              if not all(key):
                  continue


              old = unique_history.get(
                  key
              )


              if old is None:

                  unique_history[
                      key
                  ] = record

                  continue


              old_source = str(
                  old.get("source")
                  or
                  ""
              )

              new_source = str(
                  record.get("source")
                  or
                  ""
              )


              if (
                  new_source == "api-football"
                  and
                  old_source != "api-football"
              ):

                  unique_history[
                      key
                  ] = record


          history = list(
              unique_history.values()
          )


          history.sort(
              key=lambda record:
                  str(
                      record.get("date")
                      or
                      ""
                  )
          )


          save_json(
              "data/betlab-history.json",
              history
          )


          print(
              "Nuovi risultati API:",
              new_results
          )

          print(
              "Storico totale:",
              len(history)
          )


          # ==========================================================
          # PRIORITA CAMPIONATI
          # ==========================================================

          def league_priority(
              country,
              league
          ):

              c = normalize(country)
              l = normalize(league)


              if (
                  "champions league" in l
                  or
                  "europa league" in l
                  or
                  "conference league" in l
              ):
                  return 5


              priority5 = [

                  ("italy", "serie a"),
                  ("england", "premier league"),
                  ("spain", "la liga"),
                  ("spain", "primera division"),
                  ("germany", "bundesliga"),
                  ("france", "ligue 1")

              ]


              for pc, pl in priority5:

                  if (
                      pc in c
                      and
                      pl in l
                  ):
                      return 5


              priority4 = [

                  ("italy", "serie b"),
                  ("england", "championship"),
                  ("spain", "segunda"),
                  ("germany", "2 bundesliga"),
                  ("france", "ligue 2"),
                  ("portugal", "primeira"),
                  ("netherlands", "eredivisie"),
                  ("belgium", ""),
                  ("turkey", "")

              ]


              for pc, pl in priority4:

                  if (
                      pc in c
                      and
                      (
                          not pl
                          or
                          pl in l
                      )
                  ):
                      return 4


              priority3 = [

                  ("brazil", "serie a"),
                  ("argentina", ""),
                  ("scotland", ""),
                  ("usa", "major league soccer"),
                  ("united states", "major league soccer"),
                  ("mexico", "liga mx")

              ]


              for pc, pl in priority3:

                  if (
                      pc in c
                      and
                      (
                          not pl
                          or
                          pl in l
                      )
                  ):
                      return 3


              priority2 = [

                  "greece",
                  "austria",
                  "switzerland",
                  "denmark",
                  "norway",
                  "sweden"

              ]


              for pc in priority2:

                  if pc in c:
                      return 2


              return 0


          # ==========================================================
          # PARTITE STORICHE SQUADRA
          # ==========================================================

          def team_games(
              team,
              before_date,
              limit=MAX_HISTORY
          ):

              key = canonical(team)

              games = []


              for record in history:

                  date = str(
                      record.get("date")
                      or
                      ""
                  )[:10]


                  if (
                      not date
                      or
                      date >= before_date
                  ):
                      continue


                  home = historical_team_name(
                      record,
                      "home"
                  )

                  away = historical_team_name(
                      record,
                      "away"
                  )


                  hg, ag = historical_goals(
                      record
                  )


                  if (
                      not home
                      or
                      not away
                      or
                      hg is None
                      or
                      ag is None
                  ):
                      continue


                  if canonical(home) == key:

                      games.append({

                          "date":
                              date,

                          "gf":
                              int(hg),

                          "ga":
                              int(ag),

                          "home":
                              True

                      })


                  elif canonical(away) == key:

                      games.append({

                          "date":
                              date,

                          "gf":
                              int(ag),

                          "ga":
                              int(hg),

                          "home":
                              False

                      })


              games.sort(
                  key=lambda x:
                      x["date"]
              )


              return games[
                  -limit:
              ]


          # ==========================================================
          # STATISTICHE
          # ==========================================================

          def team_stats(games):

              played = len(games)

              if played == 0:

                  return {

                      "played": 0,
                      "wins": 0,
                      "draws": 0,
                      "losses": 0,
                      "gf": 0,
                      "ga": 0,
                      "ppg": 0,
                      "avgGF": 0,
                      "avgGA": 0

                  }


              wins = 0
              draws = 0
              losses = 0
              gf = 0
              ga = 0


              for game in games:

                  gf += game["gf"]
                  ga += game["ga"]


                  if game["gf"] > game["ga"]:
                      wins += 1

                  elif game["gf"] == game["ga"]:
                      draws += 1

                  else:
                      losses += 1


              points = (
                  wins * 3
                  +
                  draws
              )


              return {

                  "played":
                      played,

                  "wins":
                      wins,

                  "draws":
                      draws,

                  "losses":
                      losses,

                  "gf":
                      gf,

                  "ga":
                      ga,

                  "ppg":
                      round(
                          points / played,
                          3
                      ),

                  "avgGF":
                      round(
                          gf / played,
                          3
                      ),

                  "avgGA":
                      round(
                          ga / played,
                          3
                      )

              }


          # ==========================================================
          # FREQUENZE EVENTI
          # ==========================================================

          def event_frequency(
              games,
              predicate
          ):

              if not games:
                  return 0.5


              hits = sum(
                  1
                  for game in games
                  if predicate(game)
              )


              return (
                  hits /
                  len(games)
              )


          def adjusted_probability(
              raw,
              sample_size
          ):

              factor = min(
                  sample_size / 10.0,
                  1.0
              )

              return (
                  0.50
                  +
                  (
                      raw - 0.50
                  )
                  *
                  factor
              )


          def combined_probability(
              home_games,
              away_games,
              home_predicate,
              away_predicate
          ):

              sample_size = (
                  len(home_games)
                  +
                  len(away_games)
              )


              if sample_size == 0:
                  return 0.5


              home_freq = event_frequency(
                  home_games,
                  home_predicate
              )

              away_freq = event_frequency(
                  away_games,
                  away_predicate
              )


              raw = (
                  home_freq
                  +
                  away_freq
              ) / 2


              return adjusted_probability(
                  raw,
                  sample_size
              )


          # ==========================================================
          # POISSON RISULTATO ESATTO
          # ==========================================================

          def weighted_average(
              games,
              field
          ):

              if not games:
                  return None


              total = 0.0
              weights = 0.0


              for index, game in enumerate(
                  games,
                  start=1
              ):

                  weight = index

                  total += (
                      game[field]
                      *
                      weight
                  )

                  weights += weight


              return (
                  total /
                  weights
              )


          def expected_goals(
              home_games,
              away_games
          ):

              home_attack = weighted_average(
                  home_games,
                  "gf"
              )

              home_defence = weighted_average(
                  home_games,
                  "ga"
              )

              away_attack = weighted_average(
                  away_games,
                  "gf"
              )

              away_defence = weighted_average(
                  away_games,
                  "ga"
              )


              if None in {
                  home_attack,
                  home_defence,
                  away_attack,
                  away_defence
              }:

                  return None, None


              home_xg = (
                  home_attack
                  +
                  away_defence
              ) / 2


              away_xg = (
                  away_attack
                  +
                  home_defence
              ) / 2


              home_xg *= 1.08
              away_xg *= 0.92


              home_xg = clamp(
                  home_xg,
                  0.25,
                  3.50
              )

              away_xg = clamp(
                  away_xg,
                  0.20,
                  3.50
              )


              return (
                  home_xg,
                  away_xg
              )


          def poisson_probability(
              goals,
              expected
          ):

              return (
                  math.exp(-expected)
                  *
                  expected ** goals
                  /
                  math.factorial(goals)
              )


          # ==========================================================
          # CANDIDATI PARTITA
          # ==========================================================

          def create_candidate(
              market,
              selection,
              probability,
              source="frequency"
          ):

              probability = clamp(
                  probability,
                  0.01,
                  0.99
              )


              return {

                  "market":
                      market,

                  "selection":
                      selection,

                  "modelProbability":
                      round(
                          probability,
                          5
                      ),

                  "index":
                      round(
                          probability * 100,
                          1
                      ),

                  "model":
                      source,

                  "oddAvailable":
                      False,

                  "odd":
                      None,

                  "bookmaker":
                      None,

                  "apiMarket":
                      None,

                  "apiSelection":
                      None,

                  "value":
                      None

              }


          def build_market_candidates(
              home_games,
              away_games
          ):

              candidates = []

              sample_size = (
                  len(home_games)
                  +
                  len(away_games)
              )


              if (
                  len(home_games) == 0
                  or
                  len(away_games) == 0
              ):

                  return candidates


              # ------------------------------------------------------
              # 1 / X / 2
              # ------------------------------------------------------

              home_win = combined_probability(
                  home_games,
                  away_games,
                  lambda g:
                      g["gf"] > g["ga"],
                  lambda g:
                      g["gf"] < g["ga"]
              )

              draw = combined_probability(
                  home_games,
                  away_games,
                  lambda g:
                      g["gf"] == g["ga"],
                  lambda g:
                      g["gf"] == g["ga"]
              )

              away_win = combined_probability(
                  home_games,
                  away_games,
                  lambda g:
                      g["gf"] < g["ga"],
                  lambda g:
                      g["gf"] > g["ga"]
              )


              total_1x2 = (
                  home_win
                  +
                  draw
                  +
                  away_win
              )


              if total_1x2 > 0:

                  home_win /= total_1x2
                  draw /= total_1x2
                  away_win /= total_1x2


              candidates.extend([

                  create_candidate(
                      "1X2",
                      "1",
                      home_win
                  ),

                  create_candidate(
                      "1X2",
                      "X",
                      draw
                  ),

                  create_candidate(
                      "1X2",
                      "2",
                      away_win
                  )

              ])


              # ------------------------------------------------------
              # DOPPIA CHANCE
              # ------------------------------------------------------

              candidates.extend([

                  create_candidate(
                      "Doppia Chance",
                      "1X",
                      clamp(
                          home_win + draw,
                          0,
                          0.99
                      )
                  ),

                  create_candidate(
                      "Doppia Chance",
                      "X2",
                      clamp(
                          draw + away_win,
                          0,
                          0.99
                      )
                  ),

                  create_candidate(
                      "Doppia Chance",
                      "12",
                      clamp(
                          home_win + away_win,
                          0,
                          0.99
                      )
                  )

              ])


              # ------------------------------------------------------
              # GOAL / NO GOAL
              # ------------------------------------------------------

              btts = combined_probability(
                  home_games,
                  away_games,
                  lambda g:
                      g["gf"] > 0
                      and
                      g["ga"] > 0,
                  lambda g:
                      g["gf"] > 0
                      and
                      g["ga"] > 0
              )


              candidates.extend([

                  create_candidate(
                      "Goal/No Goal",
                      "GOAL",
                      btts
                  ),

                  create_candidate(
                      "Goal/No Goal",
                      "NO GOAL",
                      1 - btts
                  )

              ])


              # ------------------------------------------------------
              # OVER / UNDER
              # ------------------------------------------------------

              for line in [
                  1.5,
                  2.5,
                  3.5
              ]:

                  over = combined_probability(
                      home_games,
                      away_games,
                      lambda g, line=line:
                          (
                              g["gf"]
                              +
                              g["ga"]
                          ) > line,
                      lambda g, line=line:
                          (
                              g["gf"]
                              +
                              g["ga"]
                          ) > line
                  )


                  candidates.extend([

                      create_candidate(
                          "Totale Gol",
                          f"OVER {line}",
                          over
                      ),

                      create_candidate(
                          "Totale Gol",
                          f"UNDER {line}",
                          1 - over
                      )

                  ])


              # ------------------------------------------------------
              # PARI / DISPARI
              # ------------------------------------------------------

              even = combined_probability(
                  home_games,
                  away_games,
                  lambda g:
                      (
                          g["gf"]
                          +
                          g["ga"]
                      ) % 2 == 0,
                  lambda g:
                      (
                          g["gf"]
                          +
                          g["ga"]
                      ) % 2 == 0
              )


              candidates.extend([

                  create_candidate(
                      "Pari/Dispari",
                      "PARI",
                      even
                  ),

                  create_candidate(
                      "Pari/Dispari",
                      "DISPARI",
                      1 - even
                  )

              ])


              # ------------------------------------------------------
              # SOMMA GOL
              # ------------------------------------------------------

              ranges = [

                  (
                      "0-1",
                      lambda total:
                          total <= 1
                  ),

                  (
                      "2-3",
                      lambda total:
                          2 <= total <= 3
                  ),

                  (
                      "4-5",
                      lambda total:
                          4 <= total <= 5
                  ),

                  (
                      "6+",
                      lambda total:
                          total >= 6
                  )

              ]


              for label, condition in ranges:

                  probability = (
                      combined_probability(
                          home_games,
                          away_games,
                          lambda g, condition=condition:
                              condition(
                                  g["gf"]
                                  +
                                  g["ga"]
                              ),
                          lambda g, condition=condition:
                              condition(
                                  g["gf"]
                                  +
                                  g["ga"]
                              )
                      )
                  )


                  candidates.append(
                      create_candidate(
                          "Somma Gol",
                          label,
                          probability
                      )
                  )


              # ------------------------------------------------------
              # RISULTATI ESATTI
              # ------------------------------------------------------

              if (
                  len(home_games) >= 3
                  and
                  len(away_games) >= 3
              ):

                  home_xg, away_xg = (
                      expected_goals(
                          home_games,
                          away_games
                      )
                  )


                  if (
                      home_xg is not None
                      and
                      away_xg is not None
                  ):

                      for hg in range(
                          MAX_SCORE_GOALS + 1
                      ):

                          for ag in range(
                              MAX_SCORE_GOALS + 1
                          ):

                              probability = (

                                  poisson_probability(
                                      hg,
                                      home_xg
                                  )

                                  *

                                  poisson_probability(
                                      ag,
                                      away_xg
                                  )

                              )


                              if (
                                  probability
                                  <
                                  MIN_EXACT_SCORE_PROBABILITY
                              ):
                                  continue


                              candidate = (
                                  create_candidate(
                                      "Risultato Esatto",
                                      f"{hg}:{ag}",
                                      probability,
                                      "poisson"
                                  )
                              )


                              candidate[
                                  "expectedHomeGoals"
                              ] = round(
                                  home_xg,
                                  3
                              )

                              candidate[
                                  "expectedAwayGoals"
                              ] = round(
                                  away_xg,
                                  3
                              )


                              candidates.append(
                                  candidate
                              )


              # ------------------------------------------------------
              # ORDINA
              # ------------------------------------------------------

              candidates.sort(
                  key=lambda c:
                      c["index"],
                  reverse=True
              )


              return candidates


          # ==========================================================
          # MATCHER QUOTE STRETTO
          # ==========================================================

          def market_normalized(
              value
          ):

              return normalize(value)


          def forbidden_market(
              market_name
          ):

              name = market_normalized(
                  market_name
              )


              forbidden = [

                  "first half",
                  "second half",
                  "1st half",
                  "2nd half",
                  "half time",
                  "halftime",
                  "yellow",
                  "card",
                  "booking",
                  "corner",
                  "player",
                  "team total",
                  "home team",
                  "away team",
                  "minute"

              ]


              return any(
                  text in name
                  for text in forbidden
              )


          def score_tuple(value):

              match = re.fullmatch(
                  r"\s*(\d+)\s*[:\-]\s*(\d+)\s*",
                  str(value or "")
              )


              if not match:
                  return None


              return (
                  int(match.group(1)),
                  int(match.group(2))
              )


          def selection_matches(
              candidate,
              api_market,
              api_value
          ):

              if forbidden_market(
                  api_market
              ):
                  return False


              market = candidate[
                  "market"
              ]

              selection = candidate[
                  "selection"
              ]

              m = market_normalized(
                  api_market
              )

              v = normalize(
                  api_value
              )


              # ------------------------------------------------------
              # 1X2
              # ------------------------------------------------------

              if market == "1X2":

                  if m not in {
                      "match winner",
                      "1x2"
                  }:
                      return False


                  if selection == "1":

                      return v in {
                          "home",
                          "1"
                      }


                  if selection == "X":

                      return v in {
                          "draw",
                          "x"
                      }


                  if selection == "2":

                      return v in {
                          "away",
                          "2"
                      }


              # ------------------------------------------------------
              # DOUBLE CHANCE - ESATTO
              # ------------------------------------------------------

              if market == "Doppia Chance":

                  if m != "double chance":
                      return False


                  accepted = {

                      "1X": {
                          "home draw",
                          "1x"
                      },

                      "X2": {
                          "draw away",
                          "x2"
                      },

                      "12": {
                          "home away",
                          "12"
                      }

                  }


                  return (
                      v
                      in
                      accepted.get(
                          selection,
                          set()
                      )
                  )


              # ------------------------------------------------------
              # BTTS
              # ------------------------------------------------------

              if market == "Goal/No Goal":

                  if m not in {
                      "both teams score",
                      "both teams to score"
                  }:
                      return False


                  if selection == "GOAL":

                      return v in {
                          "yes",
                          "goal"
                      }


                  if selection == "NO GOAL":

                      return v in {
                          "no",
                          "no goal"
                      }


              # ------------------------------------------------------
              # OVER / UNDER FULL TIME
              # ------------------------------------------------------

              if market == "Totale Gol":

                  if m not in {
                      "goals over under",
                      "over under",
                      "total goals"
                  }:
                      return False


                  expected = normalize(
                      selection
                  )


                  return (
                      v == expected
                  )


              # ------------------------------------------------------
              # PARI / DISPARI
              # ------------------------------------------------------

              if market == "Pari/Dispari":

                  if m not in {
                      "odd even",
                      "goals odd even"
                  }:
                      return False


                  if selection == "PARI":

                      return v in {
                          "even",
                          "pari"
                      }


                  if selection == "DISPARI":

                      return v in {
                          "odd",
                          "dispari"
                      }


              # ------------------------------------------------------
              # SOMMA GOL
              # ------------------------------------------------------

              if market == "Somma Gol":

                  allowed_markets = {
                      "total goals",
                      "goal bands",
                      "goals range",
                      "total goal range"
                  }


                  if m not in allowed_markets:
                      return False


                  expected = normalize(
                      selection
                  )


                  return (
                      v == expected
                  )


              # ------------------------------------------------------
              # RISULTATO ESATTO FULL TIME
              # ------------------------------------------------------

              if market == "Risultato Esatto":

                  if m not in {
                      "exact score",
                      "correct score",
                      "full time correct score",
                      "fulltime correct score"
                  }:
                      return False


                  api_score = score_tuple(
                      api_value
                  )

                  betlab_score = score_tuple(
                      selection
                  )


                  return (
                      api_score is not None
                      and
                      api_score == betlab_score
                  )


              return False


          # ==========================================================
          # RECUPERA QUOTE FIXTURE
          # ==========================================================

          odds_cache = {}


          def get_fixture_odds(
              fixture_id
          ):

              if fixture_id in odds_cache:

                  return odds_cache[
                      fixture_id
                  ]


              page = 1
              blocks = []


              while True:

                  payload = api_get(
                      "odds",
                      {
                          "fixture":
                              fixture_id,

                          "page":
                              page
                      }
                  )


                  blocks.extend(
                      payload.get(
                          "response"
                      )
                      or
                      []
                  )


                  paging = (
                      payload.get(
                          "paging"
                      )
                      or
                      {}
                  )


                  current = int(
                      paging.get(
                          "current"
                      )
                      or
                      page
                  )

                  total = int(
                      paging.get(
                          "total"
                      )
                      or
                      1
                  )


                  if current >= total:
                      break


                  page += 1


              odds_cache[
                  fixture_id
              ] = blocks


              return blocks


          # ==========================================================
          # ASSOCIA MIGLIORE QUOTA
          # ==========================================================

          def attach_best_odds(
              fixture_id,
              candidates
          ):

              blocks = get_fixture_odds(
                  fixture_id
              )


              for candidate in candidates:

                  best = None


                  for block in blocks:

                      bookmakers = (
                          block.get(
                              "bookmakers"
                          )
                          or
                          []
                      )


                      for bookmaker in bookmakers:

                          bookmaker_name = (
                              bookmaker.get(
                                  "name"
                              )
                              or
                              "Bookmaker"
                          )


                          for bet in (
                              bookmaker.get(
                                  "bets"
                              )
                              or
                              []
                          ):

                              market_name = (
                                  bet.get(
                                      "name"
                                  )
                                  or
                                  ""
                              )


                              for value in (
                                  bet.get(
                                      "values"
                                  )
                                  or
                                  []
                              ):

                                  api_value = (
                                      value.get(
                                          "value"
                                      )
                                  )


                                  if not selection_matches(
                                      candidate,
                                      market_name,
                                      api_value
                                  ):
                                      continue


                                  odd = safe_float(
                                      value.get(
                                          "odd"
                                      )
                                  )


                                  if (
                                      odd is None
                                      or
                                      odd <= 1
                                  ):
                                      continue


                                  if (
                                      best is None
                                      or
                                      odd > best[
                                          "odd"
                                      ]
                                  ):

                                      best = {

                                          "odd":
                                              odd,

                                          "bookmaker":
                                              bookmaker_name,

                                          "apiMarket":
                                              market_name,

                                          "apiSelection":
                                              str(
                                                  api_value
                                              )

                                      }


                  if best is None:
                      continue


                  candidate[
                      "oddAvailable"
                  ] = True

                  candidate[
                      "odd"
                  ] = round(
                      best["odd"],
                      3
                  )

                  candidate[
                      "bookmaker"
                  ] = best[
                      "bookmaker"
                  ]

                  candidate[
                      "apiMarket"
                  ] = best[
                      "apiMarket"
                  ]

                  candidate[
                      "apiSelection"
                  ] = best[
                      "apiSelection"
                  ]


                  probability = candidate[
                      "modelProbability"
                  ]


                  candidate[
                      "value"
                  ] = round(
                      probability
                      *
                      best["odd"],
                      3
                  )


              return candidates


          # ==========================================================
          # COSTRUISCI CANDIDATE PARTITE
          # ==========================================================

          candidate_matches = []


          for item in all_api_matches:

              fixture = (
                  item.get("fixture")
                  or
                  {}
              )

              status = (
                  fixture.get("status")
                  or
                  {}
              ).get("short")


              if status not in {
                  "NS",
                  "TBD"
              }:
                  continue


              league = (
                  item.get("league")
                  or
                  {}
              )

              priority = league_priority(
                  league.get("country"),
                  league.get("name")
              )


              if priority <= 0:
                  continue


              teams = (
                  item.get("teams")
                  or
                  {}
              )


              home = (
                  teams.get("home")
                  or
                  {}
              ).get("name")

              away = (
                  teams.get("away")
                  or
                  {}
              ).get("name")


              if not home or not away:
                  continue


              date = str(
                  fixture.get("date")
                  or
                  ""
              )[:10]


              home_games = team_games(
                  home,
                  date
              )

              away_games = team_games(
                  away,
                  date
              )


              history_score = (
                  len(home_games)
                  +
                  len(away_games)
              )


              candidate_matches.append({

                  "raw":
                      item,

                  "fixtureId":
                      fixture.get("id"),

                  "date":
                      date,

                  "timestamp":
                      fixture.get(
                          "timestamp",
                          0
                      ),

                  "country":
                      league.get(
                          "country"
                      ),

                  "league":
                      league.get(
                          "name"
                      ),

                  "priority":
                      priority,

                  "home":
                      home,

                  "away":
                      away,

                  "homeGames":
                      home_games,

                  "awayGames":
                      away_games,

                  "historyScore":
                      history_score

              })


          candidate_matches.sort(
              key=lambda m: (

                  -int(
                      len(
                          m["homeGames"]
                      ) >= 5
                      and
                      len(
                          m["awayGames"]
                      ) >= 5
                  ),

                  -int(
                      len(
                          m["homeGames"]
                      ) > 0
                      and
                      len(
                          m["awayGames"]
                      ) > 0
                  ),

                  -m[
                      "historyScore"
                  ],

                  -m[
                      "priority"
                  ],

                  m[
                      "timestamp"
                  ]

              )
          )


          print(
              "Candidate oggi + domani:",
              len(candidate_matches)
          )


          # ==========================================================
          # ANALISI + QUOTE
          # ==========================================================

          analysis = []

          matches_with_candidates = 0
          total_market_candidates = 0
          total_candidates_with_odds = 0
          exact_scores_with_odds = 0


          # massimo 30 partite analizzate
          for match in candidate_matches[:30]:

              home_games = match[
                  "homeGames"
              ]

              away_games = match[
                  "awayGames"
              ]


              home_stats = team_stats(
                  home_games
              )

              away_stats = team_stats(
                  away_games
              )


              candidates = (
                  build_market_candidates(
                      home_games,
                      away_games
                  )
              )


              # scarta mercati ordinari sotto indice minimo
              filtered = []


              for candidate in candidates:

                  if (
                      candidate[
                          "market"
                      ]
                      ==
                      "Risultato Esatto"
                  ):

                      filtered.append(
                          candidate
                      )

                  elif (
                      candidate[
                          "index"
                      ]
                      >=
                      MIN_MARKET_INDEX
                  ):

                      filtered.append(
                          candidate
                      )


              candidates = filtered


              if candidates:

                  try:

                      candidates = attach_best_odds(
                          match[
                              "fixtureId"
                          ],
                          candidates
                      )

                  except Exception as exc:

                      print(
                          "ERRORE QUOTE",
                          match["home"],
                          "-",
                          match["away"],
                          ":",
                          exc
                      )


              # solo candidati con quota
              quoted_candidates = [

                  c
                  for c in candidates
                  if c[
                      "oddAvailable"
                  ]

              ]


              quoted_candidates.sort(
                  key=lambda c: (

                      -c[
                          "index"
                      ],

                      -(
                          c[
                              "value"
                          ]
                          or
                          0
                      )

                  )
              )


              if quoted_candidates:

                  matches_with_candidates += 1


              total_market_candidates += len(
                  candidates
              )

              total_candidates_with_odds += len(
                  quoted_candidates
              )


              exact_scores_with_odds += sum(

                  1
                  for c in quoted_candidates
                  if c[
                      "market"
                  ]
                  ==
                  "Risultato Esatto"

              )


              # compatibilità temporanea con vecchia homepage:
              # primo candidato diventa prediction
              if quoted_candidates:

                  best = quoted_candidates[0]


                  prediction = {

                      "available":
                          True,

                      "selection":
                          best[
                              "selection"
                          ],

                      "market":
                          best[
                              "market"
                          ],

                      "confidence":
                          best[
                              "index"
                          ],

                      "oddAvailable":
                          True,

                      "odd":
                          best[
                              "odd"
                          ],

                      "bookmaker":
                          best[
                              "bookmaker"
                          ],

                      "apiMarket":
                          best[
                              "apiMarket"
                          ],

                      "apiSelection":
                          best[
                              "apiSelection"
                          ]

                  }

              else:

                  prediction = {

                      "available":
                          False,

                      "selection":
                          None,

                      "market":
                          None,

                      "confidence":
                          None,

                      "oddAvailable":
                          False,

                      "odd":
                          None,

                      "bookmaker":
                          None

                  }


              analysis.append({

                  "fixtureId":
                      match[
                          "fixtureId"
                      ],

                  "date":
                      match[
                          "date"
                      ],

                  "timestamp":
                      match[
                          "timestamp"
                      ],

                  "country":
                      match[
                          "country"
                      ],

                  "league":
                      match[
                          "league"
                      ],

                  "priority":
                      match[
                          "priority"
                      ],

                  "home": {

                      "name":
                          match[
                              "home"
                          ],

                      "form":
                          home_stats

                  },

                  "away": {

                      "name":
                          match[
                              "away"
                          ],

                      "form":
                          away_stats

                  },

                  "historyScore":
                      match[
                          "historyScore"
                      ],

                  "prediction":
                      prediction,

                  "candidates":
                      quoted_candidates

              })


          # ==========================================================
          # SALVA ANALISI
          # ==========================================================

          output = {

              "engine":
                  "BETLAB V7 MULTI-MARKET",

              "generatedAt":
                  datetime.now(
                      ROME
                  ).isoformat(),

              "days":
                  DAYS,

              "historyCount":
                  len(history),

              "matchesAnalyzed":
                  len(analysis),

              "matchesWithCandidates":
                  matches_with_candidates,

              "marketCandidates":
                  total_market_candidates,

              "candidatesWithOdds":
                  total_candidates_with_odds,

              "exactScoresWithOdds":
                  exact_scores_with_odds,

              "analysis":
                  analysis

          }


          save_json(
              "data/betlab-analysis.json",
              output
          )


          # shortlist semplice
          shortlist = [

              {
                  "fixtureId":
                      m[
                          "fixtureId"
                      ],

                  "date":
                      m[
                          "date"
                      ],

                  "country":
                      m[
                          "country"
                      ],

                  "league":
                      m[
                          "league"
                      ],

                  "home":
                      m[
                          "home"
                      ],

                  "away":
                      m[
                          "away"
                      ],

                  "priority":
                      m[
                          "priority"
                      ],

                  "historyScore":
                      m[
                          "historyScore"
                      ]
              }

              for m in candidate_matches[:50]

          ]


          save_json(
              "data/betlab-shortlist.json",
              shortlist
          )


          # ==========================================================
          # LOG
          # ==========================================================

          print("")
          print("==============================================")
          print("RISULTATO BETLAB V7")
          print("==============================================")

          print(
              "Storico totale:",
              len(history)
          )

          print(
              "Partite analizzate:",
              len(analysis)
          )

          print(
              "Partite con candidati:",
              matches_with_candidates
          )

          print(
              "Candidati mercato generati:",
              total_market_candidates
          )

          print(
              "Candidati con quota:",
              total_candidates_with_odds
          )

          print(
              "Risultati esatti con quota:",
              exact_scores_with_odds
          )


          print("")
          print("TOP CANDIDATI PER PARTITA")
          print("")


          for index, match in enumerate(
              analysis,
              start=1
          ):

              candidates = match.get(
                  "candidates"
              ) or []


              print(
                  f'{index}. '
                  f'{match["home"]["name"]}'
                  f' - '
                  f'{match["away"]["name"]}'
              )


              if not candidates:

                  print(
                      "   NESSUN CANDIDATO CON QUOTA"
                  )

                  continue


              for candidate in candidates[:8]:

                  print(
                      "   "
                      +
                      candidate[
                          "market"
                      ]
                      +
                      " | "
                      +
                      candidate[
                          "selection"
                      ]
                      +
                      " | INDICE "
                      +
                      str(
                          candidate[
                              "index"
                          ]
                      )
                      +
                      "%"
                      +
                      " | @ "
                      +
                      str(
                          candidate[
                              "odd"
                          ]
                      )
                      +
                      " | "
                      +
                      str(
                          candidate[
                              "bookmaker"
                          ]
                      )
                  )


          print("")
          print("==============================================")
          print("BETLAB MULTI-MARKET ENGINE V7 OK")
          print("==============================================")

