name: Aggiorna feed BETLAB

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Scarica oggi e domani API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          mkdir -p data/future
          rm -f data/future/*.json

          TODAY=$(TZ=Europe/Rome date +%Y-%m-%d)
          TOMORROW=$(TZ=Europe/Rome date -d "+1 day" +%Y-%m-%d)

          echo "================================="
          echo "BETLAB DATA ENGINE V6.1"
          echo "Oggi: $TODAY"
          echo "Domani: $TOMORROW"
          echo "================================="

          for DAY in "$TODAY" "$TOMORROW"
          do
            echo "Scarico $DAY..."

            curl --fail --silent --show-error \
              --request GET \
              --url "https://v3.football.api-sports.io/fixtures?date=$DAY" \
              --header "x-apisports-key: $API_FOOTBALL_KEY" \
              -o "data/future/$DAY.json"
          done

      - name: Costruisci BETLAB V6.1
        run: |
          python3 - <<'PY'

          import json
          import os
          import re
          import glob
          import unicodedata
          import difflib

          from datetime import datetime, timezone


          HISTORY = "data/betlab-history.json"
          MATCHES = "data/betlab-matches.json"
          SHORTLIST = "data/betlab-shortlist.json"
          ANALYSIS = "data/betlab-analysis.json"


          # =====================================================
          # CAMPIONATI BETLAB
          # =====================================================

          PRIORITY = {

              ("Italy", "Serie A"): 5,
              ("England", "Premier League"): 5,
              ("Spain", "La Liga"): 5,
              ("Germany", "Bundesliga"): 5,
              ("France", "Ligue 1"): 5,

              ("World", "UEFA Champions League"): 5,
              ("World", "UEFA Europa League"): 5,
              ("World", "UEFA Europa Conference League"): 5,

              ("Italy", "Serie B"): 4,
              ("England", "Championship"): 4,
              ("Spain", "Segunda División"): 4,
              ("Germany", "2. Bundesliga"): 4,
              ("France", "Ligue 2"): 4,

              ("Portugal", "Primeira Liga"): 4,
              ("Netherlands", "Eredivisie"): 4,
              ("Belgium", "Jupiler Pro League"): 4,
              ("Turkey", "Süper Lig"): 4,

              ("Brazil", "Serie A"): 3,
              ("Argentina", "Liga Profesional Argentina"): 3,
              ("Scotland", "Premiership"): 3,
              ("USA", "Major League Soccer"): 3,
              ("Mexico", "Liga MX"): 3,

              ("Greece", "Super League 1"): 2,
              ("Austria", "Bundesliga"): 2,
              ("Switzerland", "Super League"): 2,
              ("Denmark", "Superliga"): 2,
              ("Norway", "Eliteserien"): 2,
              ("Sweden", "Allsvenskan"): 2
          }


          # =====================================================
          # NORMALIZZAZIONE NOMI
          # =====================================================

          def basic_normalize(name):

              if not name:
                  return ""

              name = unicodedata.normalize(
                  "NFKD",
                  str(name)
              )

              name = "".join(
                  c
                  for c in name
                  if not unicodedata.combining(c)
              )

              name = name.lower()
              name = name.replace("&", " and ")

              name = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  name
              )

              return re.sub(
                  r"\s+",
                  " ",
                  name
              ).strip()


          ALIASES = {

              # ==========================
              # BRASILE
              # ==========================

              "atletico mg":
                  "atletico mineiro",

              "ca mineiro":
                  "atletico mineiro",

              "clube atletico mineiro":
                  "atletico mineiro",

              "atletico mineiro":
                  "atletico mineiro",

              "rb bragantino":
                  "bragantino",

              "red bull bragantino":
                  "bragantino",

              "bragantino":
                  "bragantino",


              # ==========================
              # SPAGNA
              # ==========================

              "real sociedad ii":
                  "real sociedad b",

              "real sociedad b":
                  "real sociedad b",

              "las palmas":
                  "las palmas",

              "ud las palmas":
                  "las palmas",

              "valladolid":
                  "real valladolid",

              "real valladolid":
                  "real valladolid",

              "sporting gijon":
                  "sporting gijon",

              "real sporting de gijon":
                  "sporting gijon",

              "sporting de gijon":
                  "sporting gijon",

              "castellon":
                  "castellon",

              "cd castellon":
                  "castellon",

              "atletico madrid":
                  "atletico de madrid",

              "atletico de madrid":
                  "atletico de madrid",


              # ==========================
              # ITALIA
              # ==========================

              "internazionale":
                  "inter",

              "inter milan":
                  "inter",

              "fc internazionale":
                  "inter",

              "internazionale milano":
                  "inter",

              "ac milan":
                  "milan",


              # ==========================
              # INGHILTERRA
              # ==========================

              "man utd":
                  "manchester united",

              "manchester utd":
                  "manchester united",

              "man united":
                  "manchester united",

              "man city":
                  "manchester city",

              "wolves":
                  "wolverhampton wanderers",

              "wolverhampton":
                  "wolverhampton wanderers",


              # ==========================
              # FRANCIA
              # ==========================

              "psg":
                  "paris saint germain",

              "paris sg":
                  "paris saint germain",


              # ==========================
              # GERMANIA
              # ==========================

              "bayern munich":
                  "bayern munchen",

              "bayern munchen":
                  "bayern munchen"
          }


          CLUB_WORDS = {
              "fc",
              "cf",
              "afc",
              "ac",
              "sc",
              "club",
              "football",
              "calcio"
          }


          def canonical_team(name):

              name = basic_normalize(name)

              if not name:
                  return ""

              if name in ALIASES:
                  return ALIASES[name]

              cleaned = " ".join(
                  word
                  for word in name.split()
                  if word not in CLUB_WORDS
              ).strip()

              return ALIASES.get(
                  cleaned,
                  cleaned
              )


          # =====================================================
          # CARICA API
          # =====================================================

          all_api_matches = []

          files = sorted(
              glob.glob(
                  "data/future/*.json"
              )
          )

          print()
          print("=================================")
          print("BETLAB ANALYSIS ENGINE V6.1")
          print("=================================")

          print(
              "Giorni caricati:",
              len(files)
          )


          if not files:
              raise SystemExit(
                  "Nessun file API trovato."
              )


          for filename in files:

              with open(
                  filename,
                  encoding="utf-8"
              ) as f:
                  payload = json.load(f)


              if payload.get("errors"):

                  print(
                      "ERRORE API:",
                      filename,
                      payload["errors"]
                  )

                  raise SystemExit(1)


              response = payload.get(
                  "response",
                  []
              )

              print(
                  os.path.basename(filename),
                  ":",
                  len(response),
                  "partite"
              )

              all_api_matches.extend(
                  response
              )


          # =====================================================
          # DEDUPLICA API
          # =====================================================

          unique_api = {}

          for match in all_api_matches:

              fixture_id = (
                  match
                  .get("fixture", {})
                  .get("id")
              )

              if fixture_id is None:
                  continue

              unique_api[
                  str(fixture_id)
              ] = match


          all_api_matches = list(
              unique_api.values()
          )

          print(
              "Partite API uniche:",
              len(all_api_matches)
          )


          # =====================================================
          # CARICA STORICO
          # =====================================================

          if os.path.exists(HISTORY):

              with open(
                  HISTORY,
                  encoding="utf-8"
              ) as f:
                  history_data = json.load(f)

              history = history_data.get(
                  "matches",
                  []
              )

          else:
              history = []


          print(
              "Storico disponibile:",
              len(history)
          )


          # =====================================================
          # AGGIUNGE RISULTATI API TERMINATI
          # =====================================================

          completed_statuses = {
              "FT",
              "AET",
              "PEN"
          }


          api_fixture_ids = {

              str(
                  match.get("fixtureId")
              )

              for match in history

              if (
                  match.get("source")
                  != "OpenFootball"
                  and
                  match.get("fixtureId")
                  is not None
              )
          }


          added_results = 0


          for match in all_api_matches:

              fixture = match.get(
                  "fixture",
                  {}
              )

              status = (
                  fixture
                  .get("status", {})
                  .get("short")
              )

              if status not in completed_statuses:
                  continue


              fixture_id = fixture.get(
                  "id"
              )

              if fixture_id is None:
                  continue

              if str(fixture_id) in api_fixture_ids:
                  continue


              teams = match.get(
                  "teams",
                  {}
              )

              goals = match.get(
                  "goals",
                  {}
              )


              if (
                  goals.get("home") is None
                  or
                  goals.get("away") is None
              ):
                  continue


              home = teams.get(
                  "home",
                  {}
              )

              away = teams.get(
                  "away",
                  {}
              )

              league = match.get(
                  "league",
                  {}
              )


              history.append({

                  "fixtureId":
                      fixture_id,

                  "source":
                      "API-Football",

                  "date":
                      fixture.get("date"),

                  "timestamp":
                      fixture.get("timestamp"),

                  "status":
                      status,

                  "country":
                      league.get("country"),

                  "league":
                      league.get("name"),

                  "leagueId":
                      league.get("id"),

                  "season":
                      league.get("season"),

                  "round":
                      league.get("round"),

                  "home": {
                      "id":
                          home.get("id"),

                      "name":
                          home.get("name")
                  },

                  "away": {
                      "id":
                          away.get("id"),

                      "name":
                          away.get("name")
                  },

                  "goals": {
                      "home":
                          goals.get("home"),

                      "away":
                          goals.get("away")
                  }

              })

              api_fixture_ids.add(
                  str(fixture_id)
              )

              added_results += 1


          # =====================================================
          # DEDUPLICAZIONE LOGICA STORICO
          # =====================================================

          logical_history = {}


          for match in history:

              date_key = str(
                  match.get(
                      "date",
                      ""
                  )
              )[:10]

              home_key = canonical_team(
                  match
                  .get("home", {})
                  .get("name")
              )

              away_key = canonical_team(
                  match
                  .get("away", {})
                  .get("name")
              )


              if (
                  not date_key
                  or
                  not home_key
                  or
                  not away_key
              ):
                  continue


              key = (
                  date_key,
                  home_key,
                  away_key
              )

              existing = logical_history.get(
                  key
              )


              if existing is None:

                  logical_history[
                      key
                  ] = match

              elif (
                  existing.get("source")
                  == "OpenFootball"
                  and
                  match.get("source")
                  == "API-Football"
              ):

                  logical_history[
                      key
                  ] = match


          analysis_history = list(
              logical_history.values()
          )


          print(
              "Storico unico per analisi:",
              len(analysis_history)
          )


          # =====================================================
          # INDICE PER SQUADRA
          # =====================================================

          team_history = {}

          historical_names = {}


          for match in analysis_history:

              for side in [
                  "home",
                  "away"
              ]:

                  original_name = (
                      match
                      .get(side, {})
                      .get("name")
                  )

                  key = canonical_team(
                      original_name
                  )


                  if not key:
                      continue


                  historical_names.setdefault(
                      key,
                      set()
                  ).add(
                      original_name
                  )


                  team_history.setdefault(
                      key,
                      []
                  ).append(match)


          # =====================================================
          # FORMA ULTIME 5
          # =====================================================

          def calculate_form(
              team_name,
              target_date
          ):

              team_key = canonical_team(
                  team_name
              )

              games = team_history.get(
                  team_key,
                  []
              )

              target_day = str(
                  target_date or ""
              )[:10]

              valid = []


              for match in games:

                  match_day = str(
                      match.get(
                          "date",
                          ""
                      )
                  )[:10]

                  if not match_day:
                      continue

                  if (
                      target_day
                      and
                      match_day >= target_day
                  ):
                      continue


                  goals = match.get(
                      "goals",
                      {}
                  )

                  if (
                      goals.get("home") is None
                      or
                      goals.get("away") is None
                  ):
                      continue

                  valid.append(
                      match
                  )


              valid.sort(
                  key=lambda x:
                      str(
                          x.get(
                              "date",
                              ""
                          )
                      ),
                  reverse=True
              )

              valid = valid[:5]


              wins = 0
              draws = 0
              losses = 0

              goals_for = 0
              goals_against = 0
              points = 0

              recent = []


              for match in valid:

                  home_name = (
                      match
                      .get("home", {})
                      .get("name")
                  )

                  away_name = (
                      match
                      .get("away", {})
                      .get("name")
                  )

                  home_key = canonical_team(
                      home_name
                  )

                  away_key = canonical_team(
                      away_name
                  )

                  home_goals = (
                      match
                      .get("goals", {})
                      .get("home")
                  )

                  away_goals = (
                      match
                      .get("goals", {})
                      .get("away")
                  )


                  if team_key == home_key:

                      gf = home_goals
                      ga = away_goals
                      opponent = away_name
                      venue = "HOME"

                  elif team_key == away_key:

                      gf = away_goals
                      ga = home_goals
                      opponent = home_name
                      venue = "AWAY"

                  else:
                      continue


                  if gf > ga:

                      result = "W"
                      wins += 1
                      points += 3

                  elif gf == ga:

                      result = "D"
                      draws += 1
                      points += 1

                  else:

                      result = "L"
                      losses += 1


                  goals_for += gf
                  goals_against += ga


                  recent.append({

                      "date":
                          match.get("date"),

                      "opponent":
                          opponent,

                      "venue":
                          venue,

                      "goalsFor":
                          gf,

                      "goalsAgainst":
                          ga,

                      "result":
                          result,

                      "source":
                          match.get(
                              "source",
                              "unknown"
                          )
                  })


              played = len(
                  recent
              )


              return {

                  "canonicalName":
                      team_key,

                  "played":
                      played,

                  "wins":
                      wins,

                  "draws":
                      draws,

                  "losses":
                      losses,

                  "goalsFor":
                      goals_for,

                  "goalsAgainst":
                      goals_against,

                  "points":
                      points,

                  "pointsPerGame":
                      (
                          round(
                              points / played,
                              2
                          )
                          if played
                          else None
                      ),

                  "avgGoalsFor":
                      (
                          round(
                              goals_for / played,
                              2
                          )
                          if played
                          else None
                      ),

                  "avgGoalsAgainst":
                      (
                          round(
                              goals_against / played,
                              2
                          )
                          if played
                          else None
                      ),

                  "recent":
                      recent
              }


          # =====================================================
          # PREDICTION ENGINE V1
          # =====================================================

          def analyse_prediction(
              home_form,
              away_form
          ):

              home_recent = home_form.get(
                  "recent",
                  []
              )

              away_recent = away_form.get(
                  "recent",
                  []
              )


              home_count = len(
                  home_recent
              )

              away_count = len(
                  away_recent
              )

              sample_size = (
                  home_count
                  +
                  away_count
              )


              if (
                  home_count == 0
                  or
                  away_count == 0
              ):

                  return {

                      "available":
                          False,

                      "reason":
                          "Storico insufficiente",

                      "sampleSize":
                          sample_size
                  }


              def team_rate(
                  games,
                  condition
              ):

                  if not games:
                      return 0.0

                  hits = sum(
                      1
                      for game in games
                      if condition(game)
                  )

                  return (
                      hits
                      /
                      len(games)
                  )


              def combined_rate(
                  condition
              ):

                  games = (
                      home_recent
                      +
                      away_recent
                  )

                  if not games:
                      return 0.0

                  hits = sum(
                      1
                      for game in games
                      if condition(game)
                  )

                  return (
                      hits
                      /
                      len(games)
                  )


              home_win = team_rate(
                  home_recent,
                  lambda g:
                      g.get("result") == "W"
              )

              home_draw = team_rate(
                  home_recent,
                  lambda g:
                      g.get("result") == "D"
              )

              home_loss = team_rate(
                  home_recent,
                  lambda g:
                      g.get("result") == "L"
              )

              away_win = team_rate(
                  away_recent,
                  lambda g:
                      g.get("result") == "W"
              )

              away_draw = team_rate(
                  away_recent,
                  lambda g:
                      g.get("result") == "D"
              )

              away_loss = team_rate(
                  away_recent,
                  lambda g:
                      g.get("result") == "L"
              )


              score_1 = (
                  home_win
                  +
                  away_loss
              ) / 2

              score_x = (
                  home_draw
                  +
                  away_draw
              ) / 2

              score_2 = (
                  away_win
                  +
                  home_loss
              ) / 2


              score_1x = (
                  (1 - home_loss)
                  +
                  (1 - away_win)
              ) / 2

              score_x2 = (
                  (1 - away_loss)
                  +
                  (1 - home_win)
              ) / 2

              score_12 = (
                  (1 - home_draw)
                  +
                  (1 - away_draw)
              ) / 2


              score_goal = combined_rate(
                  lambda g:
                      (
                          g.get(
                              "goalsFor",
                              0
                          ) > 0
                          and
                          g.get(
                              "goalsAgainst",
                              0
                          ) > 0
                      )
              )

              score_nogoal = (
                  1 - score_goal
              )


              score_over15 = combined_rate(
                  lambda g:
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      ) >= 2
              )

              score_under15 = (
                  1 - score_over15
              )


              score_over25 = combined_rate(
                  lambda g:
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      ) >= 3
              )

              score_under25 = (
                  1 - score_over25
              )


              score_over35 = combined_rate(
                  lambda g:
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      ) >= 4
              )

              score_under35 = (
                  1 - score_over35
              )


              score_even = combined_rate(
                  lambda g:
                      (
                          (
                              g.get(
                                  "goalsFor",
                                  0
                              )
                              +
                              g.get(
                                  "goalsAgainst",
                                  0
                              )
                          )
                          % 2
                      ) == 0
              )

              score_odd = (
                  1 - score_even
              )


              score_01 = combined_rate(
                  lambda g:
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      ) <= 1
              )


              score_23 = combined_rate(
                  lambda g:
                      2
                      <=
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      )
                      <= 3
              )


              score_45 = combined_rate(
                  lambda g:
                      4
                      <=
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      )
                      <= 5
              )


              score_6plus = combined_rate(
                  lambda g:
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      ) >= 6
              )


              markets = [

                  {
                      "market": "1X2",
                      "prediction": "1",
                      "rawScore": score_1
                  },

                  {
                      "market": "1X2",
                      "prediction": "X",
                      "rawScore": score_x
                  },

                  {
                      "market": "1X2",
                      "prediction": "2",
                      "rawScore": score_2
                  },

                  {
                      "market": "Doppia Chance",
                      "prediction": "1X",
                      "rawScore": score_1x
                  },

                  {
                      "market": "Doppia Chance",
                      "prediction": "X2",
                      "rawScore": score_x2
                  },

                  {
                      "market": "Doppia Chance",
                      "prediction": "12",
                      "rawScore": score_12
                  },

                  {
                      "market": "Goal/No Goal",
                      "prediction": "GOAL",
                      "rawScore": score_goal
                  },

                  {
                      "market": "Goal/No Goal",
                      "prediction": "NO GOAL",
                      "rawScore": score_nogoal
                  },

                  {
                      "market": "Totale Gol",
                      "prediction": "OVER 1.5",
                      "rawScore": score_over15
                  },

                  {
                      "market": "Totale Gol",
                      "prediction": "UNDER 1.5",
                      "rawScore": score_under15
                  },

                  {
                      "market": "Totale Gol",
                      "prediction": "OVER 2.5",
                      "rawScore": score_over25
                  },

                  {
                      "market": "Totale Gol",
                      "prediction": "UNDER 2.5",
                      "rawScore": score_under25
                  },

                  {
                      "market": "Totale Gol",
                      "prediction": "OVER 3.5",
                      "rawScore": score_over35
                  },

                  {
                      "market": "Totale Gol",
                      "prediction": "UNDER 3.5",
                      "rawScore": score_under35
                  },

                  {
                      "market": "Pari/Dispari",
                      "prediction": "PARI",
                      "rawScore": score_even
                  },

                  {
                      "market": "Pari/Dispari",
                      "prediction": "DISPARI",
                      "rawScore": score_odd
                  },

                  {
                      "market": "Somma Gol",
                      "prediction": "0-1 GOL",
                      "rawScore": score_01
                  },

                  {
                      "market": "Somma Gol",
                      "prediction": "2-3 GOL",
                      "rawScore": score_23
                  },

                  {
                      "market": "Somma Gol",
                      "prediction": "4-5 GOL",
                      "rawScore": score_45
                  },

                  {
                      "market": "Somma Gol",
                      "prediction": "6+ GOL",
                      "rawScore": score_6plus
                  }
              ]


              sample_factor = min(
                  sample_size / 10,
                  1.0
              )


              for market in markets:

                  raw = market[
                      "rawScore"
                  ]

                  adjusted = (
                      0.50
                      +
                      (
                          raw - 0.50
                      )
                      *
                      sample_factor
                  )

                  market[
                      "confidence"
                  ] = round(
                      adjusted * 100,
                      1
                  )


              markets.sort(
                  key=lambda x:
                      x["confidence"],
                  reverse=True
              )


              best = markets[0]


              if best["confidence"] < 55:

                  return {

                      "available":
                          False,

                      "reason":
                          "Segnale statistico insufficiente",

                      "sampleSize":
                          sample_size
                  }


              return {

                  "available":
                      True,

                  "market":
                      best["market"],

                  "prediction":
                      best["prediction"],

                  "confidence":
                      best["confidence"],

                  "sampleSize":
                      sample_size
              }


          # =====================================================
          # CREA CANDIDATE
          # =====================================================

          candidates = []


          for match in all_api_matches:

              fixture = match.get(
                  "fixture",
                  {}
              )

              status = (
                  fixture
                  .get("status", {})
                  .get("short")
              )

              if status not in {
                  "NS",
                  "TBD"
              }:
                  continue


              league = match.get(
                  "league",
                  {}
              )

              country = league.get(
                  "country",
                  ""
              )

              league_name = league.get(
                  "name",
                  ""
              )

              priority = PRIORITY.get(
                  (
                      country,
                      league_name
                  )
              )

              if priority is None:
                  continue


              teams = match.get(
                  "teams",
                  {}
              )

              home = teams.get(
                  "home",
                  {}
              )

              away = teams.get(
                  "away",
                  {}
              )


              if (
                  not home.get("name")
                  or
                  not away.get("name")
              ):
                  continue


              home_form = calculate_form(
                  home["name"],
                  fixture.get("date")
              )

              away_form = calculate_form(
                  away["name"],
                  fixture.get("date")
              )


              history_score = (
                  home_form["played"]
                  +
                  away_form["played"]
              )


              prediction = analyse_prediction(
                  home_form,
                  away_form
              )


              candidates.append({

                  "fixtureId":
                      fixture.get("id"),

                  "date":
                      fixture.get("date"),

                  "timestamp":
                      fixture.get("timestamp"),

                  "status":
                      status,

                  "country":
                      country,

                  "league":
                      league_name,

                  "priority":
                      priority,

                  "historyScore":
                      history_score,

                  "dataCoverage":
                      round(
                          history_score / 10,
                          2
                      ),

                  "prediction":
                      prediction,

                  "home": {

                      "id":
                          home.get("id"),

                      "name":
                          home.get("name"),

                      "form":
                          home_form
                  },

                  "away": {

                      "id":
                          away.get("id"),

                      "name":
                          away.get("name"),

                      "form":
                          away_form
                  }
              })


          # =====================================================
          # DIAGNOSTICA NOMI V6.1
          # =====================================================

          print()
          print("=================================")
          print("DIAGNOSTICA NOMI SQUADRE V6.1")
          print("=================================")


          history_keys = list(
              team_history.keys()
          )


          checked = set()


          for match in candidates:

              for side in [
                  "home",
                  "away"
              ]:

                  team = match[
                      side
                  ]

                  name = team[
                      "name"
                  ]

                  form = team[
                      "form"
                  ]


                  if form[
                      "played"
                  ] > 0:
                      continue


                  api_key = canonical_team(
                      name
                  )


                  if api_key in checked:
                      continue


                  checked.add(
                      api_key
                  )


                  matches = difflib.get_close_matches(
                      api_key,
                      history_keys,
                      n=3,
                      cutoff=0.45
                  )


                  print()
                  print(
                      "API:",
                      name
                  )

                  print(
                      "CANONICA:",
                      api_key
                  )


                  if not matches:

                      print(
                          "NESSUNA CORRISPONDENZA "
                          "PLAUSIBILE NELLO STORICO"
                      )

                      continue


                  for candidate_key in matches:

                      similarity = (
                          difflib.SequenceMatcher(
                              None,
                              api_key,
                              candidate_key
                          ).ratio()
                          * 100
                      )


                      originals = sorted(
                          historical_names.get(
                              candidate_key,
                              []
                          )
                      )


                      print(
                          "POSSIBILE STORICO:",
                          " / ".join(
                              originals[:5]
                          )
                      )

                      print(
                          "CANONICA STORICO:",
                          candidate_key
                      )

                      print(
                          "SIMILARITÀ:",
                          f"{similarity:.1f}%"
                      )


          # =====================================================
          # ORDINAMENTO
          # =====================================================

          def rank(match):

              prediction = match.get(
                  "prediction",
                  {}
              )

              available = (
                  1
                  if prediction.get(
                      "available"
                  )
                  else 0
              )

              confidence = (
                  prediction.get(
                      "confidence",
                      0
                  )
                  if available
                  else 0
              )

              home_played = (
                  match["home"]
                  ["form"]
                  ["played"]
              )

              away_played = (
                  match["away"]
                  ["form"]
                  ["played"]
              )

              complete = (
                  1
                  if (
                      home_played == 5
                      and
                      away_played == 5
                  )
                  else 0
              )

              both = (
                  1
                  if (
                      home_played > 0
                      and
                      away_played > 0
                  )
                  else 0
              )


              return (

                  -available,
                  -confidence,
                  -complete,
                  -both,
                  -match["historyScore"],
                  -match["priority"],
                  match.get(
                      "timestamp"
                  ) or 0
              )


          candidates.sort(
              key=rank
          )


          shortlist = candidates[:50]
          analysis = candidates[:30]


          # =====================================================
          # LOG PRONOSTICI
          # =====================================================

          print()
          print("=================================")
          print("PRONOSTICI BETLAB V1")
          print("=================================")


          for index, match in enumerate(
              analysis,
              start=1
          ):

              print()

              print(
                  f"{index}. "
                  f"{match['home']['name']} - "
                  f"{match['away']['name']}"
              )

              print(
                  "STORICO:",
                  f"{match['home']['form']['played']}"
                  "+"
                  f"{match['away']['form']['played']}"
              )


              prediction = match.get(
                  "prediction",
                  {}
              )


              if prediction.get(
                  "available"
              ):

                  print(
                      "PRONOSTICO:",
                      prediction.get(
                          "prediction"
                      )
                  )

                  print(
                      "MERCATO:",
                      prediction.get(
                          "market"
                      )
                  )

                  print(
                      "INDICE BETLAB:",
                      str(
                          prediction.get(
                              "confidence"
                          )
                      )
                      + "%"
                  )

                  print(
                      "CAMPIONE:",
                      prediction.get(
                          "sampleSize"
                      )
                  )

              else:

                  print(
                      "NESSUN PRONOSTICO:",
                      prediction.get(
                          "reason"
                      )
                  )


          # =====================================================
          # SALVATAGGIO
          # =====================================================

          generated_at = datetime.now(
              timezone.utc
          ).isoformat()


          history.sort(
              key=lambda x:
                  str(
                      x.get(
                          "date",
                          ""
                      )
                  )
          )


          outputs = [

              (
                  HISTORY,

                  {
                      "updatedAt":
                          generated_at,

                      "total":
                          len(history),

                      "sources": [
                          "API-Football",
                          "OpenFootball"
                      ],

                      "matches":
                          history
                  }
              ),

              (
                  MATCHES,

                  {
                      "generatedAt":
                          generated_at,

                      "engine":
                          "BETLAB V6.1",

                      "total":
                          len(candidates),

                      "matches":
                          candidates
                  }
              ),

              (
                  SHORTLIST,

                  {
                      "generatedAt":
                          generated_at,

                      "engine":
                          "BETLAB V6.1",

                      "total":
                          len(shortlist),

                      "candidates":
                          shortlist
                  }
              ),

              (
                  ANALYSIS,

                  {
                      "generatedAt":
                          generated_at,

                      "engine":
                          "BETLAB ANALYSIS V6.1",

                      "predictionEngine":
                          "BETLAB PREDICTION V1",

                      "matchesAnalyzed":
                          len(analysis),

                      "analysis":
                          analysis
                  }
              )
          ]


          for path, data in outputs:

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          predictions_available = sum(

              1

              for match in candidates

              if (
                  match
                  .get(
                      "prediction",
                      {}
                  )
                  .get(
                      "available"
                  )
              )
          )


          both_data = sum(

              1

              for match in candidates

              if (
                  match["home"]
                  ["form"]
                  ["played"] > 0

                  and

                  match["away"]
                  ["form"]
                  ["played"] > 0
              )
          )


          complete = sum(

              1

              for match in candidates

              if (
                  match["home"]
                  ["form"]
                  ["played"] == 5

                  and

                  match["away"]
                  ["form"]
                  ["played"] == 5
              )
          )


          print()
          print("=================================")
          print("RISULTATO BETLAB V6.1")
          print("=================================")

          print(
              "Storico totale:",
              len(history)
          )

          print(
              "Storico unico analisi:",
              len(analysis_history)
          )

          print(
              "Nuovi risultati API:",
              added_results
          )

          print(
              "Candidate oggi + domani:",
              len(candidates)
          )

          print(
              "Entrambe con storico:",
              both_data
          )

          print(
              "Copertura completa 5+5:",
              complete
          )

          print(
              "Pronostici disponibili:",
              predictions_available
          )

          print()
          print(
              "BETLAB V6.1 OK"
          )

          PY

