          def venue_summary(games, is_home):
              subset = [g for g in games if g.get("home") is is_home]
              n = len(subset)
              if not n:
                  return {"played": 0, "wins": 0, "draws": 0, "losses": 0,
                          "avgGF": None, "avgGA": None}
              return {
                  "played": n,
                  "wins": sum(g["gf"] > g["ga"] for g in subset),
                  "draws": sum(g["gf"] == g["ga"] for g in subset),
                  "losses": sum(g["gf"] < g["ga"] for g in subset),
                  "avgGF": round(sum(g["gf"] for g in subset) / n, 2),
                  "avgGA": round(sum(g["ga"] for g in subset) / n, 2)
              }

          # Un intervallo e' interpretabile soltanto se il calendario storico
          # e' abbastanza recente. Non equivale comunque a riposo verificato.
          MAX_REST_LOOKBACK_DAYS = 21

          def rest_before(games, match_date):
              if not games:
                  return {"days": None, "status": "storico_insufficiente",
                          "lastRecorded": None, "ageDays": None}
              try:
                  target_date = datetime.fromisoformat(match_date).date()
                  dates = [datetime.fromisoformat(str(g["date"])[:10]).date()
                           for g in games if g.get("date")]
                  prior_dates = [date for date in dates if date < target_date]
                  if not prior_dates:
                      return {"days": None, "status": "storico_insufficiente",
                              "lastRecorded": None, "ageDays": None}
                  last_date = max(prior_dates)
                  gap = (target_date - last_date).days
                  if gap > MAX_REST_LOOKBACK_DAYS:
                      return {"days": None, "status": "storico_non_recente",
                              "lastRecorded": last_date.isoformat(), "ageDays": gap}
                  return {"days": max(0, gap - 1), "status": "indicativo",
                          "lastRecorded": last_date.isoformat(), "ageDays": gap}
              except (ValueError, TypeError, KeyError):
                  return {"days": None, "status": "storico_insufficiente",
                          "lastRecorded": None, "ageDays": None}

          def fixture_context(match):
              raw = match.get("raw") or {}
              team_raw = raw.get("teams") or {}
              h_id = (team_raw.get("home") or {}).get("id")
              a_id = (team_raw.get("away") or {}).get("id")
              fid = int(match["fixtureId"])
              fixture = raw.get("fixture") or {}
              venue = fixture.get("venue") or {}
              valid_ids = (isinstance(h_id, int) and isinstance(a_id, int)
                           and h_id != a_id)
              fetched = fid in requested_injury_ids and injuries_api_status == "consultata"
              # Almeno una segnalazione verificabile per la fixture e le squadre corrette.
              injuries = ([row for row in injuries_by_fixture.get(fid, [])
                           if row["teamId"] in {h_id, a_id}] if valid_ids and fetched else [])
              has_reports = bool(injuries)
              def by_side(team_id):
                  unique = {}
                  for item in injuries:
                      if item["teamId"] != team_id:
                          continue
                      key = str(item.get("playerId") or item["name"])
                      unique[key] = item
                  return list(unique.values())[:15]

              if not valid_ids:
                  injury_note = "Identificativi delle squadre incoerenti: assenze non verificabili"
              elif not fetched:
                  injury_note = injury_fetch_note
              elif not has_reports:
                  injury_note = "Endpoint consultato, ma nessuna segnalazione ricevuta per questa partita: non equivale a rosa completa"
              else:
                  injury_note = "Segnalazioni presenti in API-Football; elenco potenzialmente incompleto e aggiornabile"

              home_gap = rest_before(match["homeGames"], match["date"])
              away_gap = rest_before(match["awayGames"], match["date"])
              return {
                  "source": raw.get("_source") or "API-Football + storico BETLAB",
                  "generatedAt": datetime.now(ROME).isoformat(),
                  "injuriesStatus": "disponibile" if has_reports else "non_verificato",
                  "injuriesRequestStatus": injuries_api_status,
                  "injuriesNote": injury_note,
                  "homeInjuries": by_side(h_id) if has_reports else [],
                  "awayInjuries": by_side(a_id) if has_reports else [],
                  "homeVenueForm": venue_summary(match["homeGames"], True),
                  "awayVenueForm": venue_summary(match["awayGames"], False),
                  "homeRestDays": home_gap["days"],
                  "awayRestDays": away_gap["days"],
                  "homeRestStatus": home_gap["status"],
                  "awayRestStatus": away_gap["status"],
                  "homeLastRecorded": home_gap["lastRecorded"],
                  "awayLastRecorded": away_gap["lastRecorded"],
                  "homeHistoryAgeDays": home_gap["ageDays"],
                  "awayHistoryAgeDays": away_gap["ageDays"],
                  "historyEligible": match["historyEligible"],
                  "historyQuality": match["historyQuality"],
                  "venue": {"name": str(venue.get("name") or "")[:120],
                            "city": str(venue.get("city") or "")[:100]},
                  "homeTeamId": h_id,
                  "awayTeamId": a_id,
                  "lineupsStatus": "non_verificato",
                  "note": "Le assenze e il riposo non modificano ancora automaticamente i gol attesi. Una gara datata oltre 21 giorni non documenta il riposo effettivo."
              }

          # analizza tutte le partite candidate disponibili
          for match in candidate_matches:

              home_games = match[
                  "homeGames"
              ]

              away_games = match[
                  "awayGames"
              ]


              home_stats = team_stats(
                  home_games
              )

              away_stats = team_stats(
                  away_games
              )


              # Due percorsi INDIPENDENTI:
              # 1) distribuzione probabilistica mostrata anche se fragile;
              # 2) selezione quotata solo con storia verificata.
              raw_model_candidates = build_market_candidates(home_games, away_games)
              if match["historyEligible"]:
                  recent_eligible_matches += 1
                  candidates = [dict(c) for c in raw_model_candidates]
              else:
                  stale_or_insufficient_matches += 1
                  candidates = []

              # Una stima con pochi incontri non e' un consiglio di giocata.
              # Il riepilogo e' derivato dalla medesima Poisson coerente per
              # tutti i mercati; le quote non sono necessarie per descriverlo.
              def model_probability(market, selection):
                  return next((c["modelProbability"] for c in raw_model_candidates
                               if c["market"] == market and c["selection"] == selection), None)

              raw_scores = [c for c in raw_model_candidates
                            if c["market"] == "Risultato Esatto"]
              raw_scores.sort(key=lambda c: -c["modelProbability"])
              sample_min = min(len(home_games), len(away_games))
              can_display_score = (sample_min >= MIN_EXACT_SCORE_GAMES
                                   and match["historyEligible"])
              if not raw_model_candidates:
                  model_state = "non_calcolabile"
                  model_note = ("Servono almeno 4 partite storiche per ciascuna squadra prima "
                                "del calcio d'inizio; non presentiamo il prior come previsione.")
              elif not match["historyEligible"]:
                  model_state = "esplorativa"
                  model_note = "Campione ridotto o datato: valori matematici esplorativi, non validati e non utilizzabili come consigli di giocata."
              else:
                  model_state = "campione_idoneo"
                  model_note = "Storico sufficiente per calcolare la distribuzione. Le percentuali non sono calibrate e non implicano un consiglio di giocata."
              xh, xa = expected_goals(home_games, away_games)
              model_analysis = {
                  "status": model_state,
                  "note": model_note,
                  "homeGames": len(home_games),
                  "awayGames": len(away_games),
                  "source": "storico_squadre_poisson_indipendente",
                  "exactScoreEligible": can_display_score,
                  "expectedGoals": {"home": round(xh, 3) if xh is not None else None,
                                    "away": round(xa, 3) if xa is not None else None},
                  "probabilities": {
                      "1": model_probability("1X2", "1"),
                      "X": model_probability("1X2", "X"),
                      "2": model_probability("1X2", "2"),
                      "1X": model_probability("Doppia Chance", "1X"),
                      "X2": model_probability("Doppia Chance", "X2"),
                      "12": model_probability("Doppia Chance", "12"),
                      "GOAL": model_probability("Goal/No Goal", "GOAL"),
                      "NO GOAL": model_probability("Goal/No Goal", "NO GOAL"),
                      "OVER 1.5": model_probability("Totale Gol", "OVER 1.5"),
                      "UNDER 1.5": model_probability("Totale Gol", "UNDER 1.5"),
                      "OVER 2.5": model_probability("Totale Gol", "OVER 2.5"),
                      "UNDER 2.5": model_probability("Totale Gol", "UNDER 2.5"),
                      "OVER 3.5": model_probability("Totale Gol", "OVER 3.5"),
                      "UNDER 3.5": model_probability("Totale Gol", "UNDER 3.5"),
                      "PARI": model_probability("Pari/Dispari", "PARI"),
                      "DISPARI": model_probability("Pari/Dispari", "DISPARI")
                  },
                  "topScores": [
                      {"score": c["selection"].replace(":", "-"),
                       "probability": c["modelProbability"]}
                      for c in (raw_scores[:3] if can_display_score else [])
                  ],
                  "scoreNote": ("Tre punteggi stimati da storico recente" if can_display_score
                                else "Risultati esatti non mostrati: storico recente insufficiente")
              }


              # scarta mercati ordinari sotto indice minimo
              filtered = []


              for candidate in candidates:

                  if (
                      candidate[
                          "market"
                      ]
                      ==
                      "Risultato Esatto"
                  ):

                      filtered.append(
                          candidate
                      )

                  elif (
                      candidate[
                          "index"
                      ]
                      >=
                      MIN_MARKET_INDEX
                  ):

                      filtered.append(
                          candidate
                      )


              candidates = filtered


              if candidates:

                  try:

                      candidates = attach_best_odds(
                          match[
                              "fixtureId"
                          ],
                          candidates
                      )

                  except Exception as exc:

                      print(
                          "ERRORE QUOTE",
                          match["home"],
                          "-",
                          match["away"],
                          ":",
                          exc
                      )


              # Mercati che il modello ha effettivamente esaminato PRIMA dei filtri.
              # Non sono selezioni consigliate: quota e probabilita' vengono conservate
              # nell'analisi per permettere controlli e confronti trasparenti.
              analytical_market_options = sorted(
                  ({
                      "market": c["market"], "selection": c["selection"],
                      "modelProbability": c["modelProbability"],
                      "odd": c["odd"], "bookmaker": c["bookmaker"],
                      "oddsSources": c.get("oddsSources", 0),
                      "status": "solo_analisi_non_approvato"
                  } for c in candidates if c.get("oddAvailable")
                    and c.get("market") != "Risultato Esatto"
                    and c.get("modelProbability") is not None
                    and safe_float(c.get("odd")) is not None),
                  key=lambda c: (-float(c["modelProbability"]), float(c["odd"]))
              )[:8]

              # Consulta al massimo 8 fixture importanti con storico insufficiente:
              # consenso bookmaker, mai spacciare il mercato per previsione BETLAB.
              if (not match["historyEligible"] and match["priority"] >= 4
                  and reference_lookups < MARKET_REFERENCE_LIMIT):
                  reference_lookups += 1
                  try:
                      get_fixture_odds(match["fixtureId"])
                  except Exception as exc:
                      print("Riferimento quote indisponibile:", match["fixtureId"],
                            str(exc)[:100])

              # solo candidati con quota
              market_consensus = market_1x2_consensus(match["fixtureId"])
              home_opp_strength = opponent_strength(home_games, match["date"])
              away_opp_strength = opponent_strength(away_games, match["date"])
              risk_signals = {
                  "market1X2": market_consensus,
                  "opponentStrength": {
                      "home": home_opp_strength,
                      "away": away_opp_strength
                  },
                  "relativeFormPPG": round(home_stats["ppg"] - away_stats["ppg"], 3),
                  "blockedSelections": [],
                  "newsStatus": "non_verificato_nessun_feed_notizie",
                  "officialStandingStatus": "non_verificata_nessun_feed_classifica",
                  "homeWinStreak": consecutive_wins(home_games),
                  "awayWinStreak": consecutive_wins(away_games),
                  "drawOdd": draw_market_odd(match["fixtureId"]),
                  "drawAttention": False,
                  "engineModel": "poisson_v10_uncalibrated"
              }
              risk_signals["drawAttention"] = (
                  risk_signals["drawOdd"] is not None
                  and risk_signals["drawOdd"] <= 3.00
              )

              quoted_candidates = [
                  c for c in candidates
                  if c.get("oddAvailable")
                  and safe_float(c.get("odd")) is not None
                  and MIN_ODD <= safe_float(c.get("odd")) <= MAX_RECOMMENDED_ODD
                  and safe_float(c.get("modelProbability")) is not None
                  and safe_float(c.get("modelProbability")) >= MIN_RECOMMENDED_PROBABILITY
              ]


              # Controlli sul feed, indipendenti dalla pagina web.
              # Non pubblicare consigli su un vantaggio apparente enorme:
              # spesso e' un errore di stima o un prezzo non comparabile.
              def passes_risk_controls(c):
                  if c["market"] == "Risultato Esatto":
                      return False
                  selection = str(c.get("selection") or "").upper()
                  if c["market"] in {"1X2", "Doppia Chance"}:
                      # Se mancano almeno 3 triplette 1X2 affidabili,
                      # non consigliamo questo mercato (resta nell'analisi).
                      consensus_p = consensus_for_market(
                          market_consensus, c["market"], selection)
                      if consensus_p is None:
                          risk_signals["blockedSelections"].append(
                              f"{c['market']} {selection}: confronto 1X2 non verificabile")
                          return False
                      c["marketFairProbability"] = round(consensus_p, 5)
                      c["marketConsensusGap"] = round(
                          c["modelProbability"] - consensus_p, 5)
                      # Il valore apparente non puo' basarsi su un errore
                      # di probabilita' superiore a 7,5 punti sul mercato.
                      if c["modelProbability"] - consensus_p > 0.075:
                          risk_signals["blockedSelections"].append(
                              f"{c['market']} {selection}: modello "
                              f"{c['modelProbability']*100:.1f}% vs mercato "
                              f"{consensus_p*100:.1f}%")
                          return False
                      # Forma direzionale controindicata: altra difesa
                      # se un X2 copre squadra nettamente peggiore.
                      diff = risk_signals["relativeFormPPG"]
                      market_home = market_consensus["probabilities"]["1"]
                      market_away = market_consensus["probabilities"]["2"]
                      if (c["market"] == "Doppia Chance"
                          and selection == "X2" and diff >= 0.70
                          and market_home >= 0.51 and market_home-market_away >= 0.22):
                          return False
                      if (c["market"] == "Doppia Chance"
                          and selection == "1X" and diff <= -0.70
                          and market_away >= 0.51 and market_away-market_home >= 0.22):
                          return False
                  if c["market"] == "1X2":
                      if selection == "1" and risk_signals["homeWinStreak"] >= 6:
                          return False
                      if selection == "2" and risk_signals["awayWinStreak"] >= 6:
                          return False
                      if (selection in {"1", "2"} and risk_signals["drawAttention"]
                          and c["modelProbability"] < 0.63):
                          return False
                  p_model = c["modelProbability"]
                  p_odd = 1.0 / float(c["odd"])
                  if p_model - p_odd > 0.12 or p_model / p_odd > 1.40:
                      return False
                  return True

              quoted_candidates = [c for c in quoted_candidates
                                   if passes_risk_controls(c)]

              # La selezione e' decisa UNA VOLTA dal motore, non ricalcolata
              # dalla pagina con filtri di una vecchia versione.
              def selection_score(c):
                  p = float(c["modelProbability"])
                  odd = float(c["odd"])
                  implied = 1.0 / odd
                  n = min(len(home_games), len(away_games), 10)
                  # Margine sperimentale e prudente, non EV certificato.
                  conservative_p = implied + 0.40 * (n / 10.0) * (p - implied)
                  edge = conservative_p * odd - 1.0
                  return (edge * math.sqrt(max(0.0, conservative_p)) /
                          (1.0 + 0.50 * math.log(odd)))

              for c in quoted_candidates:
                  c["selectionScore"] = round(selection_score(c), 6)
                  c["selectionApproved"] = c["selectionScore"] > 0
                  c["selectionPolicy"] = "engine_only"
              # Conserviamo la soglia corrente nel motore; non fingiamo valore
              # economico quando la probabilita' non e' stata calibrata.
              quoted_candidates = [c for c in quoted_candidates if
                                   c["selectionApproved"] and
                                   ((1.0 / c["odd"] + 0.40 *
                                     (min(len(home_games), len(away_games), 10) / 10.0) *
                                     (c["modelProbability"] - 1.0 / c["odd"])) *
                                    c["odd"] - 1.0) >= 0.06]
              quoted_candidates.sort(key=lambda c: (-c["selectionScore"],
                                                    -c["modelProbability"]))


              if quoted_candidates:

                  matches_with_candidates += 1


              total_market_candidates += len(
                  candidates
              )

              total_candidates_with_odds += len(
                  quoted_candidates
              )


              exact_scores_with_odds += sum(

                  1
                  for c in quoted_candidates
                  if c[
                      "market"
                  ]
                  ==
                  "Risultato Esatto"

              )


              # compatibilità temporanea con vecchia homepage:
              # primo candidato diventa prediction
              if quoted_candidates:

                  best = quoted_candidates[0]


                  prediction = {

                      "available":
                          True,

                      "selection":
                          best[
                              "selection"
                          ],

                      "market":
                          best[
                              "market"
                          ],

                      "confidence":
                          best[
                              "index"
                          ],

                      "oddAvailable":
                          True,

                      "odd":
                          best[
                              "odd"
                          ],

                      "bookmaker":
                          best[
                              "bookmaker"
                          ],

                      "apiMarket":
                          best[
                              "apiMarket"
                          ],

                      "apiSelection":
                          best[
                              "apiSelection"
                          ]

                  }

              else:

                  prediction = {

                      "available":
                          False,

                      "selection":
                          None,

                      "market":
                          None,

                      "confidence":
                          None,

                      "oddAvailable":
                          False,

                      "odd":
                          None,

                      "bookmaker":
                          None

                  }


              analysis.append({

                  "fixtureId":
                      match[
                          "fixtureId"
                      ],

                  "date":
                      match[
                          "date"
                      ],

                  "timestamp":
                      match[
                          "timestamp"
                      ],

                  "country":
                      match[
                          "country"
                      ],

                  "league":
                      match[
                          "league"
                      ],

                  "priority":
                      match[
                          "priority"
                      ],

                  "home": {

                      "name":
                          match[
                              "home"
                          ],

                      "form":
                          home_stats

                  },

                  "away": {

                      "name":
                          match[
                              "away"
                          ],

                      "form":
                          away_stats

                  },

                  "historyScore":
                      match[
                          "historyScore"
                      ],

                  "historyEligible": match["historyEligible"],
                  "historyQuality": match["historyQuality"],

                  "context": fixture_context(match),
                  "riskSignals": risk_signals,
                  "modelAnalysis": model_analysis,
                  "analyzedMarketOptions": analytical_market_options,

                  "prediction":
                      prediction,

                  "candidates":
                      quoted_candidates

              })


          print("Contesto indisponibili:", len(requested_injury_ids),
                "fixture richieste |", injury_fetch_note,
                "| stato:", injuries_api_status)
          print("Storico recente idoneo:", recent_eligible_matches,
                "| esclusi per date/campione:", stale_or_insufficient_matches)

          # ==========================================================
          # REGISTRO IMMUTABILE PRONOSTICI PRE-PARTITA
          # Una selezione per fixture, alla prima analisi disponibile.
          # ==========================================================

          prediction_log_path = "data/betlab-predictions-log.json"
          prediction_log = load_json(prediction_log_path, [])
          if not isinstance(prediction_log, list):
              prediction_log = []

          logged_ids = {
              str(row.get("fixtureId"))
              for row in prediction_log
              if isinstance(row, dict) and row.get("fixtureId") is not None
          }
          recorded_at = datetime.now(ROME).isoformat()
          recorded_ts = int(datetime.now(ROME).timestamp())
          added_predictions = 0

          for match in analysis:
              fixture_id = match.get("fixtureId")
              kickoff_ts = int(match.get("timestamp") or 0)
              quoted = match.get("candidates") or []
              if (fixture_id is None or str(fixture_id) in logged_ids
                  or kickoff_ts <= recorded_ts or not quoted):
                  continue
              pick = quoted[0]
              prediction_log.append({
                  "fixtureId": fixture_id,
                  "date": match.get("date"),
                  "timestamp": kickoff_ts,
                  "country": match.get("country"),
                  "league": match.get("league"),
                  "home": match["home"]["name"],
                  "away": match["away"]["name"],
                  "market": pick["market"],
                  "selection": pick["selection"],
                  "odd": pick["odd"],
                  "bookmaker": pick.get("bookmaker"),
                  "index": pick["index"],
                  "recordedAt": recorded_at,
                  "status": "IN_ATTESA",
                  "homeGoals": None,
                  "awayGoals": None
              })
              logged_ids.add(str(fixture_id))
              added_predictions += 1

          def grade_pick(market, selection, hg, ag):
              market = str(market or "").lower()
              selection = str(selection or "").strip().upper()
              total = hg + ag
              outcome = "1" if hg > ag else ("2" if ag > hg else "X")
              if market == "1x2":
                  return outcome == selection
              if market == "doppia chance":
                  return outcome in selection
              if market == "goal/no goal":
                  return (hg > 0 and ag > 0) if selection == "GOAL" else (hg == 0 or ag == 0)
              if market == "totale gol":
                  parts = selection.split()
                  if len(parts) != 2:
                      return None
                  try:
                      threshold = float(parts[1])
                  except ValueError:
                      return None
                  return total > threshold if parts[0] == "OVER" else total < threshold if parts[0] == "UNDER" else None
              if market == "pari/dispari":
                  return (total % 2 == 0) if selection == "PARI" else (total % 2 != 0)
              if market == "somma gol":
                  if selection.endswith("+"):
                      return total >= int(selection[:-1])
                  if "-" in selection:
                      a, b = selection.split("-", 1)
                      return int(a) <= total <= int(b)
              if market == "risultato esatto":
                  return selection.replace("-", ":") == f"{hg}:{ag}"
              return None

          results_by_id = {}
          results_by_key = {}
          for item in all_api_matches:
              fixture = item.get("fixture") or {}
              if (fixture.get("status") or {}).get("short") not in {"FT", "AET", "PEN"}:
                  continue
              goals = item.get("goals") or {}
              if goals.get("home") is None or goals.get("away") is None:
                  continue
              teams = item.get("teams") or {}
              home = (teams.get("home") or {}).get("name")
              away = (teams.get("away") or {}).get("name")
              result = (int(goals["home"]), int(goals["away"]))
              results_by_id[str(fixture.get("id"))] = result
              results_by_key[(str(fixture.get("date") or "")[:10], canonical(home), canonical(away))] = result

          # Lo storico persistente consente anche la liquidazione nei run successivi.
          for record in history:
              hg, ag = historical_goals(record)
              if hg is None or ag is None:
                  continue
              result = (int(hg), int(ag))
              if record.get("fixtureId") is not None:
                  results_by_id[str(record["fixtureId"])] = result
              results_by_key[logical_history_key(record)] = result

          settled_predictions = 0
          for row in prediction_log:
              if not isinstance(row, dict) or row.get("status") != "IN_ATTESA":
                  continue
              result = results_by_id.get(str(row.get("fixtureId")))
              if result is None:
                  result = results_by_key.get((str(row.get("date") or "")[:10], canonical(row.get("home")), canonical(row.get("away"))))
              if result is None:
                  continue
              hg, ag = result
              verdict = grade_pick(row.get("market"), row.get("selection"), hg, ag)
              if verdict is None:
                  continue
              row["homeGoals"] = hg
              row["awayGoals"] = ag
              row["status"] = "VINTA" if verdict else "PERSA"
              row["settledAt"] = recorded_at
              settled_predictions += 1

          save_json(prediction_log_path, prediction_log)

          # ==========================================================
          # AUDIT DI QUALITA' IN PROSPETTIVA: UNA FOTO PRIMA DEL VIA
          # ==========================================================
          # Non attribuire successi retroattivi a pronostici calcolati
          # dopo che la partita e' iniziata. Una fixture -> un solo snapshot.
          FORECAST_LOG_PATH = "data/betlab-model-forecast-log.json"
          forecast_log = load_json(FORECAST_LOG_PATH, [])
          if not isinstance(forecast_log, list):
              forecast_log = []
          known_forecast_ids = {str(r.get("fixtureId")) for r in forecast_log
                                if isinstance(r, dict) and r.get("fixtureId") is not None}
          forecast_new = 0
          for m in analysis:
              fid = m.get("fixtureId")
              if (fid is None or str(fid) in known_forecast_ids
                  or int(m.get("timestamp") or 0) <= recorded_ts):
                  continue
              model = m.get("modelAnalysis") or {}
              probabilities = model.get("probabilities") or {}
              triple = [probabilities.get(k) for k in ("1", "X", "2")]
              if model.get("status") != "campione_idoneo" or any(
                      p is None or not 0 <= float(p) <= 1 for p in triple):
                  continue
              fair = ((m.get("riskSignals") or {}).get("market1X2") or {})
              forecast_log.append({
                  "fixtureId": fid, "timestamp": int(m.get("timestamp") or 0),
                  "date": m.get("date"), "home": m["home"]["name"],
                  "away": m["away"]["name"], "recordedAt": recorded_at,
                  "source": "pre_kickoff_model_only", "status": "IN_ATTESA",
                  "probabilities": {k: probabilities.get(k) for k in
                                    ("1", "X", "2", "OVER 2.5", "UNDER 2.5")},
                  "market": fair.get("probabilities") if fair.get("available") else None
              })
              known_forecast_ids.add(str(fid))
              forecast_new += 1

          forecast_settled = 0
          for r in forecast_log:
              if not isinstance(r, dict) or r.get("status") != "IN_ATTESA":
                  continue
              fid = str(r.get("fixtureId"))
              if fid not in results_by_id:
                  continue
              hg, ag = results_by_id[fid]
              side = "1" if hg > ag else ("2" if ag > hg else "X")
              pp = r.get("probabilities") or {}
              r["outcome"] = side
              r["homeGoals"] = hg
              r["awayGoals"] = ag
              r["status"] = "VALUTATO"
              r["settledAt"] = recorded_at
              r["correct1X2"] = max(("1", "X", "2"), key=lambda k: pp.get(k) or 0) == side
              r["brier1X2"] = round(sum((float(pp.get(k) or 0) - int(k == side))**2
                                          for k in ("1", "X", "2")), 6)
              r["correctOver25"] = ((hg + ag > 2) ==
                                     (float(pp.get("OVER 2.5") or 0) > 0.5))
              forecast_settled += 1

          save_json(FORECAST_LOG_PATH, forecast_log)
          evaluated_forecasts = [r for r in forecast_log if
                                 isinstance(r, dict) and r.get("status") == "VALUTATO"
                                 and r.get("brier1X2") is not None]
          n_valid = len(evaluated_forecasts)
          validation = {
              "status": "campione_in_raccolta" if n_valid < 30 else "campione_valutabile",
              "forecastRecorded": len(forecast_log),
              "forecastEvaluated": n_valid,
              "minimumForSummary": 30,
              "correct1X2": sum(bool(r.get("correct1X2")) for r in evaluated_forecasts),
              "meanBrier1X2": round(sum(float(r["brier1X2"]) for r in evaluated_forecasts)
                                          / n_valid, 4) if n_valid else None,
              "note": "Solo previsioni archiviate PRIMA del calcio d'inizio. Brier 1X2: minore e' meglio; nessuna prova di redditivita'."
          }
          print("Audit ex-ante:", forecast_new, "nuovi |", forecast_settled,
                "valutati ora |", n_valid, "valutati complessivi")
          print("Pronostici pre-partita registrati:", added_predictions)
          print("Pronostici liquidati:", settled_predictions)
          print("Totale registro:", len(prediction_log))

          # ==========================================================
          # BETLAB AI — Historical walk-forward validation.
          # Uses only games dated BEFORE each prediction; same-day results are hidden.
          # This evaluates 1X2 probabilistic calibration, not bookmakers/financial returns.
          from collections import defaultdict, deque

          def run_walk_forward_backtest(records, today, canonical_name,
                                        historical_name, goal_parser, model_builder,
                                        min_recent=5, window_days=90, max_last_age=30,
                                        max_history=12, recent_test_days=270):
              """Return a retrospective rolling evaluation; not a guarantee of future accuracy."""
              from datetime import datetime, timedelta
              from math import log
              from collections import Counter

              prepared = []
              seen = set()
              for row in records:
                  if not isinstance(row, dict):
                      continue
                  raw_day = str(row.get('date') or '')[:10]
                  try:
                      day = datetime.strptime(raw_day, '%Y-%m-%d').date()
                  except (TypeError, ValueError):
                      continue
                  if day >= today:
                      continue
                  hn = historical_name(row, 'home')
                  an = historical_name(row, 'away')
                  h, a = goal_parser(row)
                  if not hn or not an or h is None or a is None:
                      continue
                  hk, ak = canonical_name(hn), canonical_name(an)
                  if not hk or not ak or hk == ak:
                      continue
                  identity = (raw_day, hk, ak)
                  if identity in seen:
                      continue
                  seen.add(identity)
                  country = str(row.get('country') or '')
                  league = str(row.get('league') or '')
                  prepared.append((day, hk, ak, int(h), int(a), country, league, hn, an))
              prepared.sort(key=lambda r: (r[0], r[1], r[2]))

              # Chronological streaming prevents a future result becoming a feature.
              history_by_team = defaultdict(lambda: deque(maxlen=max_history))
              league_outcomes = defaultdict(Counter)
              global_outcomes = Counter()
              daily = defaultdict(list)
              for row in prepared:
                  daily[row[0]].append(row)

              outcomes = ('1', 'X', '2')
              counted = 0
              qualified = 0
              accurate = 0
              baseline_accurate = 0
              brier_total = 0.0
              baseline_brier_total = 0.0
              log_total = 0.0
              baseline_log_total = 0.0
              equal_score_predictions = 0
              markets_by_league = defaultdict(lambda: {'n':0,'brier':0.0,'baseline':0.0,'hit':0})
              observations = []
              min_day = today - timedelta(days=recent_test_days)

              def get_games(team, before):
                  return list(history_by_team[team])

              def eligible(games, target):
                  if len(games) < 6:
                      return False
                  ages = [(target - datetime.strptime(g['date'],'%Y-%m-%d').date()).days
                          for g in games]
                  ages = [age for age in ages if age > 0]
                  return (len(ages) >= 6 and min(ages) <= max_last_age
                          and sum(age <= window_days for age in ages) >= min_recent)

              for day, day_rows in sorted(daily.items()):
                  # Evaluate all fixtures on this day BEFORE adding ANY result of the day.
                  if day >= min_day:
                      for game in day_rows:
                          _, hk, ak, hg, ag, country, league, hn, an = game
                          counted += 1
                          gh = get_games(hk, day)
                          ga = get_games(ak, day)
                          if not (eligible(gh, day) and eligible(ga, day)):
                              continue
                          qualified += 1
                          candidates = model_builder(gh, ga)
                          dist = {}
                          for c in candidates:
                              if c.get('market') == '1X2' and c.get('selection') in outcomes:
                                  dist[c['selection']] = float(c['modelProbability'])
                          if len(dist) != 3 or abs(sum(dist.values())-1) > 0.025:
                              continue
                          label = '1' if hg > ag else '2' if hg < ag else 'X'
                          lk = (country.strip().casefold(), league.strip().casefold())
                          league_hist = league_outcomes[lk]
                          # Only historic outcomes are used to establish baseline.
                          base_counter = league_hist if sum(league_hist.values()) >= 30 else global_outcomes
                          n = sum(base_counter.values())
                          prior = {'1': 0.44, 'X': 0.28, '2': 0.28}
                          baseline = {k: (base_counter[k] + 40*prior[k])/(n+40) for k in outcomes}
                          predicted = max(outcomes, key=lambda k:dist[k])
                          baseline_predicted = max(outcomes, key=lambda k:baseline[k])
                          hit = predicted == label
                          bhit = baseline_predicted == label
                          score = sum((dist[k] - (1 if k==label else 0))**2 for k in outcomes)
                          base_score = sum((baseline[k] - (1 if k==label else 0))**2 for k in outcomes)
                          logloss = -log(max(1e-12,dist[label]))
                          base_logloss = -log(max(1e-12,baseline[label]))
                          x = markets_by_league[f'{country} / {league}']
                          x['n'] += 1;x['brier'] += score;x['baseline'] += base_score;x['hit'] += int(hit)
                          accurate += int(hit);baseline_accurate += int(bhit)
                          brier_total += score;baseline_brier_total += base_score
                          log_total += logloss;baseline_log_total += base_logloss
                          top_exact = next((c['selection'] for c in candidates
                              if c.get('market')=='Risultato Esatto'), None)
                          equal_score_predictions += int(top_exact in {'1:1','1-1'})
                          observations.append({'date':day.isoformat(), 'home':hn, 'away':an,
                              'outcome':label, 'probabilities':{k:round(dist[k],5) for k in outcomes},
                              'brier':round(score,5)})
                  # At the end of day, results become available to later dates.
                  for game in day_rows:
                      _, hk, ak, hg, ag, country, league, hn, an = game
                      ds=day.isoformat()
                      history_by_team[hk].append({'date':ds,'gf':hg,'ga':ag,'home':True,'opponent':an})
                      history_by_team[ak].append({'date':ds,'gf':ag,'ga':hg,'home':False,'opponent':hn})
                      label = '1' if hg>ag else '2' if ag>hg else 'X'
                      league_outcomes[(country.strip().casefold(), league.strip().casefold())][label] += 1
                      global_outcomes[label] += 1

              n = len(observations)
              summary = {
                  'method': 'walk_forward_by_date_no_same_day_or_future_results',
                  'type': 'retrospective_exploratory_not_out_of_sample_final_validation',
                  'historicalResultsTotal': len(prepared),
                  'fixturesDuringTestPeriod': counted,
                  'historyEligibleDuringTestPeriod': qualified,
                  'forecastsEvaluated': n,
                  'startOfTestWindow': min_day.isoformat(),
                  'cutoffDateExclusive':today.isoformat(),
                  'accuracy1X2': round(accurate/n,4) if n else None,
                  'baselineAccuracy1X2': round(baseline_accurate/n,4) if n else None,
                  'brier1X2':round(brier_total/n,4) if n else None,
                  'baselineBrier1X2':round(baseline_brier_total/n,4) if n else None,
                  'logLoss1X2':round(log_total/n,4) if n else None,
                  'baselineLogLoss1X2':round(baseline_log_total/n,4) if n else None,
                  'requiredMinimum': 100,
                  'status': ('measured_not_proven' if n >= 100 else 'insufficient_sample'),
                  'note': 'Valutazione retrospettiva senza lookahead, non prova un vantaggio sulle quote o un profitto. Solo 1X2.',
                  'byLeague': {k: {'n':v['n'],'accuracy':round(v['hit']/v['n'],4),
                                    'brier':round(v['brier']/v['n'],4),
                                    'baselineBrier':round(v['baseline']/v['n'],4)}
                               for k,v in sorted(markets_by_league.items(),key=lambda t:-t[1]['n']) if v['n']>=12},
              }
              return summary

          # Walk-forward: score only genuinely historical outcomes, never current odds.
          walk_forward = run_walk_forward_backtest(
              history, TODAY, canonical, historical_team_name,
              historical_goals, build_market_candidates,
              min_recent=MIN_RECENT_GAMES,
              window_days=RECENT_WINDOW_DAYS,
              max_last_age=MAX_LAST_GAME_AGE_DAYS,
              max_history=MAX_HISTORY
          )
          walk_forward["generatedAt"] = datetime.now(ROME).isoformat()
          save_json("data/betlab-backtest.json", walk_forward)
          print("BACKTEST CRONOLOGICO:", walk_forward["forecastsEvaluated"],
                "campioni | Brier:", walk_forward["brier1X2"],
                "| Brier baseline:",walk_forward["baselineBrier1X2"])

          # ==========================================================
          # SALVA ANALISI
          # ==========================================================

          # Quanti incontri sono realmente analizzabili per campionato?
          from collections import Counter
          history_rejections = Counter()
          history_by_league = {}
          for item in analysis:
              k = f"{item.get('country') or '?'} / {item.get('league') or '?'}"
              row = history_by_league.setdefault(k, {"fixtures": 0, "eligible": 0})
              row["fixtures"] += 1
              if item.get("historyEligible"):
                  row["eligible"] += 1
              else:
                  quality = item.get("historyQuality") or {}
                  for side in ("home", "away"):
                      item_quality = quality.get(side) or {}
                      if not item_quality.get("eligible"):
                          history_rejections[item_quality.get("reason") or "sconosciuto"] += 1
          history_coverage_report = {
              "matchesTotal": len(analysis),
              "matchesHistoryEligible": recent_eligible_matches,
              "matchesHistoryInsufficient": stale_or_insufficient_matches,
              "rejectedTeamReasons": dict(history_rejections),
              "byLeague": history_by_league,
              "csvSeasons": {
                  "seasons": list(CSV_SEASONS),
                  "sourcesAvailable": csv_sources_ok,
                  "sourcesUnavailable": csv_sources_unavailable,
                  "resultsRead": csv_results_examined,
                  "resultsAdded": csv_import_added
              },
              "apiTeamEnrichment": {
                  "requests": attempted_requests,
                  "resultsAdded": enrichment_added
              },
              "policy": "Nessuna riduzione delle soglie minime: i match senza dati restano non consigliati"
          }
          save_json("data/betlab-history-coverage.json", history_coverage_report)
          print("COPERTURA STORICA:", recent_eligible_matches, "/", len(analysis),
                "| motivi:", dict(history_rejections))

          output = {
              "schemaVersion": 1,
              "releaseChannel": "quality-tested",
              "modelCalibration": "non_validato",
              "predictionSource": "historical_poisson_with_market_sanity_checks",

              "engine":
                  "BETLAB AI CORE - PREVISIONI + TEST CRONOLOGICO",

              "generatedAt":
                  datetime.now(
                      ROME
                  ).isoformat(),

              "days":
                  DAYS,
              "calendarDaysUnavailable": unavailable_days,
              "calendarHorizonDays": DAYS_AHEAD + 1,

              "validation": validation,
              "historicalBacktest": walk_forward,
              "marketReferenceLookups": reference_lookups,

              "domesticFixtureSource": {
                  "source": "Football-Data.co.uk/fixtures.csv",
                  "status": csv_fixture_status,
                  "fixturesAdded": csv_fixture_count,
                  "fixturesWithQuotedMarkets": csv_fixture_quoted_count,
                  "oddsType": "quote raccolte in CSV, non live",
              },
              "historyCount":
                  len(history),
              "historyCoverage": history_coverage_report,

              "matchesAnalyzed":
                  len(analysis),

              "matchesWithCandidates":
                  matches_with_candidates,

              "matchesHistoryRecent": recent_eligible_matches,
              "matchesHistoryUnreliable": stale_or_insufficient_matches,
              "selectionPolicy": {
                  "model": "poisson_historical_transparent_market_veto",
                  "winStreakExcludeAt": 6,
                  "drawAttentionAtOrBelow": 3.0,
                  "maxProbabilityPriceGap": 0.12,
                  "maxProbabilityPriceRatio": 1.40,
                  "maximumRecommendedOdd": MAX_RECOMMENDED_ODD,
                  "minimumRecommendedModelProbability": MIN_RECOMMENDED_PROBABILITY,
                  "quoteSelection": "median_of_available_bookmakers",
                  "oneXTwoMarketMinimumBookmakers": 3,
                  "oneXTwoMaximumOvervaluationVsMarket": 0.075,
                  "oneXTwoMarketReference": "consensus_fair_probabilities_overround_removed",
                  "opponentQuality": "recent_opponents_points_proxy_not_official_rank",
                  "corporateAndTeamNews": "not_verified_no_news_provider",
                  "exactScoresRecommended": False,
                  "note": "Filtri sperimentali; non implicano redditivita' verificata"
              },
              "historyPolicy": {
                  "recentWindowDays": RECENT_WINDOW_DAYS,
                  "minRecentGamesPerTeam": MIN_RECENT_GAMES,
                  "maxDaysFromLastMatch": MAX_LAST_GAME_AGE_DAYS
              },

              "marketCandidates":
                  total_market_candidates,

              "candidatesWithOdds":
                  total_candidates_with_odds,

              "exactScoresWithOdds":
                  exact_scores_with_odds,

              "injuriesApiStatus": injuries_api_status,
              "injuriesApiNote": injury_fetch_note,
              "injuriesFixturesQueried": len(requested_injury_ids),
              "injuriesFixturesWithReports": len(injuries_by_fixture),

              "analysis":
                  analysis

          }


          save_json(
              "data/betlab-analysis.json",
              output
          )


          # shortlist semplice
          shortlist = [

              {
                  "fixtureId":
                      m[
                          "fixtureId"
                      ],

                  "date":
                      m[
                          "date"
                      ],

                  "country":
                      m[
                          "country"
                      ],

                  "league":
                      m[
                          "league"
                      ],

                  "home":
                      m[
                          "home"
                      ],

                  "away":
                      m[
                          "away"
                      ],

                  "priority":
                      m[
                          "priority"
                      ],

                  "historyScore":
                      m[
                          "historyScore"
                      ]
              }

              for m in candidate_matches[:50]

          ]


          save_json(
              "data/betlab-shortlist.json",
              shortlist
          )


          # ==========================================================
          # LOG
          # ==========================================================

          print("")
          print("==============================================")
          print("RISULTATO BETLAB AI STABILE")
          print("==============================================")

          print(
              "Storico totale:",
              len(history)
          )

          print(
              "Partite analizzate:",
              len(analysis)
          )

          print(
              "Partite con candidati:",
              matches_with_candidates
          )

          print(
              "Candidati mercato generati:",
              total_market_candidates
          )

          print(
              "Candidati con quota:",
              total_candidates_with_odds
          )

          print(
              "Risultati esatti con quota:",
              exact_scores_with_odds
          )


          print("")
          print("TOP CANDIDATI PER PARTITA")
          print("")


          for index, match in enumerate(
              analysis,
              start=1
          ):

              candidates = match.get(
                  "candidates"
              ) or []


              print(
                  f'{index}. '
