                      rome
                  ).isoformat(),

              "matches":
                  shortlist

          }


          analysis_output = {

              "updatedAt":
                  datetime.now(
                      rome
                  ).isoformat(),

              "engine":
                  "BETLAB Prediction + Odds V1",

