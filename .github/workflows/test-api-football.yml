name: Aggiorna feed BETLAB

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:

      - name: Scarica repository
        uses: actions/checkout@v4


      - name: Scarica oggi e domani API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |
          mkdir -p data/future
          rm -f data/future/*.json

          TODAY=$(TZ=Europe/Rome date +%Y-%m-%d)
          TOMORROW=$(TZ=Europe/Rome date -d "+1 day" +%Y-%m-%d)

          echo "================================="
          echo "BETLAB DATA ENGINE V6"
          echo "Oggi: $TODAY"
          echo "Domani: $TOMORROW"
          echo "================================="

          for DAY in "$TODAY" "$TOMORROW"
          do

            echo "Scarico $DAY..."

            curl --fail --silent --show-error \
              --request GET \
              --url "https://v3.football.api-sports.io/fixtures?date=$DAY" \
              --header "x-apisports-key: $API_FOOTBALL_KEY" \
              -o "data/future/$DAY.json"

          done


      - name: Costruisci BETLAB V6
        run: |
          python3 - <<'PY'

          import json
          import os
          import re
          import glob
          import unicodedata

          from datetime import datetime, timezone


          HISTORY = "data/betlab-history.json"
          MATCHES = "data/betlab-matches.json"
          SHORTLIST = "data/betlab-shortlist.json"
          ANALYSIS = "data/betlab-analysis.json"


          # =====================================================
          # CAMPIONATI BETLAB
          # =====================================================

          PRIORITY = {

              ("Italy", "Serie A"): 5,
              ("England", "Premier League"): 5,
              ("Spain", "La Liga"): 5,
              ("Germany", "Bundesliga"): 5,
              ("France", "Ligue 1"): 5,

              ("World", "UEFA Champions League"): 5,
              ("World", "UEFA Europa League"): 5,
              ("World", "UEFA Europa Conference League"): 5,

              ("Italy", "Serie B"): 4,
              ("England", "Championship"): 4,
              ("Spain", "Segunda División"): 4,
              ("Germany", "2. Bundesliga"): 4,
              ("France", "Ligue 2"): 4,

              ("Portugal", "Primeira Liga"): 4,
              ("Netherlands", "Eredivisie"): 4,
              ("Belgium", "Jupiler Pro League"): 4,
              ("Turkey", "Süper Lig"): 4,

              ("Brazil", "Serie A"): 3,
              ("Argentina", "Liga Profesional Argentina"): 3,

              ("Scotland", "Premiership"): 3,
              ("USA", "Major League Soccer"): 3,
              ("Mexico", "Liga MX"): 3,

              ("Greece", "Super League 1"): 2,
              ("Austria", "Bundesliga"): 2,
              ("Switzerland", "Super League"): 2,
              ("Denmark", "Superliga"): 2,
              ("Norway", "Eliteserien"): 2,
              ("Sweden", "Allsvenskan"): 2
          }


          # =====================================================
          # NORMALIZZAZIONE NOMI
          # =====================================================

          def basic_normalize(name):

              if not name:
                  return ""

              name = unicodedata.normalize(
                  "NFKD",
                  str(name)
              )

              name = "".join(
                  c
                  for c in name
                  if not unicodedata.combining(c)
              )

              name = name.lower()

              name = name.replace(
                  "&",
                  " and "
              )

              name = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  name
              )

              return re.sub(
                  r"\s+",
                  " ",
                  name
              ).strip()


          ALIASES = {

              # BRASILE

              "atletico mg":
                  "atletico mineiro",

              "ca mineiro":
                  "atletico mineiro",

              "clube atletico mineiro":
                  "atletico mineiro",

              "atletico mineiro":
                  "atletico mineiro",

              "rb bragantino":
                  "bragantino",

              "red bull bragantino":
                  "bragantino",

              "bragantino":
                  "bragantino",


              # ITALIA

              "internazionale":
                  "inter",

              "inter milan":
                  "inter",

              "fc internazionale":
                  "inter",

              "internazionale milano":
                  "inter",

              "ac milan":
                  "milan",


              # INGHILTERRA

              "man utd":
                  "manchester united",

              "manchester utd":
                  "manchester united",

              "man united":
                  "manchester united",

              "man city":
                  "manchester city",

              "wolves":
                  "wolverhampton wanderers",

              "wolverhampton":
                  "wolverhampton wanderers",


              # FRANCIA

              "psg":
                  "paris saint germain",

              "paris sg":
                  "paris saint germain",


              # GERMANIA

              "bayern munich":
                  "bayern munchen",

              "bayern munchen":
                  "bayern munchen",


              # SPAGNA

              "atletico madrid":
                  "atletico de madrid",

              "atletico de madrid":
                  "atletico de madrid"
          }


          CLUB_WORDS = {
              "fc",
              "cf",
              "afc",
              "ac",
              "sc",
              "club",
              "football",
              "calcio"
          }


          def canonical_team(name):

              name = basic_normalize(name)

              if not name:
                  return ""

              if name in ALIASES:
                  return ALIASES[name]

              cleaned = " ".join(
                  word
                  for word in name.split()
                  if word not in CLUB_WORDS
              ).strip()

              return ALIASES.get(
                  cleaned,
                  cleaned
              )


          # =====================================================
          # CARICA API
          # =====================================================

          all_api_matches = []

          files = sorted(
              glob.glob(
                  "data/future/*.json"
              )
          )


          print()
          print("=================================")
          print("BETLAB ANALYSIS ENGINE V6")
          print("=================================")

          print(
              "Giorni caricati:",
              len(files)
          )


          if not files:

              raise SystemExit(
                  "Nessun file API trovato."
              )


          for filename in files:

              with open(
                  filename,
                  encoding="utf-8"
              ) as f:

                  payload = json.load(f)


              if payload.get("errors"):

                  print(
                      "ERRORE API:",
                      filename,
                      payload["errors"]
                  )

                  raise SystemExit(1)


              response = payload.get(
                  "response",
                  []
              )


              print(
                  os.path.basename(filename),
                  ":",
                  len(response),
                  "partite"
              )


              all_api_matches.extend(
                  response
              )


          # =====================================================
          # DEDUPLICA FIXTURE API
          # =====================================================

          unique_api = {}


          for match in all_api_matches:

              fixture_id = (
                  match
                  .get("fixture", {})
                  .get("id")
              )

              if fixture_id is None:
                  continue

              unique_api[
                  str(fixture_id)
              ] = match


          all_api_matches = list(
              unique_api.values()
          )


          print(
              "Partite API uniche:",
              len(all_api_matches)
          )


          # =====================================================
          # CARICA STORICO
          # =====================================================

          if os.path.exists(HISTORY):

              with open(
                  HISTORY,
                  encoding="utf-8"
              ) as f:

                  history_data = json.load(f)

              history = history_data.get(
                  "matches",
                  []
              )

          else:

              history = []


          print(
              "Storico disponibile:",
              len(history)
          )


          # =====================================================
          # AGGIUNGE RISULTATI TERMINATI
          # =====================================================

          completed_statuses = {
              "FT",
              "AET",
              "PEN"
          }


          api_fixture_ids = {

              str(
                  match.get(
                      "fixtureId"
                  )
              )

              for match in history

              if (
                  match.get("source")
                  != "OpenFootball"

                  and

                  match.get(
                      "fixtureId"
                  )
                  is not None
              )
          }


          added_results = 0


          for match in all_api_matches:

              fixture = match.get(
                  "fixture",
                  {}
              )

              status = (
                  fixture
                  .get("status", {})
                  .get("short")
              )


              if status not in completed_statuses:
                  continue


              fixture_id = fixture.get(
                  "id"
              )


              if fixture_id is None:
                  continue


              if str(fixture_id) in api_fixture_ids:
                  continue


              teams = match.get(
                  "teams",
                  {}
              )

              goals = match.get(
                  "goals",
                  {}
              )


              if (
                  goals.get("home") is None
                  or
                  goals.get("away") is None
              ):
                  continue


              home = teams.get(
                  "home",
                  {}
              )

              away = teams.get(
                  "away",
                  {}
              )

              league = match.get(
                  "league",
                  {}
              )


              history.append({

                  "fixtureId":
                      fixture_id,

                  "source":
                      "API-Football",

                  "date":
                      fixture.get(
                          "date"
                      ),

                  "timestamp":
                      fixture.get(
                          "timestamp"
                      ),

                  "status":
                      status,

                  "country":
                      league.get(
                          "country"
                      ),

                  "league":
                      league.get(
                          "name"
                      ),

                  "leagueId":
                      league.get(
                          "id"
                      ),

                  "season":
                      league.get(
                          "season"
                      ),

                  "round":
                      league.get(
                          "round"
                      ),

                  "home": {

                      "id":
                          home.get(
                              "id"
                          ),

                      "name":
                          home.get(
                              "name"
                          )
                  },

                  "away": {

                      "id":
                          away.get(
                              "id"
                          ),

                      "name":
                          away.get(
                              "name"
                          )
                  },

                  "goals": {

                      "home":
                          goals.get(
                              "home"
                          ),

                      "away":
                          goals.get(
                              "away"
                          )
                  }

              })


              api_fixture_ids.add(
                  str(fixture_id)
              )

              added_results += 1


          # =====================================================
          # CREA VISTA STORICO SENZA DUPLICATI LOGICI
          # =====================================================

          logical_history = {}


          for match in history:

              date_key = str(
                  match.get(
                      "date",
                      ""
                  )
              )[:10]

              home_key = canonical_team(
                  match
                  .get("home", {})
                  .get("name")
              )

              away_key = canonical_team(
                  match
                  .get("away", {})
                  .get("name")
              )


              if (
                  not date_key
                  or
                  not home_key
                  or
                  not away_key
              ):
                  continue


              key = (
                  date_key,
                  home_key,
                  away_key
              )


              existing = logical_history.get(
                  key
              )


              if existing is None:

                  logical_history[
                      key
                  ] = match

              else:

                  # Se abbiamo sia OpenFootball sia API-Football,
                  # per l'analisi preferiamo API-Football.

                  if (
                      existing.get("source")
                      == "OpenFootball"

                      and

                      match.get("source")
                      == "API-Football"
                  ):

                      logical_history[
                          key
                      ] = match


          analysis_history = list(
              logical_history.values()
          )


          print(
              "Storico unico per analisi:",
              len(analysis_history)
          )


          # =====================================================
          # INDICE STORICO PER SQUADRA
          # =====================================================

          team_history = {}


          for match in analysis_history:

              home_key = canonical_team(
                  match
                  .get("home", {})
                  .get("name")
              )

              away_key = canonical_team(
                  match
                  .get("away", {})
                  .get("name")
              )


              if home_key:

                  team_history.setdefault(
                      home_key,
                      []
                  ).append(match)


              if away_key:

                  team_history.setdefault(
                      away_key,
                      []
                  ).append(match)


          # =====================================================
          # FORMA ULTIME 5
          # =====================================================

          def calculate_form(
              team_name,
              target_date
          ):

              team_key = canonical_team(
                  team_name
              )

              games = team_history.get(
                  team_key,
                  []
              )

              target_day = str(
                  target_date or ""
              )[:10]


              valid = []


              for match in games:

                  match_day = str(
                      match.get(
                          "date",
                          ""
                      )
                  )[:10]


                  if not match_day:
                      continue


                  if (
                      target_day
                      and
                      match_day >= target_day
                  ):
                      continue


                  goals = match.get(
                      "goals",
                      {}
                  )


                  if (
                      goals.get("home") is None
                      or
                      goals.get("away") is None
                  ):
                      continue


                  valid.append(
                      match
                  )


              valid.sort(
                  key=lambda x:
                      str(
                          x.get(
                              "date",
                              ""
                          )
                      ),
                  reverse=True
              )


              valid = valid[:5]


              wins = 0
              draws = 0
              losses = 0

              goals_for = 0
              goals_against = 0

              points = 0

              recent = []


              for match in valid:

                  home_name = (
                      match
                      .get("home", {})
                      .get("name")
                  )

                  away_name = (
                      match
                      .get("away", {})
                      .get("name")
                  )


                  home_key = canonical_team(
                      home_name
                  )

                  away_key = canonical_team(
                      away_name
                  )


                  home_goals = (
                      match
                      .get("goals", {})
                      .get("home")
                  )

                  away_goals = (
                      match
                      .get("goals", {})
                      .get("away")
                  )


                  if team_key == home_key:

                      gf = home_goals
                      ga = away_goals

                      opponent = away_name
                      venue = "HOME"


                  elif team_key == away_key:

                      gf = away_goals
                      ga = home_goals

                      opponent = home_name
                      venue = "AWAY"


                  else:
                      continue


                  if gf > ga:

                      result = "W"

                      wins += 1
                      points += 3


                  elif gf == ga:

                      result = "D"

                      draws += 1
                      points += 1


                  else:

                      result = "L"

                      losses += 1


                  goals_for += gf
                  goals_against += ga


                  recent.append({

                      "date":
                          match.get(
                              "date"
                          ),

                      "opponent":
                          opponent,

                      "venue":
                          venue,

                      "goalsFor":
                          gf,

                      "goalsAgainst":
                          ga,

                      "result":
                          result,

                      "source":
                          match.get(
                              "source",
                              "unknown"
                          )

                  })


              played = len(
                  recent
              )


              return {

                  "canonicalName":
                      team_key,

                  "played":
                      played,

                  "wins":
                      wins,

                  "draws":
                      draws,

                  "losses":
                      losses,

                  "goalsFor":
                      goals_for,

                  "goalsAgainst":
                      goals_against,

                  "points":
                      points,

                  "pointsPerGame":
                      (
                          round(
                              points / played,
                              2
                          )
                          if played
                          else None
                      ),

                  "avgGoalsFor":
                      (
                          round(
                              goals_for / played,
                              2
                          )
                          if played
                          else None
                      ),

                  "avgGoalsAgainst":
                      (
                          round(
                              goals_against / played,
                              2
                          )
                          if played
                          else None
                      ),

                  "recent":
                      recent

              }


          # =====================================================
          # PREDICTION ENGINE V1
          # =====================================================

          def analyse_prediction(
              home_form,
              away_form
          ):

              home_recent = home_form.get(
                  "recent",
                  []
              )

              away_recent = away_form.get(
                  "recent",
                  []
              )


              home_count = len(
                  home_recent
              )

              away_count = len(
                  away_recent
              )


              sample_size = (
                  home_count
                  +
                  away_count
              )


              # Per confrontare le due squadre
              # vogliamo almeno un dato per entrambe.

              if (
                  home_count == 0
                  or
                  away_count == 0
              ):

                  return {

                      "available":
                          False,

                      "reason":
                          "Storico insufficiente",

                      "sampleSize":
                          sample_size

                  }


              # =================================================
              # FUNZIONI STATISTICHE
              # =================================================

              def team_rate(
                  games,
                  condition
              ):

                  if not games:
                      return 0.0

                  hits = sum(
                      1
                      for game in games
                      if condition(game)
                  )

                  return (
                      hits
                      /
                      len(games)
                  )


              def combined_rate(
                  condition
              ):

                  games = (
                      home_recent
                      +
                      away_recent
                  )

                  if not games:
                      return 0.0

                  hits = sum(
                      1
                      for game in games
                      if condition(game)
                  )

                  return (
                      hits
                      /
                      len(games)
                  )


              # =================================================
              # FORMA RISULTATO
              # =================================================

              home_win = team_rate(
                  home_recent,
                  lambda g:
                      g.get("result")
                      == "W"
              )


              home_draw = team_rate(
                  home_recent,
                  lambda g:
                      g.get("result")
                      == "D"
              )


              home_loss = team_rate(
                  home_recent,
                  lambda g:
                      g.get("result")
                      == "L"
              )


              away_win = team_rate(
                  away_recent,
                  lambda g:
                      g.get("result")
                      == "W"
              )


              away_draw = team_rate(
                  away_recent,
                  lambda g:
                      g.get("result")
                      == "D"
              )


              away_loss = team_rate(
                  away_recent,
                  lambda g:
                      g.get("result")
                      == "L"
              )


              # =================================================
              # 1 X 2
              # =================================================

              score_1 = (
                  home_win
                  +
                  away_loss
              ) / 2


              score_x = (
                  home_draw
                  +
                  away_draw
              ) / 2


              score_2 = (
                  away_win
                  +
                  home_loss
              ) / 2


              # =================================================
              # DOPPIA CHANCE
              # =================================================

              score_1x = (
                  (
                      1 - home_loss
                  )
                  +
                  (
                      1 - away_win
                  )
              ) / 2


              score_x2 = (
                  (
                      1 - away_loss
                  )
                  +
                  (
                      1 - home_win
                  )
              ) / 2


              score_12 = (
                  (
                      1 - home_draw
                  )
                  +
                  (
                      1 - away_draw
                  )
              ) / 2


              # =================================================
              # GOAL / NO GOAL
              # =================================================

              score_goal = combined_rate(
                  lambda g:
                      (
                          g.get(
                              "goalsFor",
                              0
                          ) > 0
                          and
                          g.get(
                              "goalsAgainst",
                              0
                          ) > 0
                      )
              )


              score_nogoal = (
                  1
                  -
                  score_goal
              )


              # =================================================
              # OVER / UNDER
              # =================================================

              score_over_15 = combined_rate(
                  lambda g:
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      ) >= 2
              )


              score_under_15 = (
                  1
                  -
                  score_over_15
              )


              score_over_25 = combined_rate(
                  lambda g:
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      ) >= 3
              )


              score_under_25 = (
                  1
                  -
                  score_over_25
              )


              score_over_35 = combined_rate(
                  lambda g:
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      ) >= 4
              )


              score_under_35 = (
                  1
                  -
                  score_over_35
              )


              # =================================================
              # PARI / DISPARI
              # =================================================

              score_even = combined_rate(
                  lambda g:
                      (
                          (
                              g.get(
                                  "goalsFor",
                                  0
                              )
                              +
                              g.get(
                                  "goalsAgainst",
                                  0
                              )
                          )
                          % 2
                      ) == 0
              )


              score_odd = (
                  1
                  -
                  score_even
              )


              # =================================================
              # SOMMA GOL
              #
              # Fasce non sovrapposte.
              # =================================================

              score_goals_01 = combined_rate(
                  lambda g:
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      ) <= 1
              )


              score_goals_23 = combined_rate(
                  lambda g:
                      2
                      <=
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      )
                      <=
                      3
              )


              score_goals_45 = combined_rate(
                  lambda g:
                      4
                      <=
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      )
                      <=
                      5
              )


              score_goals_6plus = combined_rate(
                  lambda g:
                      (
                          g.get(
                              "goalsFor",
                              0
                          )
                          +
                          g.get(
                              "goalsAgainst",
                              0
                          )
                      ) >= 6
              )


              # =================================================
              # LISTA MERCATI
              # =================================================

              markets = [

                  {
                      "market":
                          "1X2",

                      "prediction":
                          "1",

                      "rawScore":
                          score_1
                  },

                  {
                      "market":
                          "1X2",

                      "prediction":
                          "X",

                      "rawScore":
                          score_x
                  },

                  {
                      "market":
                          "1X2",

                      "prediction":
                          "2",

                      "rawScore":
                          score_2
                  },


                  {
                      "market":
                          "Doppia Chance",

                      "prediction":
                          "1X",

                      "rawScore":
                          score_1x
                  },

                  {
                      "market":
                          "Doppia Chance",

                      "prediction":
                          "X2",

                      "rawScore":
                          score_x2
                  },

                  {
                      "market":
                          "Doppia Chance",

                      "prediction":
                          "12",

                      "rawScore":
                          score_12
                  },


                  {
                      "market":
                          "Goal/No Goal",

                      "prediction":
                          "GOAL",

                      "rawScore":
                          score_goal
                  },

                  {
                      "market":
                          "Goal/No Goal",

                      "prediction":
                          "NO GOAL",

                      "rawScore":
                          score_nogoal
                  },


                  {
                      "market":
                          "Totale Gol",

                      "prediction":
                          "OVER 1.5",

                      "rawScore":
                          score_over_15
                  },

                  {
                      "market":
                          "Totale Gol",

                      "prediction":
                          "UNDER 1.5",

                      "rawScore":
                          score_under_15
                  },

                  {
                      "market":
                          "Totale Gol",

                      "prediction":
                          "OVER 2.5",

                      "rawScore":
                          score_over_25
                  },

                  {
                      "market":
                          "Totale Gol",

                      "prediction":
                          "UNDER 2.5",

                      "rawScore":
                          score_under_25
                  },

                  {
                      "market":
                          "Totale Gol",

                      "prediction":
                          "OVER 3.5",

                      "rawScore":
                          score_over_35
                  },

                  {
                      "market":
                          "Totale Gol",

                      "prediction":
                          "UNDER 3.5",

                      "rawScore":
                          score_under_35
                  },


                  {
                      "market":
                          "Pari/Dispari",

                      "prediction":
                          "PARI",

                      "rawScore":
                          score_even
                  },

                  {
                      "market":
                          "Pari/Dispari",

                      "prediction":
                          "DISPARI",

                      "rawScore":
                          score_odd
                  },


                  {
                      "market":
                          "Somma Gol",

                      "prediction":
                          "0-1 GOL",

                      "rawScore":
                          score_goals_01
                  },

                  {
                      "market":
                          "Somma Gol",

                      "prediction":
                          "2-3 GOL",

                      "rawScore":
                          score_goals_23
                  },

                  {
                      "market":
                          "Somma Gol",

                      "prediction":
                          "4-5 GOL",

                      "rawScore":
                          score_goals_45
                  },

                  {
                      "market":
                          "Somma Gol",

                      "prediction":
                          "6+ GOL",

                      "rawScore":
                          score_goals_6plus
                  }

              ]


              # =================================================
              # CORREZIONE CAMPIONE
              #
              # 10 partite = campione massimo V1.
              # Con meno dati il valore viene riportato verso 50%.
              # =================================================

              sample_factor = min(
                  sample_size / 10,
                  1.0
              )


              for market in markets:

                  raw = market[
                      "rawScore"
                  ]


                  adjusted = (
                      0.50
                      +
                      (
                          raw - 0.50
                      )
                      *
                      sample_factor
                  )


                  market[
                      "rawScore"
                  ] = round(
                      raw,
                      4
                  )


                  market[
                      "confidence"
                  ] = round(
                      adjusted * 100,
                      1
                  )


              # =================================================
              # SCELTA UNICA
              # =================================================

              markets.sort(
                  key=lambda x:
                      x["confidence"],
                  reverse=True
              )


              best = markets[0]


              if (
                  best["confidence"]
                  < 55
              ):

                  return {

                      "available":
                          False,

                      "reason":
                          "Segnale statistico insufficiente",

                      "sampleSize":
                          sample_size,

                      "bestCandidate": {

                          "market":
                              best["market"],

                          "prediction":
                              best["prediction"],

                          "confidence":
                              best["confidence"]
                      }

                  }


              return {

                  "available":
                      True,

                  "market":
                      best["market"],

                  "prediction":
                      best["prediction"],

                  # È un indice BETLAB V1,
                  # non una probabilità calibrata.

                  "confidence":
                      best["confidence"],

                  "rawFrequency":
                      round(
                          best["rawScore"]
                          * 100,
                          1
                      ),

                  "sampleSize":
                      sample_size

              }


          # =====================================================
          # CREA CANDIDATE OGGI + DOMANI
          # =====================================================

          candidates = []


          for match in all_api_matches:

              fixture = match.get(
                  "fixture",
                  {}
              )


              status = (
                  fixture
                  .get("status", {})
                  .get("short")
              )


              if status not in {
                  "NS",
                  "TBD"
              }:

                  continue


              league = match.get(
                  "league",
                  {}
              )


              country = league.get(
                  "country",
                  ""
              )


              league_name = league.get(
                  "name",
                  ""
              )


              priority = PRIORITY.get(
                  (
                      country,
                      league_name
                  )
              )


              if priority is None:
                  continue


              teams = match.get(
                  "teams",
                  {}
              )


              home = teams.get(
                  "home",
                  {}
              )


              away = teams.get(
                  "away",
                  {}
              )


              if (
                  not home.get("name")
                  or
                  not away.get("name")
              ):

                  continue


              home_form = calculate_form(
                  home["name"],
                  fixture.get("date")
              )


              away_form = calculate_form(
                  away["name"],
                  fixture.get("date")
              )


              history_score = (
                  home_form["played"]
                  +
                  away_form["played"]
              )


              prediction = analyse_prediction(
                  home_form,
                  away_form
              )


              prediction_available = (
                  prediction.get(
                      "available",
                      False
                  )
              )


              prediction_confidence = (
                  prediction.get(
                      "confidence",
                      0
                  )
                  if prediction_available
                  else 0
              )


              candidates.append({

                  "fixtureId":
                      fixture.get(
                          "id"
                      ),

                  "date":
                      fixture.get(
                          "date"
                      ),

                  "timestamp":
                      fixture.get(
                          "timestamp"
                      ),

                  "status":
                      status,

                  "country":
                      country,

                  "league":
                      league_name,

                  "leagueId":
                      league.get(
                          "id"
                      ),

                  "season":
                      league.get(
                          "season"
                      ),

                  "round":
                      league.get(
                          "round"
                      ),

                  "priority":
                      priority,

                  "historyScore":
                      history_score,

                  "dataCoverage":
                      round(
                          history_score / 10,
                          2
                      ),

                  "prediction":
                      prediction,

                  "home": {

                      "id":
                          home.get(
                              "id"
                          ),

                      "name":
                          home.get(
                              "name"
                          ),

                      "logo":
                          home.get(
                              "logo"
                          ),

                      "form":
                          home_form

                  },

                  "away": {

                      "id":
                          away.get(
                              "id"
                          ),

                      "name":
                          away.get(
                              "name"
                          ),

                      "logo":
                          away.get(
                              "logo"
                          ),

                      "form":
                          away_form

                  },

                  "_predictionAvailable":
                      prediction_available,

                  "_predictionConfidence":
                      prediction_confidence

              })


          # =====================================================
          # CLASSIFICA BETLAB
          #
          # 1. Pronostico disponibile
          # 2. Confidenza statistica
          # 3. Storico completo
          # 4. Quantità storico
          # 5. Priorità campionato
          # 6. Data
          # =====================================================

          def candidate_rank(match):

              home_played = (
                  match["home"]
                  ["form"]
                  ["played"]
              )


              away_played = (
                  match["away"]
                  ["form"]
                  ["played"]
              )


              prediction_available = (
                  1
                  if match[
                      "_predictionAvailable"
                  ]
                  else 0
              )


              confidence = match[
                  "_predictionConfidence"
              ]


              complete = (
                  1
                  if (
                      home_played == 5
                      and
                      away_played == 5
                  )
                  else 0
              )


              both_have_data = (
                  1
                  if (
                      home_played > 0
                      and
                      away_played > 0
                  )
                  else 0
              )


              return (

                  -prediction_available,
                  -confidence,
                  -complete,
                  -both_have_data,
                  -match["historyScore"],
                  -match["priority"],
                  match.get(
                      "timestamp"
                  ) or 0

              )


          candidates.sort(
              key=candidate_rank
          )


          # Rimuove i campi tecnici temporanei.

          for match in candidates:

              match.pop(
                  "_predictionAvailable",
                  None
              )

              match.pop(
                  "_predictionConfidence",
                  None
              )


          # =====================================================
          # OUTPUT CANDIDATE
          # =====================================================

          shortlist = candidates[:50]

          analysis = candidates[:30]


          # =====================================================
          # LOG PRONOSTICI
          # =====================================================

          print()
          print("=================================")
          print("PRONOSTICI BETLAB V1")
          print("=================================")
          print()


          for index, match in enumerate(
              analysis[:20],
              start=1
          ):

              home_name = (
                  match["home"]
                  ["name"]
              )

              away_name = (
                  match["away"]
                  ["name"]
              )

              prediction = match.get(
                  "prediction",
                  {}
              )


              print(
                  f"{index}. "
                  f"{home_name} - "
                  f"{away_name}"
              )


              if prediction.get(
                  "available"
              ):

                  print(
                      "   PRONOSTICO:",
                      prediction.get(
                          "prediction"
                      )
                  )

                  print(
                      "   MERCATO:",
                      prediction.get(
                          "market"
                      )
                  )

                  print(
                      "   INDICE BETLAB:",
                      str(
                          prediction.get(
                              "confidence"
                          )
                      )
                      + "%"
                  )

                  print(
                      "   CAMPIONE:",
                      prediction.get(
                          "sampleSize"
                      )
                  )


              else:

                  print(
                      "   NESSUN PRONOSTICO:",
                      prediction.get(
                          "reason"
                      )
                  )


              print()


          # =====================================================
          # SALVATAGGIO
          # =====================================================

          generated_at = datetime.now(
              timezone.utc
          ).isoformat()


          history.sort(
              key=lambda x:
                  str(
                      x.get(
                          "date",
                          ""
                      )
                  )
          )


          history_output = {

              "updatedAt":
                  generated_at,

              "total":
                  len(history),

              "sources": [
                  "API-Football",
                  "OpenFootball"
              ],

              "matches":
                  history

          }


          matches_output = {

              "generatedAt":
                  generated_at,

              "engine":
                  "BETLAB DATA ENGINE V6",

              "predictionEngine":
                  "BETLAB PREDICTION V1",

              "windowDays":
                  2,

              "total":
                  len(candidates),

              "matches":
                  candidates

          }


          shortlist_output = {

              "generatedAt":
                  generated_at,

              "engine":
                  "BETLAB SHORTLIST V6",

              "predictionEngine":
                  "BETLAB PREDICTION V1",

              "windowDays":
                  2,

              "total":
                  len(shortlist),

              "candidates":
                  shortlist

          }


          analysis_output = {

              "generatedAt":
                  generated_at,

              "engine":
                  "BETLAB ANALYSIS ENGINE V6",

              "predictionEngine":
                  "BETLAB PREDICTION V1",

              "windowDays":
                  2,

              "historyMatches":
                  len(history),

              "analysisHistoryMatches":
                  len(
                      analysis_history
                  ),

              "availableCandidates":
                  len(candidates),

              "matchesAnalyzed":
                  len(analysis),

              "analysis":
                  analysis

          }


          for path, data in [

              (
                  HISTORY,
                  history_output
              ),

              (
                  MATCHES,
                  matches_output
              ),

              (
                  SHORTLIST,
                  shortlist_output
              ),

              (
                  ANALYSIS,
                  analysis_output
              )

          ]:

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # =====================================================
          # RISULTATO FINALE
          # =====================================================

          predictions_available = sum(

              1

              for match in candidates

              if (
                  match
                  .get(
                      "prediction",
                      {}
                  )
                  .get(
                      "available"
                  )
              )
          )


          full_coverage = sum(

              1

              for match in candidates

              if (
                  match["home"]
                  ["form"]
                  ["played"] == 5

                  and

                  match["away"]
                  ["form"]
                  ["played"] == 5
              )
          )


          both_data = sum(

              1

              for match in candidates

              if (
                  match["home"]
                  ["form"]
                  ["played"] > 0

                  and

                  match["away"]
                  ["form"]
                  ["played"] > 0
              )
          )


          print()
          print("=================================")
          print("RISULTATO BETLAB V6")
          print("=================================")

          print(
              "Storico totale:",
              len(history)
          )

          print(
              "Storico unico analisi:",
              len(
                  analysis_history
              )
          )

          print(
              "Nuovi risultati API:",
              added_results
          )

          print(
              "Candidate oggi + domani:",
              len(candidates)
          )

          print(
              "Entrambe con storico:",
              both_data
          )

          print(
              "Copertura completa 5+5:",
              full_coverage
          )

          print(
              "Pronostici disponibili:",
              predictions_available
          )

          print(
              "Partite inviate homepage:",
              len(analysis)
          )

          print()
          print(
              "BETLAB PREDICTION ENGINE V1 OK"
          )

