name: Aggiorna feed BETLAB

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Scarica partite API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |
          mkdir -p data
          TODAY=$(TZ=Europe/Rome date +%Y-%m-%d)

          echo "================================="
          echo "BETLAB DATA ENGINE"
          echo "Data: $TODAY"
          echo "================================="

          curl --fail --silent --show-error \
            --request GET \
            --url "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            --header "x-apisports-key: $API_FOOTBALL_KEY" \
            -o data/api-football-raw.json

      - name: Costruisci shortlist BETLAB
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          INPUT = "data/api-football-raw.json"
          OUTPUT = "data/betlab-matches.json"
          SHORTLIST = "data/betlab-shortlist.json"

          with open(INPUT, encoding="utf-8") as f:
              data = json.load(f)

          if data.get("errors"):
              print("ERRORE API:")
              print(data["errors"])
              raise SystemExit(1)

          matches = data.get("response", [])

          priority = {
              # TOP 5 EUROPA
              ("Italy", "Serie A"): 3,
              ("England", "Premier League"): 3,
              ("Spain", "La Liga"): 3,
              ("Germany", "Bundesliga"): 3,
              ("France", "Ligue 1"): 3,

              # UEFA
              ("World", "UEFA Champions League"): 3,
              ("World", "UEFA Europa League"): 3,
              ("World", "UEFA Europa Conference League"): 3,

              # SECONDE DIVISIONI
              ("Italy", "Serie B"): 2,
              ("England", "Championship"): 2,
              ("Spain", "Segunda División"): 2,
              ("Germany", "2. Bundesliga"): 2,
              ("France", "Ligue 2"): 2,

              # EUROPA
              ("Portugal", "Primeira Liga"): 2,
              ("Netherlands", "Eredivisie"): 2,
              ("Belgium", "Jupiler Pro League"): 2,
              ("Turkey", "Süper Lig"): 2,
              ("Scotland", "Premiership"): 2,

              # SUD AMERICA
              ("Brazil", "Serie A"): 2,
              ("Argentina", "Liga Profesional Argentina"): 2,

              # NORD AMERICA
              ("USA", "Major League Soccer"): 2,
              ("Mexico", "Liga MX"): 2,

              # ALTRI CAMPIONATI
              ("Greece", "Super League 1"): 1,
              ("Austria", "Bundesliga"): 1,
              ("Switzerland", "Super League"): 1,
              ("Denmark", "Superliga"): 1,
              ("Norway", "Eliteserien"): 1,
              ("Sweden", "Allsvenskan"): 1
          }

          filtered = []

          for match in matches:
              fixture = match.get("fixture", {})
              league = match.get("league", {})
              teams = match.get("teams", {})

              country = league.get("country", "")
              league_name = league.get("name", "")
              status = fixture.get("status", {}).get("short")

              level = priority.get((country, league_name))

              if level is None:
                  continue

              if status not in ("NS", "TBD"):
                  continue

              home = teams.get("home", {})
              away = teams.get("away", {})

              if not home.get("id") or not away.get("id"):
                  continue

              filtered.append({
                  "fixtureId": fixture.get("id"),
                  "date": fixture.get("date"),
                  "timestamp": fixture.get("timestamp"),
                  "status": status,

                  "country": country,
                  "league": league_name,
                  "leagueId": league.get("id"),
                  "season": league.get("season"),
                  "round": league.get("round"),

                  "priority": level,

                  "home": {
                      "id": home.get("id"),
                      "name": home.get("name"),
                      "logo": home.get("logo")
                  },

                  "away": {
                      "id": away.get("id"),
                      "name": away.get("name"),
                      "logo": away.get("logo")
                  }
              })

          filtered.sort(
              key=lambda x: (
                  -x["priority"],
                  x.get("timestamp") or 0
              )
          )

          feed = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "API-Football",
              "total": len(filtered),
              "matches": filtered
          }

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(
                  feed,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          shortlist = filtered[:30]

          shortlist_data = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "total": len(shortlist),
              "candidates": shortlist
          }

          with open(SHORTLIST, "w", encoding="utf-8") as f:
              json.dump(
                  shortlist_data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("Partite API:", len(matches))
          print("Partite idonee BETLAB:", len(filtered))
          print("Shortlist:", len(shortlist))
          print()

          print("PARTITE DA ANALIZZARE:")
          print()

          for match in shortlist:
              print(
                  f'P{match["priority"]} | '
                  f'{match["country"]} | '
                  f'{match["league"]} | '
                  f'{match["home"]["name"]} - '
                  f'{match["away"]["name"]}'
              )

          print()
          print("BETLAB SHORTLIST ENGINE OK")
          PY

      - name: Analizza forma recente squadre
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import time
          from datetime import datetime, timezone

          SHORTLIST = "data/betlab-shortlist.json"
          OUTPUT = "data/betlab-analysis.json"

          API_KEY = os.environ["API_FOOTBALL_KEY"]
          BASE_URL = "https://v3.football.api-sports.io"

          with open(SHORTLIST, encoding="utf-8") as f:
              shortlist_data = json.load(f)

          candidates = shortlist_data.get("candidates", [])[:5]

          cache = {}

          def get_last_matches(team_id):
              if team_id in cache:
                  return cache[team_id]

              url = f"{BASE_URL}/fixtures?team={team_id}&last=5"

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      payload = json.loads(
                          response.read().decode("utf-8")
                      )

              except Exception as e:
                  print(
                      f"ERRORE API team {team_id}: {e}"
                  )
                  cache[team_id] = []
                  return []

              if payload.get("errors"):
                  print(
                      f"ERRORE API team {team_id}: "
                      f"{payload['errors']}"
                  )
                  cache[team_id] = []
                  return []

              result = payload.get("response", [])

              cache[team_id] = result

              time.sleep(0.25)

              return result

          def calculate_form(fixtures, team_id):
              played = 0
              wins = 0
              draws = 0
              losses = 0
              goals_for = 0
              goals_against = 0
              points = 0

              recent = []

              for match in fixtures:
                  fixture = match.get("fixture", {})

                  status = (
                      fixture
                      .get("status", {})
                      .get("short")
                  )

                  if status not in (
                      "FT",
                      "AET",
                      "PEN"
                  ):
                      continue

                  teams = match.get("teams", {})
                  goals = match.get("goals", {})

                  home = teams.get("home", {})
                  away = teams.get("away", {})

                  home_id = home.get("id")
                  away_id = away.get("id")

                  home_goals = goals.get("home")
                  away_goals = goals.get("away")

                  if (
                      home_goals is None
                      or away_goals is None
                  ):
                      continue

                  if team_id == home_id:
                      gf = home_goals
                      ga = away_goals
                      opponent = away.get("name")
                      venue = "HOME"

                  elif team_id == away_id:
                      gf = away_goals
                      ga = home_goals
                      opponent = home.get("name")
                      venue = "AWAY"

                  else:
                      continue

                  played += 1

                  goals_for += gf
                  goals_against += ga

                  if gf > ga:
                      result = "W"
                      wins += 1
                      points += 3

                  elif gf == ga:
                      result = "D"
                      draws += 1
                      points += 1

                  else:
                      result = "L"
                      losses += 1

                  recent.append({
                      "date": fixture.get("date"),
                      "opponent": opponent,
                      "venue": venue,
                      "goalsFor": gf,
                      "goalsAgainst": ga,
                      "result": result
                  })

              if played == 0:
                  return {
                      "played": 0,
                      "wins": 0,
                      "draws": 0,
                      "losses": 0,
                      "goalsFor": 0,
                      "goalsAgainst": 0,
                      "points": 0,
                      "pointsPerGame": None,
                      "avgGoalsFor": None,
                      "avgGoalsAgainst": None,
                      "recent": []
                  }

              return {
                  "played": played,
                  "wins": wins,
                  "draws": draws,
                  "losses": losses,
                  "goalsFor": goals_for,
                  "goalsAgainst": goals_against,
                  "points": points,

                  "pointsPerGame":
                      round(points / played, 2),

                  "avgGoalsFor":
                      round(goals_for / played, 2),

                  "avgGoalsAgainst":
                      round(goals_against / played, 2),

                  "recent": recent
              }

          analysis = []

          print()
          print("=================================")
          print("BETLAB FORM ENGINE")
          print("=================================")
          print()

          for candidate in candidates:
              home = candidate["home"]
              away = candidate["away"]

              print(
                  f'Analisi: '
                  f'{home["name"]} - '
                  f'{away["name"]}'
              )

              home_fixtures = get_last_matches(
                  home["id"]
              )

              away_fixtures = get_last_matches(
                  away["id"]
              )

              home_form = calculate_form(
                  home_fixtures,
                  home["id"]
              )

              away_form = calculate_form(
                  away_fixtures,
                  away["id"]
              )

              analysis.append({
                  "fixtureId":
                      candidate["fixtureId"],

                  "date":
                      candidate["date"],

                  "country":
                      candidate["country"],

                  "league":
                      candidate["league"],

                  "leagueId":
                      candidate["leagueId"],

                  "season":
                      candidate["season"],

                  "home": {
                      "id": home["id"],
                      "name": home["name"],
                      "form": home_form
                  },

                  "away": {
                      "id": away["id"],
                      "name": away["name"],
                      "form": away_form
                  }
              })

              print(
                  f'  {home["name"]}: '
                  f'{home_form["wins"]}V '
                  f'{home_form["draws"]}N '
                  f'{home_form["losses"]}P | '
                  f'{home_form["goalsFor"]}-'
                  f'{home_form["goalsAgainst"]}'
              )

              print(
                  f'  {away["name"]}: '
                  f'{away_form["wins"]}V '
                  f'{away_form["draws"]}N '
                  f'{away_form["losses"]}P | '
                  f'{away_form["goalsFor"]}-'
                  f'{away_form["goalsAgainst"]}'
              )

              print()

          output = {
              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "source":
                  "API-Football",

              "matchesAnalyzed":
                  len(analysis),

              "apiRequestsUsed":
                  len(cache),

              "analysis":
                  analysis
          }

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Partite analizzate:",
              len(analysis)
          )

          print(
              "Richieste API utilizzate:",
              len(cache)
          )

          print("BETLAB FORM ENGINE OK")
          PY

      - name: Salva dati BETLAB
        run: |
          git config user.name "BETLAB AI Bot"
          git config user.email "actions@github.com"

          git add data/betlab-matches.json
          git add data/betlab-shortlist.json
          git add data/betlab-analysis.json

          if git diff --cached --quiet
          then
            echo "Nessun aggiornamento."
          else
            git commit -m "Aggiorna analisi BETLAB"

            git pull --rebase origin main

            git push origin main
          fi
