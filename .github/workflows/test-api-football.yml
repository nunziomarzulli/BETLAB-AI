              # Un incontro valido deve avere due squadre DISTINTE e ID API.
              # Le quote sono poi cercate esclusivamente per fixtureId.
              fixture_id = fixture.get("id")
              h_id = (teams.get("home") or {}).get("id")
              a_id = (teams.get("away") or {}).get("id")
              if (not home or not away or canonical(home) == canonical(away)
                  or not isinstance(fixture_id, int) or fixture_id <= 0
                  or (h_id is not None and a_id is not None and h_id == a_id)):
                  print("ESCLUSA FIXTURE CON DATI NON COERENTI:", fixture_id, home, away)
                  continue


              date = str(
