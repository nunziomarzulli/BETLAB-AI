              "athletic club bilbao": "athletic bilbao",
              "rcd espanyol": "espanyol",
              "espanyol barcelona": "espanyol",
              "real madrid cf": "real madrid",
              "fc barcelona": "barcelona",
              "granada cf": "granada",
              "cadiz cf": "cadiz",
              "cd leganes": "leganes",
              "deportivo alaves": "alaves",
              "deportivo la coruna": "deportivo",
              "deportivo de la coruna": "deportivo",
              "bayer 04 leverkusen": "leverkusen",
              "bayer leverkusen": "leverkusen",
              "borussia dortmund": "dortmund",
              "borussia m gladbach": "monchengladbach",
              "borussia monchengladbach": "monchengladbach",
              "vfb stuttgart": "stuttgart",
              "rb leipzig": "leipzig",
              "eintracht frankfurt": "frankfurt",
              "sc freiburg": "freiburg",
              "vfl wolfsburg": "wolfsburg",
              "fc augsburg": "augsburg",
              "fsv mainz 05": "mainz",
              "mainz 05": "mainz",
              "1 fc union berlin": "union berlin",
              "fc union berlin": "union berlin",
              "paris saint germain fc": "psg",
              "paris saint germain": "psg",
              "olympique marseille": "marseille",
              "olympique de marseille": "marseille",
              "olympique lyonnais": "lyon",
              "losc lille": "lille",
              "as monaco": "monaco",
              "ogc nice": "nice",
              "rc lens": "lens",
              "fc nantes": "nantes",
              "stade rennais": "rennes",
              "stade brestois 29": "brest",
              "sl benfica": "benfica",
              "sport lisboa e benfica": "benfica",
              "fc porto": "porto",
              "sporting cp": "sporting lisbon",
              "sporting clube de portugal": "sporting lisbon",
              "sporting lisbon": "sporting lisbon",
              "sc braga": "braga",
              "vitoria guimaraes": "guimaraes",
              "vitoria sc": "guimaraes",
              "az alkmaar": "az",
              "psv eindhoven": "psv",
              "fc twente": "twente",
              "feyenoord rotterdam": "feyenoord",
              "ajax amsterdam": "ajax",
              "club brugge": "club brugge",
              "club brugge kv": "club brugge",
              "royal antwerp": "antwerp",
              "royal antwerp fc": "antwerp",
              "fenerbahce sk": "fenerbahce",
              "galatasaray sk": "galatasaray",
              "besiktas jk": "besiktas",
              "besiktas istanbul": "besiktas"

          }


          def canonical(value):

              key = normalize(value)

              return ALIASES.get(
                  key,
                  key
              )


          def safe_float(value):

              try:
                  return float(value)

              except:
                  return None


          def clamp(value, low, high):

              return max(
                  low,
                  min(
                      high,
                      value
                  )
              )


          # ==========================================================
          # API
          # ==========================================================

          def api_get(endpoint, params):

              query = urllib.parse.urlencode(
                  params
              )

              url = (
                  "https://v3.football.api-sports.io/"
                  + endpoint
                  + "?"
                  + query
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key":
                          API_KEY
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=45
              ) as response:

                  payload = json.loads(
                      response.read().decode(
                          "utf-8"
                      )
                  )

              errors = payload.get(
                  "errors"
              )

              if errors:
                  raise RuntimeError(
                      f"API ERROR {endpoint}: {errors}"
                  )

              return payload


          # ==========================================================
          # FILE JSON
          # ==========================================================

          def load_json(path, default):

              if not os.path.exists(path):
                  return default

              try:

                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      return json.load(f)

              except:

                  return default


          def save_json(path, data):

              os.makedirs(
                  os.path.dirname(path),
                  exist_ok=True
              )

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # ==========================================================
          # SCARICA CALENDARIO OGGI + PROSSIMI 6 GIORNI
          # ==========================================================

          all_api_matches = []

          print("")
          print("==============================================")
          print("BETLAB AI ENGINE STABILE")
          print("==============================================")
          print("")


          unavailable_days = []
          fixture_requests = 0
          for day in DAYS:
              future_path = f"data/future/{day}.json"
              payload = None
              try:
                  fixture_requests += 1
                  payload = api_get("fixtures", {"date": day})
                  if not isinstance(payload, dict):
                      raise RuntimeError("Risposta API non valida")
                  save_json(future_path, payload)
                  source = "API"
              except Exception as exc:
                  # Il piano Free puo' negare date future. Recupera SOLO dati
                  # gia' salvati per quel giorno, mai risultati inventati.
                  cached = load_json(future_path, None)
                  if isinstance(cached, dict) and isinstance(cached.get("response"), list):
                      payload = cached
                      source = "cache"
                  elif day == TODAY.isoformat():
                      raise
                  else:
                      unavailable_days.append(day)
                      print(f"{day}: calendario non disponibile ({str(exc)[:150]})")
                      continue

              fixtures = payload.get("response") or []
              all_api_matches.extend(fixtures)
              print(f"{day}: {len(fixtures)} partite ({source})")

          print("Giorni senza calendario verificabile:", unavailable_days)


          # ==========================================================
          # DEDUPE API
          # ==========================================================

          api_by_id = {}

          for item in all_api_matches:

              fixture_id = (
                  item.get("fixture", {})
                  .get("id")
              )

              if fixture_id is not None:

                  api_by_id[
                      fixture_id
                  ] = item


          all_api_matches = list(
              api_by_id.values()
          )


          print(
              "Partite API uniche:",
              len(all_api_matches)
          )


          # ==========================================================
          # STORICO
          # ==========================================================

          # Non sostituire MAI uno storico corrotto/assente con [] e salvarlo.
          HISTORY_PATH = "data/betlab-history.json"
          if not os.path.isfile(HISTORY_PATH):
              raise RuntimeError("Storico BETLAB assente: operazione fermata senza cancellare dati")
          with open(HISTORY_PATH, encoding="utf-8") as _history_file:
              history_payload = json.load(_history_file)


          if isinstance(
              history_payload,
              dict
          ):

              history = (
                  history_payload.get("matches")
                  or
                  history_payload.get("history")
                  or
                  []
              )

          else:

              history = history_payload


          if not isinstance(history, list) or not history:
              raise RuntimeError("Storico BETLAB vuoto o formato non valido: nessuna modifica")
          print("Storico iniziale:", len(history))


          # ==========================================================
          # FUNZIONI STORICO
          # ==========================================================

          def historical_team_name(
              record,
              side
          ):

              value = record.get(side)

              if isinstance(value, dict):

                  return value.get(
                      "name"
                  )

              return value


          def historical_goals(record):

              home_goals = record.get(
                  "homeGoals"
              )

              away_goals = record.get(
                  "awayGoals"
              )

              if (
                  home_goals is not None
                  and
                  away_goals is not None
              ):

                  return (
                      home_goals,
                      away_goals
                  )


              goal_data = (
                  record.get("goals")
                  or
                  {}
              )

              return (
                  goal_data.get("home"),
                  goal_data.get("away")
              )


          def logical_history_key(record):

              date = str(
                  record.get("date")
                  or
                  ""
              )[:10]

              home = historical_team_name(
                  record,
                  "home"
              )

              away = historical_team_name(
                  record,
                  "away"
              )

              return (
                  date,
                  canonical(home),
                  canonical(away)
              )


          # ==========================================================
          # INTEGRAZIONE RISULTATI 2026-27 - FONTI CSV PUBBLICHE
          # ==========================================================
          # Indipendente dalla quota API-Football e dal workflow separato.
          # Solo risultati FT con data PASSATA; mai esiti di oggi o futuri.
          # Le fonti che non rispondono sono semplicemente saltate.
          import csv
          import io

          CSV_SEASONS = ("2526", "2627")
          CSV_SOURCES = [
              ("E0", "England", "Premier League"),
              ("E1", "England", "Championship"),
              ("E2", "England", "League One"),
              ("E3", "England", "League Two"),
              ("SC0", "Scotland", "Premiership"),
              ("SC1", "Scotland", "Championship"),
              ("D1", "Germany", "Bundesliga"),
              ("D2", "Germany", "2. Bundesliga"),
              ("I1", "Italy", "Serie A"),
              ("I2", "Italy", "Serie B"),
              ("SP1", "Spain", "La Liga"),
              ("SP2", "Spain", "Segunda Division"),
              ("F1", "France", "Ligue 1"),
              ("F2", "France", "Ligue 2"),
              ("N1", "Netherlands", "Eredivisie"),
              ("B1", "Belgium", "Jupiler Pro League"),
              ("P1", "Portugal", "Primeira Liga"),
              ("T1", "Turkey", "Super Lig"),
              ("G1", "Greece", "Super League 1"),
          ]

          def parse_csv_result_date(text):
              for fmt in ("%d/%m/%Y", "%d/%m/%y", "%Y-%m-%d"):
                  try:
                      return datetime.strptime(str(text or "").strip(), fmt).date()
                  except ValueError:
                      continue
              return None

          def parse_csv_goals(value):
              value = str(value or "").strip()
              if not re.fullmatch(r"\d+", value):
                  return None
              return int(value)

          initial_keys = {
              logical_history_key(record)
              for record in history if isinstance(record, dict)
          }
          csv_import_added = 0
          csv_sources_ok = 0
          csv_sources_unavailable = 0
          csv_results_examined = 0
          for season, division, country, league_name in [
              (s, d, c, lg) for s in CSV_SEASONS for d, c, lg in CSV_SOURCES
          ]:
              url = f"https://www.football-data.co.uk/mmz4281/{season}/{division}.csv"
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "BETLAB-AI (+historical-results)",
                               "Accept": "text/csv"}
                  )
                  with urllib.request.urlopen(request, timeout=12) as response:
                      blob = response.read(2_500_001)
                  if len(blob) > 2_500_000:
                      raise ValueError("CSV troppo grande")
                  text_csv = blob.decode("utf-8-sig", errors="replace")
                  reader = csv.DictReader(io.StringIO(text_csv))
                  if not {"Date", "HomeTeam", "AwayTeam", "FTHG", "FTAG"}.issubset(reader.fieldnames or []):
                      raise ValueError("Colonne richieste non presenti")
                  csv_sources_ok += 1
                  for result in reader:
                      if not isinstance(result, dict):
                          continue
                      day = parse_csv_result_date(result.get("Date"))
                      if day is None or day >= TODAY:
                          continue
                      home = str(result.get("HomeTeam") or "").strip()
                      away = str(result.get("AwayTeam") or "").strip()
                      hg = parse_csv_goals(result.get("FTHG"))
                      ag = parse_csv_goals(result.get("FTAG"))
                      if (not home or not away or canonical(home) == canonical(away)
                          or hg is None or ag is None):
                          continue
                      csv_results_examined += 1
                      key = (day.isoformat(), canonical(home), canonical(away))
                      if key in initial_keys:
                          continue
                      # Inserisci solo dati realmente presenti nel CSV verificato.
                      history.append({
                          "source": "Football-Data.co.uk",
                          "fixtureId": f"FD-{season}-{division}-{day.isoformat()}-{normalize(home)}-{normalize(away)}",
                          "date": day.isoformat(),
                          "timestamp": 0,
                          "status": "FT",
                          "country": country,
                          "league": league_name,
                          "home": home,
                          "away": away,
                          "homeGoals": hg,
                          "awayGoals": ag
                      })
                      initial_keys.add(key)
                      csv_import_added += 1
              except (OSError, ValueError, UnicodeError, csv.Error) as exc:
                  csv_sources_unavailable += 1
                  print(f"CSV {division} non disponibile: {str(exc)[:120]}")
          print("CSV stagionali disponibili:", csv_sources_ok,
                "| non disponibili:", csv_sources_unavailable,
                "| risultati validi:", csv_results_examined,
                "| nuovi:", csv_import_added)

          # ==========================================================
          # AGGIUNGI RISULTATI COMPLETATI API
          # ==========================================================

          existing_keys = set()

          for record in history:

              key = logical_history_key(
                  record
              )

              if (
                  key[0]
                  and
                  key[1]
                  and
                  key[2]
              ):

                  existing_keys.add(
                      key
                  )


          new_results = 0


          for item in all_api_matches:

              fixture = (
                  item.get("fixture")
                  or
                  {}
              )

              status = (
                  fixture.get("status")
                  or
                  {}
              ).get("short")


              if status not in {
                  "FT",
                  "AET",
                  "PEN"
              }:
                  continue


              teams = (
                  item.get("teams")
                  or
                  {}
              )

              goals = (
                  item.get("goals")
                  or
                  {}
              )


              home = (
                  teams.get("home")
                  or
                  {}
              ).get("name")

              away = (
                  teams.get("away")
                  or
                  {}
              ).get("name")


              hg = goals.get("home")
              ag = goals.get("away")


              if (
                  not home
                  or
                  not away
                  or
                  hg is None
                  or
                  ag is None
              ):
                  continue


              date = str(
                  fixture.get("date")
                  or
                  ""
              )[:10]


              key = (
                  date,
                  canonical(home),
                  canonical(away)
              )


              if key in existing_keys:
                  continue


              league = (
                  item.get("league")
                  or
                  {}
              )


              history.append({

                  "source":
                      "api-football",

                  "fixtureId":
                      fixture.get("id"),

                  "date":
                      date,

                  "timestamp":
                      fixture.get(
                          "timestamp",
                          0
                      ),

                  "country":
                      league.get(
                          "country"
                      ),

                  "league":
                      league.get(
                          "name"
                      ),

                  "home":
                      home,

                  "away":
                      away,

                  "homeGoals":
                      int(hg),

                  "awayGoals":
                      int(ag)

              })


              existing_keys.add(
                  key
              )

              new_results += 1


          # ==========================================================
          # DEDUPE STORICO LOGICO
          # ==========================================================

          unique_history = {}

          for record in history:

              key = logical_history_key(
                  record
              )

              if not all(key):
                  continue


              old = unique_history.get(
                  key
              )


              if old is None:

                  unique_history[
                      key
                  ] = record

                  continue


              old_source = str(
                  old.get("source")
                  or
                  ""
              )

              new_source = str(
                  record.get("source")
                  or
                  ""
              )


              if (
                  new_source == "api-football"
                  and
                  old_source != "api-football"
              ):

                  unique_history[
                      key
                  ] = record


          history = list(
              unique_history.values()
          )


          history.sort(
              key=lambda record:
                  str(
                      record.get("date")
                      or
                      ""
                  )
          )


          save_json(
              "data/betlab-history.json",
              history
          )


          print(
              "Nuovi risultati API:",
              new_results
          )

          print(
              "Storico totale:",
              len(history)
          )


          # ==========================================================
          # PRIORITA CAMPIONATI
          # ==========================================================

          def league_priority(
              country,
              league
          ):

              c = normalize(country)
              l = normalize(league)


              if (
                  "champions league" in l
                  or
                  "europa league" in l
                  or
                  "conference league" in l
              ):
                  return 5


              priority5 = [

                  ("italy", "serie a"),
                  ("england", "premier league"),
                  ("spain", "la liga"),
                  ("spain", "primera division"),
                  ("germany", "bundesliga"),
                  ("france", "ligue 1")

              ]


              for pc, pl in priority5:

                  if (
                      pc in c
                      and
                      pl in l
                  ):
                      return 5


              priority4 = [

                  ("italy", "serie b"),
                  ("england", "championship"),
                  ("spain", "segunda"),
                  ("germany", "2 bundesliga"),
                  ("france", "ligue 2"),
                  ("portugal", "primeira"),
                  ("netherlands", "eredivisie"),
                  ("belgium", ""),
                  ("turkey", "")

              ]


              for pc, pl in priority4:

                  if (
                      pc in c
                      and
                      (
                          not pl
                          or
                          pl in l
                      )
                  ):
                      return 4


              priority3 = [

                  ("brazil", "serie a"),
                  ("argentina", ""),
                  ("scotland", ""),
                  ("usa", "major league soccer"),
                  ("united states", "major league soccer"),
                  ("mexico", "liga mx")

              ]


              for pc, pl in priority3:

                  if (
                      pc in c
                      and
                      (
                          not pl
                          or
                          pl in l
                      )
                  ):
                      return 3


              priority2 = [

                  "greece",
                  "austria",
                  "switzerland",
                  "denmark",
                  "norway",
                  "sweden"

              ]


              for pc in priority2:

                  if pc in c:
                      return 2


              return 0


          # ==========================================================
          # PARTITE STORICHE SQUADRA
          # ==========================================================

          @lru_cache(maxsize=4096)
          def team_games(
              team,
              before_date,
              limit=MAX_HISTORY
          ):

              key = canonical(team)

              games = []


              for record in history:

                  date = str(
                      record.get("date")
                      or
                      ""
                  )[:10]


                  if (
                      not date
                      or
                      date >= before_date
                  ):
                      continue


                  home = historical_team_name(
                      record,
                      "home"
                  )

                  away = historical_team_name(
                      record,
                      "away"
                  )


                  hg, ag = historical_goals(
                      record
                  )


                  if (
                      not home
                      or
                      not away
                      or
                      hg is None
                      or
                      ag is None
                  ):
                      continue


                  if canonical(home) == key:

                      games.append({

                          "date":
                              date,

                          "gf":
                              int(hg),

                          "ga":
                              int(ag),

                          "home":
                              True,
                          "opponent": away

                      })


                  elif canonical(away) == key:

                      games.append({

                          "date":
                              date,

                          "gf":
                              int(ag),

                          "ga":
                              int(hg),

                          "home":
                              False,
                          "opponent": home

                      })


              games.sort(
                  key=lambda x:
                      x["date"]
              )


              return games[
                  -limit:
              ]


          # ==========================================================
          # FRESCHEZZA DELLO STORICO: BLOCCA PRONOSTICI CON DATI DATATI
          # ==========================================================
          # Non e' una calibrazione della probabilita': e' un controllo
          # preliminare per evitare stime fondate soltanto su dati vecchi.
          # Richiediamo almeno 3 incontri negli ultimi 90 giorni, con
          # l'ultimo incontro registrato non piu' vecchio di 30 giorni.
          # La mancata copertura comporta NESSUN PRONOSTICO, non una
          # confidenza inventata. La partita resta visibile nell'analisi.
          def history_freshness(games, match_date):
              try:
                  target = datetime.fromisoformat(str(match_date)[:10]).date()
              except (TypeError, ValueError):
                  return {"eligible": False, "reason": "data_non_valida",
                          "recentGames": 0, "lastRecorded": None,
                          "lastAgeDays": None}
              valid = []
              for game in games:
                  try:
                      played = datetime.fromisoformat(str(game.get("date") or "")[:10]).date()
                  except (ValueError, TypeError, AttributeError):
                      continue
                  age = (target - played).days
                  if age > 0:
                      valid.append((played, age))
              valid.sort(reverse=True)
              recent = sum(1 for _day, age in valid if age <= RECENT_WINDOW_DAYS)
              last_day = valid[0][0] if valid else None
              last_age = valid[0][1] if valid else None
              if len(valid) < MIN_TEAM_HISTORY:
                  reason = "storico_insufficiente"
              elif last_age is None or last_age > MAX_LAST_GAME_AGE_DAYS:
                  reason = "storico_non_recente"
              elif recent < MIN_RECENT_GAMES:
                  reason = "poche_gare_recenti"
              else:
                  reason = "ok"
              return {
                  "eligible": reason == "ok",
                  "reason": reason,
                  "recentGames": recent,
                  "lastRecorded": last_day.isoformat() if last_day else None,
                  "lastAgeDays": last_age,
                  "windowDays": RECENT_WINDOW_DAYS,
                  "requiredRecentGames": MIN_RECENT_GAMES,
                  "maxLastAgeDays": MAX_LAST_GAME_AGE_DAYS
              }

          # ==========================================================
          # ARRICCHIMENTO PROGRESSIVO DELLO STORICO (BUDGET LIMITATO)
          # ==========================================================
          # Il feed iniziale puo' includere centinaia di fixture, ma solo
          # poche con almeno 5 risultati recenti per ciascuna squadra.
          # NON abbassiamo la soglia di affidabilita': recuperiamo pochi
          # risultati reali alla volta, usando le ID squadra API-Football.
          # Il piano Free puo' negare alcune richieste: nessun blocco del feed.

          LOOKUPS_PER_RUN = 4
          LOOKUP_COOLDOWN_SECONDS = 20 * 3600
          BACKFILL_STATE_FILE = "data/betlab-history-enrichment-state.json"
          enrichment_state = load_json(BACKFILL_STATE_FILE, {})
          if not isinstance(enrichment_state, dict):
              enrichment_state = {}
          last_attempt = enrichment_state.get("attempted", {})
          if not isinstance(last_attempt, dict):
              last_attempt = {}

          now_ts = int(datetime.now(ROME).timestamp())
          future_fixtures = []
          for item in all_api_matches:
              f = item.get("fixture") or {}
              lg = item.get("league") or {}
              ts = int(f.get("timestamp") or 0)
              if ((f.get("status") or {}).get("short") not in {"NS", "TBD"}
                  or ts <= now_ts or league_priority(lg.get("country"), lg.get("name")) <= 0):
                  continue
              future_fixtures.append(item)

          future_fixtures.sort(key=lambda item: (
              -league_priority((item.get("league") or {}).get("country"),
                               (item.get("league") or {}).get("name")),
              int((item.get("fixture") or {}).get("timestamp") or 0)
          ))
          requested_teams = set()
          attempted_requests = 0
          enrichment_added = 0
          historical_keys = {logical_history_key(record) for record in history}

          for item in future_fixtures:
              if attempted_requests >= LOOKUPS_PER_RUN:
                  break
              date_limit = str((item.get("fixture") or {}).get("date") or "")[:10]
              teams = item.get("teams") or {}
              for side in ("home", "away"):
                  if attempted_requests >= LOOKUPS_PER_RUN:
                      break
                  obj = teams.get(side) or {}
                  team_id, team_name = obj.get("id"), obj.get("name")
                  if not isinstance(team_id, int) or team_id <= 0 or not team_name:
                      continue
                  key = str(team_id)
                  # Anche uno storico con 10 gare puo' essere vecchio di mesi.
                  # In quel caso tentiamo comunque il recupero delle ultime
                  # partite, rispettando il budget di 4 chiamate per run.
                  if key in requested_teams or history_freshness(
                          team_games(team_name, date_limit), date_limit)["eligible"]:
                      continue
                  requested_teams.add(key)
                  if now_ts - int(last_attempt.get(key) or 0) < LOOKUP_COOLDOWN_SECONDS:
                      continue

                  attempted_requests += 1
                  last_attempt[key] = now_ts
                  try:
                      result = api_get("fixtures", {"team": team_id, "last": MAX_HISTORY})
                      for record in result.get("response") or []:
                          fixture = record.get("fixture") or {}
                          status = (fixture.get("status") or {}).get("short")
                          if status not in {"FT", "AET", "PEN"}:
                              continue
                          date = str(fixture.get("date") or "")[:10]
                          if not date or date >= date_limit:
                              continue
                          clubs = record.get("teams") or {}
                          home = (clubs.get("home") or {}).get("name")
                          away = (clubs.get("away") or {}).get("name")
                          goals = record.get("goals") or {}
                          hg, ag = goals.get("home"), goals.get("away")
                          if (not home or not away or canonical(home) == canonical(away)
                              or hg is None or ag is None):
                              continue
                          record_key = (date, canonical(home), canonical(away))
                          if record_key in historical_keys:
                              continue
                          league = record.get("league") or {}
                          history.append({
                              "source": "api-football",
                              "fixtureId": fixture.get("id"),
                              "date": date,
                              "timestamp": fixture.get("timestamp", 0),
                              "country": league.get("country"),
                              "league": league.get("name"),
                              "home": home,
                              "away": away,
                              "homeGoals": int(hg),
                              "awayGoals": int(ag)
                          })
                          historical_keys.add(record_key)
                          enrichment_added += 1
                  except Exception as exc:
                      print("Recupero storico non disponibile per", team_name, ":", exc)

          enrichment_state["attempted"] = last_attempt
          enrichment_state["updatedAt"] = datetime.now(ROME).isoformat()
          save_json(BACKFILL_STATE_FILE, enrichment_state)
          if enrichment_added:
              history.sort(key=lambda r: str(r.get("date") or ""))
              save_json("data/betlab-history.json", history)
          # team_games e' memorizzata in cache: senza questa pulizia,
          # il recupero appena fatto viene ignorato fino al prossimo run.
          team_games.cache_clear()
          print("Cache statistiche squadre invalidata dopo aggiornamento storico")
          print("Ricerche storico supplementari:", attempted_requests,
                "| Risultati aggiunti:", enrichment_added)

          # ==========================================================
          # STATISTICHE
          # ==========================================================

          def team_stats(games):

              played = len(games)

              if played == 0:

                  return {

                      "played": 0,
                      "wins": 0,
                      "draws": 0,
                      "losses": 0,
                      "gf": 0,
                      "ga": 0,
                      "ppg": 0,
                      "avgGF": 0,
                      "avgGA": 0

                  }


              wins = 0
              draws = 0
              losses = 0
              gf = 0
              ga = 0


              for game in games:

                  gf += game["gf"]
                  ga += game["ga"]


                  if game["gf"] > game["ga"]:
                      wins += 1

                  elif game["gf"] == game["ga"]:
                      draws += 1

                  else:
                      losses += 1


              points = (
                  wins * 3
                  +
                  draws
              )


              return {

                  "played":
                      played,

                  "wins":
                      wins,

                  "draws":
                      draws,

                  "losses":
                      losses,

                  "gf":
                      gf,

                  "ga":
                      ga,

                  "ppg":
                      round(
                          points / played,
                          3
                      ),

                  "avgGF":
                      round(
                          gf / played,
                          3
                      ),

                  "avgGA":
                      round(
                          ga / played,
                          3
                      )

              }


          # ==========================================================
          # FREQUENZE EVENTI
          # ==========================================================

          def event_frequency(
              games,
              predicate
          ):

              if not games:
                  return 0.5


              hits = sum(
                  1
                  for game in games
                  if predicate(game)
              )


              return (
                  hits /
                  len(games)
              )


          # Smussamento bayesiano: ogni squadra contribuisce in base
          # al proprio campione; il prior evita percentuali estreme.
          PRIOR_STRENGTH = 8.0

          def combined_probability(
              home_games,
              away_games,
              home_predicate,
              away_predicate,
              prior=0.50
          ):
              nh = len(home_games)
              na = len(away_games)
              if nh == 0 or na == 0:
                  return prior

              home_hits = sum(1 for g in home_games if home_predicate(g))
              away_hits = sum(1 for g in away_games if away_predicate(g))

              # Non assegnare lo stesso peso a 1 e 10 partite.
              # Le osservazioni vengono aggregate, con prior esplicito.
              return (
                  home_hits + away_hits + PRIOR_STRENGTH * prior
              ) / (nh + na + PRIOR_STRENGTH)


          # ==========================================================
          # CASA/TRASFERTA: AGGIUSTAMENTO SPERIMENTALE E LIMITATO
          # ==========================================================
          # Non usiamo come prova 1-2 sole partite in casa/trasferta.
          # Il risultato specifico per sede viene smussato verso la
          # probabilita' generale (prior 8 incontri equivalenti) e
          # la correzione non puo' superare 10 punti percentuali.
          # L'euristica richiede backtesting: NON e' una calibrazione.
          def contextual_probability(home_games, away_games,
                                     home_predicate, away_predicate,
                                     prior=0.50):
              base = combined_probability(
                  home_games, away_games, home_predicate,
                  away_predicate, prior=prior
              )
              recent_home = [g for g in home_games if g.get("home") is True]
              recent_away = [g for g in away_games if g.get("home") is False]
              if len(recent_home) < 3 or len(recent_away) < 3:
                  return base
              hits = (sum(1 for g in recent_home if home_predicate(g))
                      + sum(1 for g in recent_away if away_predicate(g)))
              sample = len(recent_home) + len(recent_away)
              conditional = (hits + 8.0 * base) / (sample + 8.0)
              return clamp(base + clamp(conditional - base, -0.10, 0.10),
                           0.01, 0.99)

          # ==========================================================
          # POISSON RISULTATO ESATTO
          # ==========================================================

          def weighted_average(
              games,
              field
          ):

              if not games:
                  return None


              total = 0.0
              weights = 0.0


              for index, game in enumerate(
                  games,
                  start=1
              ):

                  weight = index

                  total += (
                      game[field]
                      *
                      weight
                  )

                  weights += weight


              return (
                  total /
                  weights
              )


          def expected_goals(
              home_games,
              away_games
          ):

              home_attack = weighted_average(
                  home_games,
                  "gf"
              )

              home_defence = weighted_average(
                  home_games,
                  "ga"
              )

              away_attack = weighted_average(
                  away_games,
                  "gf"
              )

              away_defence = weighted_average(
                  away_games,
                  "ga"
              )


              if (min(len(home_games), len(away_games)) < MIN_EXPLORATORY_GAMES
                  or None in {home_attack, home_defence, away_attack, away_defence}):
                  # Con 1-3 partite, il risultato sarebbe quasi solo il prior:
                  # non presentare 1-1 o percentuali come analisi di queste squadre.
                  return None, None


              home_xg = (
                  home_attack
                  +
                  away_defence
              ) / 2


              away_xg = (
                  away_attack
                  +
                  home_defence
              ) / 2


              # Usa davvero casa/trasferta quando c'e' un minimo di evidenza.
              home_venue = [g for g in home_games if g.get("home") is True]
              away_venue = [g for g in away_games if g.get("home") is False]
              if len(home_venue) >= 3 and len(away_venue) >= 3:
                  xh_venue = (weighted_average(home_venue, "gf") +
                              weighted_average(away_venue, "ga")) / 2
                  xa_venue = (weighted_average(away_venue, "gf") +
                              weighted_average(home_venue, "ga")) / 2
                  home_xg = 0.68 * home_xg + 0.32 * xh_venue
                  away_xg = 0.68 * away_xg + 0.32 * xa_venue
              home_xg *= 1.08
              away_xg *= 0.92


              # Dati brevi -> forte incertezza. Riduzione verso una
              # media neutra di riferimento, non una probabilita' calibrata.
              n = min(len(home_games), len(away_games))
              # 4 partite: peso parziale; 10-12: i dati della squadra dominano il prior.
              # Il modello resta non calibrato, non una probabilita' di guadagno.
              sample_weight = min(0.82, n / (n + 3.5))
              home_xg = 1.35 + sample_weight * (home_xg - 1.35)
              away_xg = 1.15 + sample_weight * (away_xg - 1.15)
              home_xg = clamp(home_xg, 0.45, 2.80)
              away_xg = clamp(away_xg, 0.40, 2.70)


              return (
                  home_xg,
                  away_xg
              )


          def poisson_probability(
              goals,
              expected
          ):

              return (
                  math.exp(-expected)
                  *
                  expected ** goals
                  /
                  math.factorial(goals)
              )


          # ==========================================================
          # CANDIDATI PARTITA
          # ==========================================================

          def create_candidate(
              market,
              selection,
              probability,
              source="frequency"
          ):

              probability = clamp(
                  probability,
                  0.01,
                  0.99
              )


              return {

                  "market":
                      market,

                  "selection":
                      selection,

                  "modelProbability":
                      round(
                          probability,
                          5
                      ),

                  "index":
                      round(
                          probability * 100,
                          1
                      ),

                  "model":
                      source,

                  "oddAvailable":
                      False,

                  "odd":
                      None,

                  "bookmaker":
                      None,

                  "apiMarket":
                      None,

                  "apiSelection":
                      None,

                  "value":
                      None

              }


          def build_market_candidates(home_games, away_games):
              """Tutti i mercati dalla STESSA distribuzione dei risultati.
              Metodo sperimentale Poisson indipendente, non calibrato.
              Evita che GOAL, PARI, Over e 1X2 si contraddicano.
              """
              # Analisi da storico soltanto quando esistono almeno 4 partite
              # documentate per squadra. Con campione inferiore niente percentuali.
              if min(len(home_games), len(away_games)) < MIN_EXPLORATORY_GAMES:
                  return []
              home_xg, away_xg = expected_goals(home_games, away_games)
              if home_xg is None or away_xg is None:
                  return []

              # Coda trascurabile oltre 12 gol per squadra con lambda <= 2.8.
              # Normalizziamo comunque la matrice a probabilita' totale 1.
              outcomes = []
              for hg in range(13):
                  for ag in range(13):
                      p = poisson_probability(hg, home_xg) * poisson_probability(ag, away_xg)
                      outcomes.append((hg, ag, p))
              mass = sum(p for _, _, p in outcomes)
              outcomes = [(hg, ag, p / mass) for hg, ag, p in outcomes]
              def prob(fn):
                  return sum(p for hg,ag,p in outcomes if fn(hg,ag))
              def candidate(market, selection, value, source="poisson_v10"):
                  c = create_candidate(market, selection, value, source)
                  c["expectedHomeGoals"] = round(home_xg, 3)
                  c["expectedAwayGoals"] = round(away_xg, 3)
                  return c

              home_win = prob(lambda h,a: h > a)
              draw = prob(lambda h,a: h == a)
              away_win = prob(lambda h,a: h < a)
              candidates = [
                  candidate("1X2", "1", home_win),
                  candidate("1X2", "X", draw),
                  candidate("1X2", "2", away_win),
                  candidate("Doppia Chance", "1X", home_win + draw),
                  candidate("Doppia Chance", "X2", draw + away_win),
                  candidate("Doppia Chance", "12", home_win + away_win),
              ]
              goal = prob(lambda h,a: h > 0 and a > 0)
              candidates.extend([
                  candidate("Goal/No Goal", "GOAL", goal),
                  candidate("Goal/No Goal", "NO GOAL", 1.0 - goal),
              ])
              for line in (1.5, 2.5, 3.5):
                  over = prob(lambda h,a,line=line: h + a > line)
                  candidates.extend([
                      candidate("Totale Gol", f"OVER {line}", over),
                      candidate("Totale Gol", f"UNDER {line}", 1 - over),
                  ])
              even = prob(lambda h,a: (h + a) % 2 == 0)
              candidates.extend([
                  candidate("Pari/Dispari", "PARI", even),
                  candidate("Pari/Dispari", "DISPARI", 1.0 - even),
              ])
              for label, fn in [
                  ("0-1", lambda h,a: h + a <= 1),
                  ("2-3", lambda h,a: 2 <= h + a <= 3),
                  ("4-5", lambda h,a: 4 <= h + a <= 5),
                  ("6+", lambda h,a: h + a >= 6),
              ]:
                  candidates.append(candidate("Somma Gol", label, prob(fn)))
              for hg in range(MAX_SCORE_GOALS + 1):
                  for ag in range(MAX_SCORE_GOALS + 1):
                      score_prob = next(p for h,a,p in outcomes if h == hg and a == ag)
                      if score_prob >= MIN_EXACT_SCORE_PROBABILITY:
                          candidates.append(candidate("Risultato Esatto", f"{hg}:{ag}", score_prob))
              candidates.sort(key=lambda c: c["index"], reverse=True)
              return candidates


          # ==========================================================
          # MATCHER QUOTE STRETTO
          # ==========================================================

          def market_normalized(
              value
          ):

              return normalize(value)


          def forbidden_market(
              market_name
          ):

              name = market_normalized(
                  market_name
              )


              forbidden = [

                  "first half",
                  "second half",
                  "1st half",
                  "2nd half",
                  "half time",
                  "halftime",
                  "yellow",
                  "card",
                  "booking",
                  "corner",
                  "player",
                  "team total",
                  "home team",
                  "away team",
                  "minute"

              ]


              return any(
                  text in name
                  for text in forbidden
              )


          def score_tuple(value):

              match = re.fullmatch(
                  r"\s*(\d+)\s*[:\-]\s*(\d+)\s*",
                  str(value or "")
              )


              if not match:
                  return None


              return (
                  int(match.group(1)),
                  int(match.group(2))
              )


          def selection_matches(
              candidate,
              api_market,
              api_value
          ):

              if forbidden_market(
                  api_market
              ):
                  return False


              market = candidate[
                  "market"
              ]

              selection = candidate[
                  "selection"
              ]

              m = market_normalized(
                  api_market
              )

              v = normalize(
                  api_value
              )


              # ------------------------------------------------------
              # 1X2
              # ------------------------------------------------------

              if market == "1X2":

                  if m not in {
                      "match winner",
                      "1x2"
                  }:
                      return False


                  if selection == "1":

                      return v in {
                          "home",
                          "1"
                      }


                  if selection == "X":

                      return v in {
                          "draw",
                          "x"
                      }


                  if selection == "2":

                      return v in {
                          "away",
                          "2"
                      }


              # ------------------------------------------------------
              # DOUBLE CHANCE - ESATTO
              # ------------------------------------------------------

              if market == "Doppia Chance":

                  if m != "double chance":
                      return False


                  accepted = {

                      "1X": {
                          "home draw",
                          "1x"
                      },

                      "X2": {
                          "draw away",
                          "x2"
                      },

                      "12": {
                          "home away",
                          "12"
                      }

                  }


                  return (
                      v
                      in
                      accepted.get(
                          selection,
                          set()
                      )
                  )


              # ------------------------------------------------------
              # BTTS
              # ------------------------------------------------------

              if market == "Goal/No Goal":

                  if m not in {
                      "both teams score",
                      "both teams to score"
                  }:
                      return False


                  if selection == "GOAL":

                      return v in {
                          "yes",
                          "goal"
                      }


                  if selection == "NO GOAL":

                      return v in {
                          "no",
                          "no goal"
                      }


              # ------------------------------------------------------
              # OVER / UNDER FULL TIME
              # ------------------------------------------------------

              if market == "Totale Gol":

                  if m not in {
                      "goals over under",
                      "over under",
                      "total goals"
                  }:
                      return False


                  expected = normalize(
                      selection
                  )


                  return (
                      v == expected
                  )


              # ------------------------------------------------------
              # PARI / DISPARI
              # ------------------------------------------------------

              if market == "Pari/Dispari":

                  if m not in {
                      "odd even",
                      "goals odd even"
                  }:
                      return False


                  if selection == "PARI":

                      return v in {
                          "even",
                          "pari"
                      }


                  if selection == "DISPARI":

                      return v in {
                          "odd",
                          "dispari"
                      }


              # ------------------------------------------------------
              # SOMMA GOL
              # ------------------------------------------------------

              if market == "Somma Gol":

                  allowed_markets = {
                      "total goals",
                      "goal bands",
                      "goals range",
                      "total goal range"
                  }


                  if m not in allowed_markets:
                      return False


                  expected = normalize(
                      selection
                  )


                  return (
                      v == expected
                  )


              # ------------------------------------------------------
              # RISULTATO ESATTO FULL TIME
              # ------------------------------------------------------

              if market == "Risultato Esatto":

                  if m not in {
                      "exact score",
                      "correct score",
                      "full time correct score",
                      "fulltime correct score"
                  }:
                      return False


                  api_score = score_tuple(
                      api_value
                  )

                  betlab_score = score_tuple(
                      selection
                  )


                  return (
                      api_score is not None
                      and
                      api_score == betlab_score
                  )


              return False


          # ==========================================================
          # RECUPERA QUOTE FIXTURE
          # ==========================================================

          odds_cache = {}


          def get_fixture_odds(
              fixture_id
          ):

              if fixture_id in odds_cache:

                  return odds_cache[
                      fixture_id
                  ]


              page = 1
              blocks = []


              while True:

                  payload = api_get(
                      "odds",
                      {
                          "fixture":
                              fixture_id,

                          "page":
                              page
                      }
                  )


                  blocks.extend(
                      payload.get(
                          "response"
                      )
                      or
                      []
                  )


                  paging = (
                      payload.get(
                          "paging"
                      )
                      or
                      {}
                  )


                  current = int(
                      paging.get(
                          "current"
                      )
                      or
                      page
                  )

                  total = int(
                      paging.get(
                          "total"
                      )
                      or
                      1
                  )


                  if current >= total:
                      break


                  page += 1


              odds_cache[
                  fixture_id
              ] = blocks


              return blocks


