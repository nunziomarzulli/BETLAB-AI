name: Aggiorna feed BETLAB

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. REPOSITORY
      # =========================================================

      - name: Scarica repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. PARTITE DI OGGI
      # =========================================================

      - name: Scarica partite API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |
          mkdir -p data

          TODAY=$(TZ=Europe/Rome date +%Y-%m-%d)

          echo "================================="
          echo "BETLAB DATA ENGINE"
          echo "Data: $TODAY"
          echo "================================="

          curl --fail --silent --show-error \
            --request GET \
            --url "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            --header "x-apisports-key: $API_FOOTBALL_KEY" \
            -o data/api-football-raw.json


      # =========================================================
      # 3. SHORTLIST
      # =========================================================

      - name: Costruisci shortlist BETLAB
        run: |
          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          INPUT = "data/api-football-raw.json"
          OUTPUT = "data/betlab-matches.json"
          SHORTLIST = "data/betlab-shortlist.json"

          with open(INPUT, encoding="utf-8") as f:
              data = json.load(f)

          if data.get("errors"):
              print("ERRORE API:")
              print(data["errors"])
              raise SystemExit(1)

          matches = data.get("response", [])

          priority = {

              # TOP 5 EUROPA
              ("Italy", "Serie A"): 3,
              ("England", "Premier League"): 3,
              ("Spain", "La Liga"): 3,
              ("Germany", "Bundesliga"): 3,
              ("France", "Ligue 1"): 3,

              # UEFA
              ("World", "UEFA Champions League"): 3,
              ("World", "UEFA Europa League"): 3,
              ("World", "UEFA Europa Conference League"): 3,

              # SECONDE DIVISIONI
              ("Italy", "Serie B"): 2,
              ("England", "Championship"): 2,
              ("Spain", "Segunda División"): 2,
              ("Germany", "2. Bundesliga"): 2,
              ("France", "Ligue 2"): 2,

              # EUROPA
              ("Portugal", "Primeira Liga"): 2,
              ("Netherlands", "Eredivisie"): 2,
              ("Belgium", "Jupiler Pro League"): 2,
              ("Turkey", "Süper Lig"): 2,
              ("Scotland", "Premiership"): 2,

              # SUD AMERICA
              ("Brazil", "Serie A"): 2,
              ("Argentina", "Liga Profesional Argentina"): 2,

              # NORD AMERICA
              ("USA", "Major League Soccer"): 2,
              ("Mexico", "Liga MX"): 2,

              # ALTRI CAMPIONATI
              ("Greece", "Super League 1"): 1,
              ("Austria", "Bundesliga"): 1,
              ("Switzerland", "Super League"): 1,
              ("Denmark", "Superliga"): 1,
              ("Norway", "Eliteserien"): 1,
              ("Sweden", "Allsvenskan"): 1
          }

          filtered = []

          for match in matches:

              fixture = match.get("fixture", {})
              league = match.get("league", {})
              teams = match.get("teams", {})

              country = league.get("country", "")
              league_name = league.get("name", "")
              status = fixture.get("status", {}).get("short")

              level = priority.get(
                  (country, league_name)
              )

              if level is None:
                  continue

              if status not in ("NS", "TBD"):
                  continue

              home = teams.get("home", {})
              away = teams.get("away", {})

              if not home.get("id"):
                  continue

              if not away.get("id"):
                  continue

              filtered.append({

                  "fixtureId":
                      fixture.get("id"),

                  "date":
                      fixture.get("date"),

                  "timestamp":
                      fixture.get("timestamp"),

                  "status":
                      status,

                  "country":
                      country,

                  "league":
                      league_name,

                  "leagueId":
                      league.get("id"),

                  "season":
                      league.get("season"),

                  "round":
                      league.get("round"),

                  "priority":
                      level,

                  "home": {
                      "id": home.get("id"),
                      "name": home.get("name"),
                      "logo": home.get("logo")
                  },

                  "away": {
                      "id": away.get("id"),
                      "name": away.get("name"),
                      "logo": away.get("logo")
                  }

              })

          filtered.sort(
              key=lambda x: (
                  -x["priority"],
                  x.get("timestamp") or 0
              )
          )

          feed = {

              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "source":
                  "API-Football",

              "total":
                  len(filtered),

              "matches":
                  filtered
          }

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  feed,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          shortlist = filtered[:30]

          shortlist_data = {

              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "total":
                  len(shortlist),

              "candidates":
                  shortlist
          }

          with open(
              SHORTLIST,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  shortlist_data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "Partite API:",
              len(matches)
          )

          print(
              "Partite idonee BETLAB:",
              len(filtered)
          )

          print(
              "Shortlist:",
              len(shortlist)
          )

          print()
          print("PARTITE DA ANALIZZARE:")
          print()

          for match in shortlist:

              print(
                  f'P{match["priority"]} | '
                  f'{match["country"]} | '
                  f'{match["league"]} | '
                  f'{match["home"]["name"]} - '
                  f'{match["away"]["name"]}'
              )

          print()
          print(
              "BETLAB SHORTLIST ENGINE OK"
          )

          PY


      # =========================================================
      # 4. ANALISI FORMA
      #
      # Niente parametro "last".
      # Scarichiamo le partite della stagione per ogni campionato
      # presente nelle prime 5 candidate.
      # =========================================================

      - name: Analizza forma recente squadre
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |
          python3 - <<'PY'

          import json
          import os
          import urllib.request
          import urllib.parse
          import time

          from datetime import datetime, timezone

          SHORTLIST = "data/betlab-shortlist.json"
          OUTPUT = "data/betlab-analysis.json"

          API_KEY = os.environ[
              "API_FOOTBALL_KEY"
          ]

          BASE_URL = (
              "https://v3.football.api-sports.io"
          )

          with open(
              SHORTLIST,
              encoding="utf-8"
          ) as f:

              shortlist_data = json.load(f)

          candidates = (
              shortlist_data
              .get("candidates", [])[:5]
          )

          league_cache = {}

          api_requests = 0


          # -----------------------------------------------------
          # API
          # -----------------------------------------------------

          def get_league_fixtures(
              league_id,
              season
          ):

              global api_requests

              key = (
                  league_id,
                  season
              )

              if key in league_cache:
                  return league_cache[key]

              params = urllib.parse.urlencode({
                  "league": league_id,
                  "season": season
              })

              url = (
                  f"{BASE_URL}/fixtures?"
                  f"{params}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key":
                          API_KEY
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      payload = json.loads(
                          response
                          .read()
                          .decode("utf-8")
                      )

                  api_requests += 1

              except Exception as e:

                  print(
                      "ERRORE DOWNLOAD CAMPIONATO:",
                      league_id,
                      season,
                      e
                  )

                  league_cache[key] = []

                  return []

              if payload.get("errors"):

                  print(
                      "ERRORE API CAMPIONATO:",
                      league_id,
                      season,
                      payload["errors"]
                  )

                  league_cache[key] = []

                  return []

              fixtures = payload.get(
                  "response",
                  []
              )

              league_cache[key] = fixtures

              print(
                  f"Campionato {league_id} "
                  f"stagione {season}: "
                  f"{len(fixtures)} partite scaricate"
              )

              time.sleep(0.3)

              return fixtures


          # -----------------------------------------------------
          # ULTIME 5 PARTITE
          # -----------------------------------------------------

          def get_last_five(
              fixtures,
              team_id,
              target_timestamp
          ):

              completed = []

              for match in fixtures:

                  fixture = match.get(
                      "fixture",
                      {}
                  )

                  status = (
                      fixture
                      .get("status", {})
                      .get("short")
                  )

                  if status not in (
                      "FT",
                      "AET",
                      "PEN"
                  ):
                      continue

                  timestamp = (
                      fixture
                      .get("timestamp")
                      or 0
                  )

                  if (
                      target_timestamp
                      and timestamp
                      >= target_timestamp
                  ):
                      continue

                  teams = match.get(
                      "teams",
                      {}
                  )

                  home_id = (
                      teams
                      .get("home", {})
                      .get("id")
                  )

                  away_id = (
                      teams
                      .get("away", {})
                      .get("id")
                  )

                  if team_id not in (
                      home_id,
                      away_id
                  ):
                      continue

                  completed.append(match)

              completed.sort(
                  key=lambda x:
                      x.get(
                          "fixture",
                          {}
                      ).get(
                          "timestamp",
                          0
                      ),
                  reverse=True
              )

              return completed[:5]


          # -----------------------------------------------------
          # CALCOLO FORMA
          # -----------------------------------------------------

          def calculate_form(
              fixtures,
              team_id
          ):

              wins = 0
              draws = 0
              losses = 0

              goals_for = 0
              goals_against = 0

              points = 0

              recent = []

              for match in fixtures:

                  fixture = match.get(
                      "fixture",
                      {}
                  )

                  teams = match.get(
                      "teams",
                      {}
                  )

                  goals = match.get(
                      "goals",
                      {}
                  )

                  home = teams.get(
                      "home",
                      {}
                  )

                  away = teams.get(
                      "away",
                      {}
                  )

                  home_goals = goals.get(
                      "home"
                  )

                  away_goals = goals.get(
                      "away"
                  )

                  if (
                      home_goals is None
                      or away_goals is None
                  ):
                      continue

                  if team_id == home.get("id"):

                      gf = home_goals
                      ga = away_goals

                      opponent = (
                          away.get("name")
                      )

                      venue = "HOME"

                  elif team_id == away.get("id"):

                      gf = away_goals
                      ga = home_goals

                      opponent = (
                          home.get("name")
                      )

                      venue = "AWAY"

                  else:
                      continue

                  if gf > ga:

                      result = "W"

                      wins += 1
                      points += 3

                  elif gf == ga:

                      result = "D"

                      draws += 1
                      points += 1

                  else:

                      result = "L"

                      losses += 1

                  goals_for += gf
                  goals_against += ga

                  recent.append({

                      "date":
                          fixture.get("date"),

                      "opponent":
                          opponent,

                      "venue":
                          venue,

                      "goalsFor":
                          gf,

                      "goalsAgainst":
                          ga,

                      "result":
                          result

                  })

              played = len(recent)

              if played == 0:

                  return {

                      "played": 0,
                      "wins": 0,
                      "draws": 0,
                      "losses": 0,

                      "goalsFor": 0,
                      "goalsAgainst": 0,

                      "points": 0,

                      "pointsPerGame": None,
                      "avgGoalsFor": None,
                      "avgGoalsAgainst": None,

                      "recent": []
                  }

              return {

                  "played":
                      played,

                  "wins":
                      wins,

                  "draws":
                      draws,

                  "losses":
                      losses,

                  "goalsFor":
                      goals_for,

                  "goalsAgainst":
                      goals_against,

                  "points":
                      points,

                  "pointsPerGame":
                      round(
                          points / played,
                          2
                      ),

                  "avgGoalsFor":
                      round(
                          goals_for / played,
                          2
                      ),

                  "avgGoalsAgainst":
                      round(
                          goals_against / played,
                          2
                      ),

                  "recent":
                      recent
              }


          # -----------------------------------------------------
          # ANALISI
          # -----------------------------------------------------

          analysis = []

          print()
          print(
              "================================="
          )

          print(
              "BETLAB FORM ENGINE V2"
          )

          print(
              "================================="
          )

          print()

          for candidate in candidates:

              home = candidate["home"]
              away = candidate["away"]

              league_id = (
                  candidate["leagueId"]
              )

              season = (
                  candidate["season"]
              )

              target_timestamp = (
                  candidate.get(
                      "timestamp"
                  )
                  or 0
              )

              print(
                  f'Analisi: '
                  f'{home["name"]} - '
                  f'{away["name"]}'
              )

              league_fixtures = (
                  get_league_fixtures(
                      league_id,
                      season
                  )
              )

              home_last = get_last_five(
                  league_fixtures,
                  home["id"],
                  target_timestamp
              )

              away_last = get_last_five(
                  league_fixtures,
                  away["id"],
                  target_timestamp
              )

              home_form = calculate_form(
                  home_last,
                  home["id"]
              )

              away_form = calculate_form(
                  away_last,
                  away["id"]
              )

              analysis.append({

                  "fixtureId":
                      candidate["fixtureId"],

                  "date":
                      candidate["date"],

                  "country":
                      candidate["country"],

                  "league":
                      candidate["league"],

                  "leagueId":
                      league_id,

                  "season":
                      season,

                  "home": {

                      "id":
                          home["id"],

                      "name":
                          home["name"],

                      "form":
                          home_form
                  },

                  "away": {

                      "id":
                          away["id"],

                      "name":
                          away["name"],

                      "form":
                          away_form
                  }

              })

              print(
                  f'  {home["name"]}: '
                  f'{home_form["wins"]}V '
                  f'{home_form["draws"]}N '
                  f'{home_form["losses"]}P | '
                  f'{home_form["goalsFor"]}-'
                  f'{home_form["goalsAgainst"]}'
              )

              print(
                  f'  {away["name"]}: '
                  f'{away_form["wins"]}V '
                  f'{away_form["draws"]}N '
                  f'{away_form["losses"]}P | '
                  f'{away_form["goalsFor"]}-'
                  f'{away_form["goalsAgainst"]}'
              )

              print()


          # -----------------------------------------------------
          # OUTPUT
          # -----------------------------------------------------

          output = {

              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "source":
                  "API-Football",

              "engine":
                  "BETLAB FORM ENGINE V2",

              "matchesAnalyzed":
                  len(analysis),

              "apiRequestsUsed":
                  api_requests,

              "analysis":
                  analysis
          }

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Partite analizzate:",
              len(analysis)
          )

          print(
              "Campionati interrogati:",
              len(league_cache)
          )

          print(
              "Richieste API analisi:",
              api_requests
          )

          print()
          print(
              "BETLAB FORM ENGINE V2 OK"
          )

          PY


      # =========================================================
      # 5. SALVATAGGIO
      # =========================================================

      - name: Salva dati BETLAB
        run: |
          git config user.name "BETLAB AI Bot"
          git config user.email "actions@github.com"

          git add data/betlab-matches.json
          git add data/betlab-shortlist.json
          git add data/betlab-analysis.json

          if git diff --cached --quiet
          then
            echo "Nessun aggiornamento."
          else
            git commit -m "Aggiorna analisi BETLAB"

            git pull --rebase origin main

            git push origin main
          fi
