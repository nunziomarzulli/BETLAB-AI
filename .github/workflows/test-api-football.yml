name: Aggiorna feed BETLAB

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Scarica oggi e domani API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |
          mkdir -p data/future
          rm -f data/future/*.json

          TODAY=$(TZ=Europe/Rome date +%Y-%m-%d)
          TOMORROW=$(TZ=Europe/Rome date -d "+1 day" +%Y-%m-%d)

          echo "================================="
          echo "BETLAB DATA ENGINE V5.1"
          echo "Oggi: $TODAY"
          echo "Domani: $TOMORROW"
          echo "================================="

          for DAY in "$TODAY" "$TOMORROW"
          do
            echo "Scarico $DAY..."

            curl --fail --silent --show-error \
              --request GET \
              --url "https://v3.football.api-sports.io/fixtures?date=$DAY" \
              --header "x-apisports-key: $API_FOOTBALL_KEY" \
              -o "data/future/$DAY.json"
          done

      - name: Costruisci BETLAB V5.1
        run: |
          python3 - <<'PY'

          import json
          import os
          import re
          import glob
          import unicodedata

          from datetime import datetime, timezone


          HISTORY = "data/betlab-history.json"
          MATCHES = "data/betlab-matches.json"
          SHORTLIST = "data/betlab-shortlist.json"
          ANALYSIS = "data/betlab-analysis.json"


          # =====================================================
          # CAMPIONATI
          # =====================================================

          PRIORITY = {

              ("Italy", "Serie A"): 5,
              ("England", "Premier League"): 5,
              ("Spain", "La Liga"): 5,
              ("Germany", "Bundesliga"): 5,
              ("France", "Ligue 1"): 5,

              ("World", "UEFA Champions League"): 5,
              ("World", "UEFA Europa League"): 5,
              ("World", "UEFA Europa Conference League"): 5,

              ("Italy", "Serie B"): 4,
              ("England", "Championship"): 4,
              ("Spain", "Segunda División"): 4,
              ("Germany", "2. Bundesliga"): 4,
              ("France", "Ligue 2"): 4,

              ("Portugal", "Primeira Liga"): 4,
              ("Netherlands", "Eredivisie"): 4,
              ("Belgium", "Jupiler Pro League"): 4,
              ("Turkey", "Süper Lig"): 4,

              ("Brazil", "Serie A"): 3,
              ("Argentina", "Liga Profesional Argentina"): 3,

              ("Scotland", "Premiership"): 3,
              ("USA", "Major League Soccer"): 3,
              ("Mexico", "Liga MX"): 3,

              ("Greece", "Super League 1"): 2,
              ("Austria", "Bundesliga"): 2,
              ("Switzerland", "Super League"): 2,
              ("Denmark", "Superliga"): 2,
              ("Norway", "Eliteserien"): 2,
              ("Sweden", "Allsvenskan"): 2
          }


          # =====================================================
          # NOMI SQUADRE
          # =====================================================

          def basic_normalize(name):

              if not name:
                  return ""

              name = unicodedata.normalize(
                  "NFKD",
                  str(name)
              )

              name = "".join(
                  c for c in name
                  if not unicodedata.combining(c)
              )

              name = name.lower()
              name = name.replace("&", " and ")

              name = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  name
              )

              return re.sub(
                  r"\s+",
                  " ",
                  name
              ).strip()


          ALIASES = {

              "atletico mg":
                  "atletico mineiro",

              "ca mineiro":
                  "atletico mineiro",

              "clube atletico mineiro":
                  "atletico mineiro",

              "atletico mineiro":
                  "atletico mineiro",

              "rb bragantino":
                  "bragantino",

              "red bull bragantino":
                  "bragantino",

              "bragantino":
                  "bragantino",

              "internazionale":
                  "inter",

              "inter milan":
                  "inter",

              "fc internazionale":
                  "inter",

              "internazionale milano":
                  "inter",

              "ac milan":
                  "milan",

              "man utd":
                  "manchester united",

              "manchester utd":
                  "manchester united",

              "man united":
                  "manchester united",

              "man city":
                  "manchester city",

              "wolves":
                  "wolverhampton wanderers",

              "wolverhampton":
                  "wolverhampton wanderers",

              "psg":
                  "paris saint germain",

              "paris sg":
                  "paris saint germain",

              "bayern munich":
                  "bayern munchen",

              "bayern munchen":
                  "bayern munchen",

              "atletico madrid":
                  "atletico de madrid",

              "atletico de madrid":
                  "atletico de madrid"
          }


          CLUB_WORDS = {
              "fc",
              "cf",
              "afc",
              "ac",
              "sc",
              "club",
              "football",
              "calcio"
          }


          def canonical_team(name):

              name = basic_normalize(name)

              if not name:
                  return ""

              if name in ALIASES:
                  return ALIASES[name]

              cleaned = " ".join(
                  word
                  for word in name.split()
                  if word not in CLUB_WORDS
              ).strip()

              return ALIASES.get(
                  cleaned,
                  cleaned
              )


          # =====================================================
          # CARICA API
          # =====================================================

          all_api_matches = []

          files = sorted(
              glob.glob("data/future/*.json")
          )


          print()
          print("=================================")
          print("BETLAB ANALYSIS ENGINE V5.1")
          print("=================================")

          print(
              "Giorni caricati:",
              len(files)
          )


          if not files:
              raise SystemExit(
                  "Nessun file API trovato."
              )


          for filename in files:

              with open(
                  filename,
                  encoding="utf-8"
              ) as f:

                  payload = json.load(f)


              if payload.get("errors"):

                  print(
                      "ERRORE API:",
                      filename,
                      payload["errors"]
                  )

                  raise SystemExit(1)


              response = payload.get(
                  "response",
                  []
              )


              print(
                  os.path.basename(filename),
                  ":",
                  len(response),
                  "partite"
              )


              all_api_matches.extend(
                  response
              )


          # =====================================================
          # DEDUPLICA FIXTURE
          # =====================================================

          unique_api = {}


          for match in all_api_matches:

              fixture_id = (
                  match
                  .get("fixture", {})
                  .get("id")
              )

              if fixture_id is None:
                  continue

              unique_api[
                  str(fixture_id)
              ] = match


          all_api_matches = list(
              unique_api.values()
          )


          print(
              "Partite API uniche:",
              len(all_api_matches)
          )


          # =====================================================
          # STORICO
          # =====================================================

          if os.path.exists(HISTORY):

              with open(
                  HISTORY,
                  encoding="utf-8"
              ) as f:

                  history_data = json.load(f)

              history = history_data.get(
                  "matches",
                  []
              )

          else:

              history = []


          print(
              "Storico disponibile:",
              len(history)
          )


          # =====================================================
          # AGGIUNGE RISULTATI TERMINATI
          # =====================================================

          completed_statuses = {
              "FT",
              "AET",
              "PEN"
          }


          api_fixture_ids = {

              str(match.get("fixtureId"))

              for match in history

              if (
                  match.get("source")
                  != "OpenFootball"
                  and match.get("fixtureId")
                  is not None
              )
          }


          added_results = 0


          for match in all_api_matches:

              fixture = match.get(
                  "fixture",
                  {}
              )

              status = (
                  fixture
                  .get("status", {})
                  .get("short")
              )


              if status not in completed_statuses:
                  continue


              fixture_id = fixture.get("id")

              if fixture_id is None:
                  continue


              if str(fixture_id) in api_fixture_ids:
                  continue


              teams = match.get(
                  "teams",
                  {}
              )

              goals = match.get(
                  "goals",
                  {}
              )


              if (
                  goals.get("home") is None
                  or goals.get("away") is None
              ):
                  continue


              home = teams.get(
                  "home",
                  {}
              )

              away = teams.get(
                  "away",
                  {}
              )

              league = match.get(
                  "league",
                  {}
              )


              history.append({

                  "fixtureId":
                      fixture_id,

                  "source":
                      "API-Football",

                  "date":
                      fixture.get("date"),

                  "timestamp":
                      fixture.get("timestamp"),

                  "status":
                      status,

                  "country":
                      league.get("country"),

                  "league":
                      league.get("name"),

                  "leagueId":
                      league.get("id"),

                  "season":
                      league.get("season"),

                  "round":
                      league.get("round"),

                  "home": {

                      "id":
                          home.get("id"),

                      "name":
                          home.get("name")
                  },

                  "away": {

                      "id":
                          away.get("id"),

                      "name":
                          away.get("name")
                  },

                  "goals": {

                      "home":
                          goals.get("home"),

                      "away":
                          goals.get("away")
                  }

              })


              api_fixture_ids.add(
                  str(fixture_id)
              )

              added_results += 1


          # =====================================================
          # INDICE STORICO
          # =====================================================

          team_history = {}


          for match in history:

              home_key = canonical_team(
                  match
                  .get("home", {})
                  .get("name")
              )

              away_key = canonical_team(
                  match
                  .get("away", {})
                  .get("name")
              )


              if home_key:

                  team_history.setdefault(
                      home_key,
                      []
                  ).append(match)


              if away_key:

                  team_history.setdefault(
                      away_key,
                      []
                  ).append(match)


          # =====================================================
          # FORMA
          # =====================================================

          def calculate_form(
              team_name,
              target_date
          ):

              team_key = canonical_team(
                  team_name
              )

              games = team_history.get(
                  team_key,
                  []
              )

              target_day = str(
                  target_date or ""
              )[:10]

              valid = []


              for match in games:

                  match_day = str(
                      match.get(
                          "date",
                          ""
                      )
                  )[:10]


                  if not match_day:
                      continue


                  if (
                      target_day
                      and match_day >= target_day
                  ):
                      continue


                  goals = match.get(
                      "goals",
                      {}
                  )


                  if (
                      goals.get("home") is None
                      or goals.get("away") is None
                  ):
                      continue


                  valid.append(match)


              valid.sort(
                  key=lambda x:
                      str(
                          x.get(
                              "date",
                              ""
                          )
                      ),
                  reverse=True
              )


              valid = valid[:5]


              wins = 0
              draws = 0
              losses = 0

              goals_for = 0
              goals_against = 0

              points = 0
              recent = []


              for match in valid:

                  home_name = (
                      match
                      .get("home", {})
                      .get("name")
                  )

                  away_name = (
                      match
                      .get("away", {})
                      .get("name")
                  )

                  home_key = canonical_team(
                      home_name
                  )

                  away_key = canonical_team(
                      away_name
                  )

                  home_goals = (
                      match
                      .get("goals", {})
                      .get("home")
                  )

                  away_goals = (
                      match
                      .get("goals", {})
                      .get("away")
                  )


                  if team_key == home_key:

                      gf = home_goals
                      ga = away_goals

                      opponent = away_name
                      venue = "HOME"


                  elif team_key == away_key:

                      gf = away_goals
                      ga = home_goals

                      opponent = home_name
                      venue = "AWAY"


                  else:
                      continue


                  if gf > ga:

                      result = "W"
                      wins += 1
                      points += 3

                  elif gf == ga:

                      result = "D"
                      draws += 1
                      points += 1

                  else:

                      result = "L"
                      losses += 1


                  goals_for += gf
                  goals_against += ga


                  recent.append({

                      "date":
                          match.get("date"),

                      "opponent":
                          opponent,

                      "venue":
                          venue,

                      "goalsFor":
                          gf,

                      "goalsAgainst":
                          ga,

                      "result":
                          result,

                      "source":
                          match.get(
                              "source",
                              "unknown"
                          )
                  })


              played = len(recent)


              return {

                  "canonicalName":
                      team_key,

                  "played":
                      played,

                  "wins":
                      wins,

                  "draws":
                      draws,

                  "losses":
                      losses,

                  "goalsFor":
                      goals_for,

                  "goalsAgainst":
                      goals_against,

                  "points":
                      points,

                  "pointsPerGame":
                      (
                          round(
                              points / played,
                              2
                          )
                          if played
                          else None
                      ),

                  "avgGoalsFor":
                      (
                          round(
                              goals_for / played,
                              2
                          )
                          if played
                          else None
                      ),

                  "avgGoalsAgainst":
                      (
                          round(
                              goals_against / played,
                              2
                          )
                          if played
                          else None
                      ),

                  "recent":
                      recent
              }


          # =====================================================
          # CANDIDATE OGGI + DOMANI
          # =====================================================

          candidates = []


          for match in all_api_matches:

              fixture = match.get(
                  "fixture",
                  {}
              )

              status = (
                  fixture
                  .get("status", {})
                  .get("short")
              )


              if status not in {
                  "NS",
                  "TBD"
              }:
                  continue


              league = match.get(
                  "league",
                  {}
              )

              country = league.get(
                  "country",
                  ""
              )

              league_name = league.get(
                  "name",
                  ""
              )


              priority = PRIORITY.get(
                  (
                      country,
                      league_name
                  )
              )


              if priority is None:
                  continue


              teams = match.get(
                  "teams",
                  {}
              )

              home = teams.get(
                  "home",
                  {}
              )

              away = teams.get(
                  "away",
                  {}
              )


              if (
                  not home.get("name")
                  or not away.get("name")
              ):
                  continue


              home_form = calculate_form(
                  home["name"],
                  fixture.get("date")
              )

              away_form = calculate_form(
                  away["name"],
                  fixture.get("date")
              )


              history_score = (
                  home_form["played"]
                  +
                  away_form["played"]
              )


              candidates.append({

                  "fixtureId":
                      fixture.get("id"),

                  "date":
                      fixture.get("date"),

                  "timestamp":
                      fixture.get("timestamp"),

                  "status":
                      status,

                  "country":
                      country,

                  "league":
                      league_name,

                  "leagueId":
                      league.get("id"),

                  "season":
                      league.get("season"),

                  "round":
                      league.get("round"),

                  "priority":
                      priority,

                  "historyScore":
                      history_score,

                  "dataCoverage":
                      round(
                          history_score / 10,
                          2
                      ),

                  "home": {

                      "id":
                          home.get("id"),

                      "name":
                          home.get("name"),

                      "logo":
                          home.get("logo"),

                      "form":
                          home_form
                  },

                  "away": {

                      "id":
                          away.get("id"),

                      "name":
                          away.get("name"),

                      "logo":
                          away.get("logo"),

                      "form":
                          away_form
                  }

              })


          # =====================================================
          # CLASSIFICA QUALITÀ
          # =====================================================

          def candidate_rank(match):

              hp = (
                  match["home"]
                  ["form"]
                  ["played"]
              )

              ap = (
                  match["away"]
                  ["form"]
                  ["played"]
              )


              both = (
                  1
                  if hp > 0 and ap > 0
                  else 0
              )


              complete = (
                  1
                  if hp == 5 and ap == 5
                  else 0
              )


              return (

                  -complete,
                  -both,
                  -match["historyScore"],
                  -match["priority"],
                  match.get("timestamp") or 0

              )


          candidates.sort(
              key=candidate_rank
          )


          shortlist = candidates[:50]

          # Diamo alla homepage molte più possibilità.
          analysis = candidates[:30]


          # =====================================================
          # LOG
          # =====================================================

          print()
          print("MIGLIORI PARTITE DISPONIBILI")
          print()


          for i, match in enumerate(
              analysis[:15],
              start=1
          ):

              home = match["home"]
              away = match["away"]

              day = str(
                  match["date"]
              )[:10]


              print(
                  f'{i}. {day} | '
                  f'{home["name"]} - '
                  f'{away["name"]}'
              )


              print(
                  f'   Storico: '
                  f'{home["form"]["played"]}'
                  f'+'
                  f'{away["form"]["played"]}'
                  f' | priorità '
                  f'{match["priority"]}'
              )


          # =====================================================
          # OUTPUT
          # =====================================================

          generated_at = datetime.now(
              timezone.utc
          ).isoformat()


          history.sort(
              key=lambda x:
                  str(
                      x.get(
                          "date",
                          ""
                      )
                  )
          )


          history_output = {

              "updatedAt":
                  generated_at,

              "total":
                  len(history),

              "sources": [
                  "API-Football",
                  "OpenFootball"
              ],

              "matches":
                  history
          }


          matches_output = {

              "generatedAt":
                  generated_at,

              "engine":
                  "BETLAB DATA ENGINE V5.1",

              "windowDays":
                  2,

              "total":
                  len(candidates),

              "matches":
                  candidates
          }


          shortlist_output = {

              "generatedAt":
                  generated_at,

              "engine":
                  "BETLAB SHORTLIST V5.1",

              "windowDays":
                  2,

              "total":
                  len(shortlist),

              "candidates":
                  shortlist
          }


          analysis_output = {

              "generatedAt":
                  generated_at,

              "engine":
                  "BETLAB ANALYSIS ENGINE V5.1",

              "windowDays":
                  2,

              "historyMatches":
                  len(history),

              "availableCandidates":
                  len(candidates),

              "matchesAnalyzed":
                  len(analysis),

              "analysis":
                  analysis
          }


          for path, data in [

              (
                  HISTORY,
                  history_output
              ),

              (
                  MATCHES,
                  matches_output
              ),

              (
                  SHORTLIST,
                  shortlist_output
              ),

              (
                  ANALYSIS,
                  analysis_output
              )

          ]:

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # =====================================================
          # RISULTATO
          # =====================================================

          full_coverage = sum(

              1

              for match in candidates

              if (
                  match["home"]["form"]["played"] == 5
                  and
                  match["away"]["form"]["played"] == 5
              )
          )


          both_data = sum(

              1

              for match in candidates

              if (
                  match["home"]["form"]["played"] > 0
                  and
                  match["away"]["form"]["played"] > 0
              )
          )


          print()
          print("=================================")
          print("RISULTATO BETLAB V5.1")
          print("=================================")

          print(
              "Storico totale:",
              len(history)
          )

          print(
              "Nuovi risultati API:",
              added_results
          )

          print(
              "Candidate oggi + domani:",
              len(candidates)
          )

          print(
              "Entrambe con storico:",
              both_data
          )

          print(
              "Copertura completa 5+5:",
              full_coverage
          )

          print(
              "Partite inviate alla homepage:",
              len(analysis)
          )

          print()
          print(
              "BETLAB ANALYSIS ENGINE V5.1 OK"
          )

          PY

      - name: Salva dati BETLAB
        run: |
          git config user.name "BETLAB AI Bot"
          git config user.email "actions@github.com"

          git add data/betlab-history.json
          git add data/betlab-matches.json
          git add data/betlab-shortlist.json
          git add data/betlab-analysis.json

          if git diff --cached --quiet
          then
            echo "Nessun aggiornamento."
          else
            git commit -m "Aggiorna BETLAB V5.1"

            git pull --rebase origin main

            git push origin main
          fi
