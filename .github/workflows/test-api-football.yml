              )


          with ANALYSIS_FILE.open(
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  analysis_output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # LOG
          # ============================================================

          available_predictions = [

              match
              for match in analysis
              if (
                  match.get(
                      "prediction",
