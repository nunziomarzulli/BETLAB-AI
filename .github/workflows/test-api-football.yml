name: Aggiorna feed BETLAB (principale)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"

# Protegge il workflow principale da esecuzioni parallele della stessa definizione.
concurrency:
  group: betlab-feed-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: BETLAB - CALENDARIO NAZIONALE ATTIVO (verifica CSV)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import math
          from functools import lru_cache
          import unicodedata
          import urllib.request
          import urllib.parse

          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo


          API_KEY = os.environ["API_FOOTBALL_KEY"]

          ROME = ZoneInfo("Europe/Rome")

          TODAY = datetime.now(ROME).date()
          YESTERDAY = TODAY - timedelta(days=1)
          TOMORROW = TODAY + timedelta(days=1)
          DAYS_AHEAD = 6

          # Ieri per liquidare le schedine; oggi + sei giorni per il calendario.
          # Le date non disponibili sul piano API vengono segnalate, non inventate.
          DAYS = [YESTERDAY.isoformat()] + [
              (TODAY + timedelta(days=offset)).isoformat()
              for offset in range(DAYS_AHEAD + 1)
          ]

          MAX_HISTORY = 12
          MIN_EXPLORATORY_GAMES = 4
          MIN_EXACT_SCORE_GAMES = 6
          MAX_SCORE_GOALS = 5

          # Qualita' della forma recente: le partite del 2025 non possono
          # determinare da sole un pronostico dell'ottobre 2026.
          RECENT_WINDOW_DAYS = 90
          MIN_RECENT_GAMES = 5
          MIN_TEAM_HISTORY = 6
          MAX_LAST_GAME_AGE_DAYS = 30

          MIN_MARKET_INDEX = 0.0  # Conserva tutti i mercati per il controllo quote finale
          MIN_ODD = 1.10  # Quote da 1,10 in su; niente selezione in base alla sola quota.
          MAX_RECOMMENDED_ODD = 3.00  # Protezione sperimentale dalle quote estreme.
          MIN_RECOMMENDED_PROBABILITY = 0.50
          MIN_EXACT_SCORE_PROBABILITY = 0.025


          # ==========================================================
          # UTILITA
          # ==========================================================

          def normalize(value):

              value = str(value or "")

              value = unicodedata.normalize(
                  "NFKD",
                  value
              )

              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )

              value = value.lower()

              value = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  value
              )

              return " ".join(
                  value.split()
              )


          ALIASES = {

              "atletico mg":
                  "atletico mineiro",

              "ca mineiro":
                  "atletico mineiro",

              "clube atletico mineiro":
                  "atletico mineiro",

              "atletico mineiro":
                  "atletico mineiro",

