name: Aggiorna feed BETLAB

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      # =========================================================
      # 1. SCARICA TUTTE LE PARTITE DEL GIORNO
      # Una sola richiesta API
      # =========================================================

      - name: Scarica partite API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |
          mkdir -p data
          TODAY=$(TZ=Europe/Rome date +%Y-%m-%d)

          echo "================================="
          echo "BETLAB DATA ENGINE"
          echo "Data: $TODAY"
          echo "================================="

          curl --fail --silent --show-error \
            --request GET \
            --url "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            --header "x-apisports-key: $API_FOOTBALL_KEY" \
            -o data/api-football-raw.json

      # =========================================================
      # 2. AGGIORNA ARCHIVIO + CREA SHORTLIST + ANALISI
      # =========================================================

      - name: Costruisci database BETLAB
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          RAW = "data/api-football-raw.json"
          HISTORY = "data/betlab-history.json"
          MATCHES = "data/betlab-matches.json"
          SHORTLIST = "data/betlab-shortlist.json"
          ANALYSIS = "data/betlab-analysis.json"

          # -----------------------------------------------------
          # CAMPIONATI BETLAB
          # -----------------------------------------------------

          priority = {
              # TOP 5
              ("Italy", "Serie A"): 3,
              ("England", "Premier League"): 3,
              ("Spain", "La Liga"): 3,
              ("Germany", "Bundesliga"): 3,
              ("France", "Ligue 1"): 3,

              # UEFA
              ("World", "UEFA Champions League"): 3,
              ("World", "UEFA Europa League"): 3,
              ("World", "UEFA Europa Conference League"): 3,

              # SECONDE DIVISIONI
              ("Italy", "Serie B"): 2,
              ("England", "Championship"): 2,
              ("Spain", "Segunda División"): 2,
              ("Germany", "2. Bundesliga"): 2,
              ("France", "Ligue 2"): 2,

              # EUROPA
              ("Portugal", "Primeira Liga"): 2,
              ("Netherlands", "Eredivisie"): 2,
              ("Belgium", "Jupiler Pro League"): 2,
              ("Turkey", "Süper Lig"): 2,
              ("Scotland", "Premiership"): 2,

              # AMERICHE
              ("Brazil", "Serie A"): 2,
              ("Argentina", "Liga Profesional Argentina"): 2,
              ("USA", "Major League Soccer"): 2,
              ("Mexico", "Liga MX"): 2,

              # ALTRI
              ("Greece", "Super League 1"): 1,
              ("Austria", "Bundesliga"): 1,
              ("Switzerland", "Super League"): 1,
              ("Denmark", "Superliga"): 1,
              ("Norway", "Eliteserien"): 1,
              ("Sweden", "Allsvenskan"): 1
          }

          # -----------------------------------------------------
          # CARICA RISPOSTA API
          # -----------------------------------------------------

          with open(RAW, encoding="utf-8") as f:
              api_data = json.load(f)

          if api_data.get("errors"):
              print("ERRORE API:")
              print(api_data["errors"])
              raise SystemExit(1)

          api_matches = api_data.get("response", [])

          print("Partite ricevute API:", len(api_matches))

          # -----------------------------------------------------
          # CARICA STORICO ESISTENTE
          # -----------------------------------------------------

          if os.path.exists(HISTORY):
              try:
                  with open(HISTORY, encoding="utf-8") as f:
                      history_data = json.load(f)

                  history = history_data.get("matches", [])

              except Exception:
                  history = []
          else:
              history = []

          print("Partite già presenti nello storico:", len(history))

          # Indicizzazione per fixture ID
          history_by_id = {
              str(x["fixtureId"]): x
              for x in history
              if x.get("fixtureId") is not None
          }

          # -----------------------------------------------------
          # AGGIORNA STORICO
          # -----------------------------------------------------

          completed_statuses = {
              "FT",
              "AET",
              "PEN"
          }

          new_completed = 0

          for match in api_matches:
              fixture = match.get("fixture", {})
              league = match.get("league", {})
              teams = match.get("teams", {})
              goals = match.get("goals", {})

              fixture_id = fixture.get("id")

              if fixture_id is None:
                  continue

              status = (
                  fixture
                  .get("status", {})
                  .get("short")
              )

              # Nello storico salviamo solo partite terminate
              if status not in completed_statuses:
                  continue

              home = teams.get("home", {})
              away = teams.get("away", {})

              if not home.get("id") or not away.get("id"):
                  continue

              if goals.get("home") is None:
                  continue

              if goals.get("away") is None:
                  continue

              item = {
                  "fixtureId": fixture_id,
                  "date": fixture.get("date"),
                  "timestamp": fixture.get("timestamp"),
                  "status": status,

                  "country": league.get("country"),
                  "league": league.get("name"),
                  "leagueId": league.get("id"),
                  "season": league.get("season"),
                  "round": league.get("round"),

                  "home": {
                      "id": home.get("id"),
                      "name": home.get("name")
                  },

                  "away": {
                      "id": away.get("id"),
                      "name": away.get("name")
                  },

                  "goals": {
                      "home": goals.get("home"),
                      "away": goals.get("away")
                  }
              }

              key = str(fixture_id)

              if key not in history_by_id:
                  new_completed += 1

              history_by_id[key] = item

          history = list(history_by_id.values())

          history.sort(
              key=lambda x: x.get("timestamp") or 0
          )

          history_output = {
              "updatedAt":
                  datetime.now(timezone.utc).isoformat(),

              "total":
                  len(history),

              "matches":
                  history
          }

          with open(
              HISTORY,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  history_output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Nuovi risultati aggiunti:", new_completed)
          print("Totale storico BETLAB:", len(history))

          # -----------------------------------------------------
          # PARTITE FUTURE IDONEE DI OGGI
          # -----------------------------------------------------

          future = []

          for match in api_matches:
              fixture = match.get("fixture", {})
              league = match.get("league", {})
              teams = match.get("teams", {})

              country = league.get("country", "")
              league_name = league.get("name", "")

              level = priority.get(
                  (country, league_name)
              )

              if level is None:
                  continue

              status = (
                  fixture
                  .get("status", {})
                  .get("short")
              )

              if status not in ("NS", "TBD"):
                  continue

              home = teams.get("home", {})
              away = teams.get("away", {})

              if not home.get("id") or not away.get("id"):
                  continue

              future.append({
                  "fixtureId": fixture.get("id"),
                  "date": fixture.get("date"),
                  "timestamp": fixture.get("timestamp"),
                  "status": status,

                  "country": country,
                  "league": league_name,
                  "leagueId": league.get("id"),
                  "season": league.get("season"),
                  "round": league.get("round"),

                  "priority": level,

                  "home": {
                      "id": home.get("id"),
                      "name": home.get("name"),
                      "logo": home.get("logo")
                  },

                  "away": {
                      "id": away.get("id"),
                      "name": away.get("name"),
                      "logo": away.get("logo")
                  }
              })

          future.sort(
              key=lambda x: (
                  -x["priority"],
                  x.get("timestamp") or 0
              )
          )

          matches_output = {
              "generatedAt":
                  datetime.now(timezone.utc).isoformat(),

              "source": "API-Football",

              "total": len(future),

              "matches": future
          }

          with open(
              MATCHES,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  matches_output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # -----------------------------------------------------
          # SHORTLIST
          # -----------------------------------------------------

          shortlist = future[:30]

          shortlist_output = {
              "generatedAt":
                  datetime.now(timezone.utc).isoformat(),

              "total":
                  len(shortlist),

              "candidates":
                  shortlist
          }

          with open(
              SHORTLIST,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  shortlist_output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # -----------------------------------------------------
          # FORMA DAL NOSTRO ARCHIVIO
          # -----------------------------------------------------

          def calculate_form(team_id, before_timestamp):
              games = []

              for match in history:
                  timestamp = match.get("timestamp") or 0

                  if before_timestamp and timestamp >= before_timestamp:
                      continue

                  home_id = (
                      match
                      .get("home", {})
                      .get("id")
                  )

                  away_id = (
                      match
                      .get("away", {})
                      .get("id")
                  )

                  if team_id not in (home_id, away_id):
                      continue

                  games.append(match)

              games.sort(
                  key=lambda x: x.get("timestamp") or 0,
                  reverse=True
              )

              games = games[:5]

              wins = 0
              draws = 0
              losses = 0
              goals_for = 0
              goals_against = 0
              points = 0
              recent = []

              for match in games:
                  home = match["home"]
                  away = match["away"]
                  goals = match["goals"]

                  if team_id == home["id"]:
                      gf = goals["home"]
                      ga = goals["away"]
                      opponent = away["name"]
                      venue = "HOME"
                  else:
                      gf = goals["away"]
                      ga = goals["home"]
                      opponent = home["name"]
                      venue = "AWAY"

                  if gf > ga:
                      result = "W"
                      wins += 1
                      points += 3

                  elif gf == ga:
                      result = "D"
                      draws += 1
                      points += 1

                  else:
                      result = "L"
                      losses += 1

                  goals_for += gf
                  goals_against += ga

                  recent.append({
                      "date": match.get("date"),
                      "opponent": opponent,
                      "venue": venue,
                      "goalsFor": gf,
                      "goalsAgainst": ga,
                      "result": result
                  })

              played = len(games)

              return {
                  "played": played,
                  "wins": wins,
                  "draws": draws,
                  "losses": losses,
                  "goalsFor": goals_for,
                  "goalsAgainst": goals_against,
                  "points": points,

                  "pointsPerGame":
                      round(points / played, 2)
                      if played else None,

                  "avgGoalsFor":
                      round(goals_for / played, 2)
                      if played else None,

                  "avgGoalsAgainst":
                      round(goals_against / played, 2)
                      if played else None,

                  "recent": recent
              }

          # -----------------------------------------------------
          # ANALIZZA PRIME 5 CANDIDATE
          # -----------------------------------------------------

          analysis = []

          print()
          print("=================================")
          print("BETLAB HISTORY ENGINE")
          print("=================================")
          print()

          for candidate in shortlist[:5]:
              home = candidate["home"]
              away = candidate["away"]

              timestamp = candidate.get("timestamp") or 0

              home_form = calculate_form(
                  home["id"],
                  timestamp
              )

              away_form = calculate_form(
                  away["id"],
                  timestamp
              )

              analysis.append({
                  "fixtureId": candidate["fixtureId"],
                  "date": candidate["date"],
                  "country": candidate["country"],
                  "league": candidate["league"],

                  "home": {
                      "id": home["id"],
                      "name": home["name"],
                      "form": home_form
                  },

                  "away": {
                      "id": away["id"],
                      "name": away["name"],
                      "form": away_form
                  }
              })

              print(
                  f'{home["name"]}: '
                  f'{home_form["wins"]}V '
                  f'{home_form["draws"]}N '
                  f'{home_form["losses"]}P '
                  f'({home_form["played"]} gare)'
              )

              print(
                  f'{away["name"]}: '
                  f'{away_form["wins"]}V '
                  f'{away_form["draws"]}N '
                  f'{away_form["losses"]}P '
                  f'({away_form["played"]} gare)'
              )

              print()

          analysis_output = {
              "generatedAt":
                  datetime.now(timezone.utc).isoformat(),

              "engine":
                  "BETLAB HISTORY ENGINE",

              "historyMatches":
                  len(history),

              "matchesAnalyzed":
                  len(analysis),

              "analysis":
                  analysis
          }

          with open(
              ANALYSIS,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  analysis_output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("=================================")
          print("RISULTATO BETLAB")
          print("=================================")
          print("Partite API:", len(api_matches))
          print("Storico:", len(history))
          print("Nuovi risultati:", new_completed)
          print("Partite idonee oggi:", len(future))
          print("Shortlist:", len(shortlist))
          print("Partite analizzate:", len(analysis))
          print()
          print("BETLAB HISTORY ENGINE OK")

          PY

      # =========================================================
      # 3. SALVA DATABASE
      # =========================================================

      - name: Salva dati BETLAB
        run: |
          git config user.name "BETLAB AI Bot"
          git config user.email "actions@github.com"

          git add data/betlab-history.json
          git add data/betlab-matches.json
          git add data/betlab-shortlist.json
          git add data/betlab-analysis.json

          if git diff --cached --quiet
          then
            echo "Nessun aggiornamento."
          else
            git commit -m "Aggiorna database BETLAB"

            git pull --rebase origin main

            git push origin main
          fi
