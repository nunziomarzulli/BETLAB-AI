      - name: Commit aggiornamenti BETLAB (sincronizzazione sicura)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git commit -m "Aggiorna BETLAB AI - dati e analisi"
          LOCAL_COMMIT="$(git rev-parse HEAD)"

          # Altri workflow possono scrivere su data/ mentre il motore elabora.
          # Una rebase automatica dei JSON può fallire: uniamo i commit
          # e riconciliamo esplicitamente gli archivi append-only.
          for tentativo in 1 2 3 4 5; do
            echo "Sincronizzazione BETLAB: tentativo ${tentativo}/5"
            git fetch --no-tags origin main
            REMOTE_COMMIT="$(git rev-parse FETCH_HEAD)"
            if ! git merge-base --is-ancestor "$REMOTE_COMMIT" HEAD; then
              git merge --no-edit -X ours "$REMOTE_COMMIT" || {
                echo "Conflitto non risolvibile automaticamente: nessun force-push"
                git merge --abort || true
                exit 1
              }
            fi

            # Recupera le voci di storico e audit create da entrambe le
            # esecuzioni. Una previsione liquidata prevale su quella in attesa.
            python3 - "$LOCAL_COMMIT" "$REMOTE_COMMIT" <<'PYMERGE'
          import json
          import subprocess
          import sys
          import unicodedata
          from pathlib import Path

          local_revision, remote_revision = sys.argv[1:]

          def read_at(revision, path):
              output = subprocess.run(
                  ["git", "show", f"{revision}:{path}"],
                  capture_output=True, text=True, check=False
              )
              if output.returncode:
                  return None
              try:
                  return json.loads(output.stdout)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"JSON non valido in {path}: {exc}")

          def name(value):
              if isinstance(value, dict):
                  value = value.get("name", "")
              value = unicodedata.normalize("NFKD", str(value or "").lower())
              return " ".join("".join(c for c in value if not unicodedata.combining(c)).split())

          def historic_key(row):
              day = str(row.get("date") or "")[:10]
              home, away = name(row.get("home")), name(row.get("away"))
              if day and home and away:
                  return ("match", day, home, away)
              if row.get("fixtureId") is not None:
                  return ("id", str(row["fixtureId"]))
              return ("row", json.dumps(row, sort_keys=True, ensure_ascii=False))

          def audit_key(row):
              if row.get("fixtureId") is not None:
                  return ("id", str(row["fixtureId"]))
              return historic_key(row)

          def better(old, new):
              old_final = old.get("status") in {"VINTA", "PERSA", "VALUTATO"}
              new_final = new.get("status") in {"VINTA", "PERSA", "VALUTATO"}
              if old_final != new_final:
                  return new if new_final else old
              # Per previsioni pre-partita conservare lo snapshot più antico.
              return min((old, new), key=lambda r: str(r.get("recordedAt") or "9999"))

          def merge_list(path, key_func, prefer_final):
              remote = read_at(remote_revision, path)
              local = read_at(local_revision, path)
              if not isinstance(remote, list) or not isinstance(local, list):
                  return
              merged = {}
              for row in remote + local:
                  if not isinstance(row, dict):
                      continue
                  key = key_func(row)
                  if key in merged:
                      if prefer_final:
                          merged[key] = better(merged[key], row)
                  else:
                      merged[key] = row
              values = list(merged.values())
              if not prefer_final:
                  values.sort(key=lambda r: str(r.get("date") or ""))
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(json.dumps(values, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print("Archivio unito:", path, len(values), "record")

          merge_list("data/betlab-history.json", historic_key, False)
          merge_list("data/betlab-predictions-log.json", audit_key, True)
          merge_list("data/betlab-model-forecast-log.json", audit_key, True)

          # Prevent old concurrent runs from overwriting a newer analysis.
          # Compare ISO timestamps, which are timezone-aware in Europe/Rome.
          from datetime import datetime, timezone
          def parsed_time(value):
              if not value:
                  return datetime.min.replace(tzinfo=timezone.utc)
              try:
                  return datetime.fromisoformat(str(value).replace('Z','+00:00')).astimezone(timezone.utc)
              except ValueError:
                  return datetime.min.replace(tzinfo=timezone.utc)

          for artifact in ("data/betlab-analysis.json", "data/betlab-backtest.json"):
              local_obj = read_at(local_revision, artifact)
              remote_obj = read_at(remote_revision, artifact)
              if not isinstance(local_obj, dict) or not isinstance(remote_obj, dict):
                  continue
              if parsed_time(remote_obj.get("generatedAt")) > parsed_time(local_obj.get("generatedAt")):
                  Path(artifact).write_text(json.dumps(remote_obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  print("Preservato report remoto più recente:", artifact)

          state_path = "data/betlab-history-enrichment-state.json"
          remote_state = read_at(remote_revision, state_path)
          local_state = read_at(local_revision, state_path)
          if isinstance(remote_state, dict) and isinstance(local_state, dict):
              merged_state = {**remote_state, **local_state}
              attempts = dict(remote_state.get("attempted") or {})
              for key, value in (local_state.get("attempted") or {}).items():
                  attempts[key] = max(int(attempts.get(key) or 0), int(value or 0))
              merged_state["attempted"] = attempts
              merged_state["updatedAt"] = max(str(remote_state.get("updatedAt") or ""),
                                              str(local_state.get("updatedAt") or ""))
              Path(state_path).write_text(json.dumps(merged_state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PYMERGE

            git add -A -- data/
            if ! git diff --cached --quiet; then
              git commit -m "Unisci storico e verifiche BETLAB senza perdere record"
            fi
            if git push origin HEAD:main; then
              echo "Dati BETLAB salvati e sincronizzati correttamente"
              exit 0
            fi
            echo "Un altro workflow ha aggiornato main: nuovo tentativo"
            sleep "$((tentativo * 2))"
          done
          echo "Impossibile sincronizzare dopo 5 tentativi. Nessun force-push effettuato."
          exit 1
