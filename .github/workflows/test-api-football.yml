name: Aggiorna feed BETLAB

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Scarica partite API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |
          mkdir -p data

          TODAY=$(date -u +%Y-%m-%d)

          echo "================================="
          echo "BETLAB DATA ENGINE"
          echo "Data: $TODAY"
          echo "================================="

          curl --fail --silent --show-error \
            --request GET \
            --url "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            --header "x-apisports-key: $API_FOOTBALL_KEY" \
            -o data/api-football-raw.json

      - name: Costruisci feed e preselezione BETLAB
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          INPUT = "data/api-football-raw.json"
          OUTPUT = "data/betlab-matches.json"
          SHORTLIST = "data/betlab-shortlist.json"

          with open(INPUT, encoding="utf-8") as f:
              data = json.load(f)

          if data.get("errors"):
              print("ERRORE API:")
              print(data["errors"])
              raise SystemExit(1)

          matches = data.get("response", [])

          # ==========================================
          # PRIORITA' CAMPIONATI
          # 3 = massima
          # 2 = alta
          # 1 = secondaria
          # ==========================================

          priority = {
              # TOP EUROPA
              ("Italy", "Serie A"): 3,
              ("England", "Premier League"): 3,
              ("Spain", "La Liga"): 3,
              ("Germany", "Bundesliga"): 3,
              ("France", "Ligue 1"): 3,

              # COPPE EUROPEE
              ("World", "UEFA Champions League"): 3,
              ("World", "UEFA Europa League"): 3,
              ("World", "UEFA Europa Conference League"): 3,

              # ALTRI CAMPIONATI IMPORTANTI
              ("Portugal", "Primeira Liga"): 2,
              ("Netherlands", "Eredivisie"): 2,
              ("Belgium", "Jupiler Pro League"): 2,
              ("Turkey", "Süper Lig"): 2,
              ("Scotland", "Premiership"): 2,

              # SECONDE DIVISIONI PRINCIPALI
              ("Italy", "Serie B"): 2,
              ("England", "Championship"): 2,
              ("Spain", "Segunda División"): 2,
              ("Germany", "2. Bundesliga"): 2,
              ("France", "Ligue 2"): 2,

              # AMERICHE
              ("Brazil", "Serie A"): 2,
              ("Argentina", "Liga Profesional Argentina"): 2,
              ("USA", "Major League Soccer"): 2,
              ("Mexico", "Liga MX"): 2,

              # ALTRI
              ("Greece", "Super League 1"): 1,
              ("Austria", "Bundesliga"): 1,
              ("Switzerland", "Super League"): 1,
              ("Denmark", "Superliga"): 1,
              ("Norway", "Eliteserien"): 1,
              ("Sweden", "Allsvenskan"): 1,

              # COPPE NAZIONALI
              ("England", "FA Cup"): 1,
              ("England", "League Cup"): 1,
              ("Spain", "Copa del Rey"): 1,
              ("Germany", "DFB Pokal"): 1,
              ("France", "Coupe de France"): 1
          }

          filtered = []

          for match in matches:
              league = match.get("league", {})

              country = league.get("country", "")
              league_name = league.get("name", "")

              level = priority.get((country, league_name))

              if level is None:
                  continue

              fixture = match.get("fixture", {})
              status = fixture.get("status", {}).get("short")

              # BETLAB lavora sulle partite non ancora iniziate
              if status not in ("NS", "TBD"):
                  continue

              teams = match.get("teams", {})
              home = teams.get("home", {})
              away = teams.get("away", {})

              item = {
                  "fixtureId": fixture.get("id"),
                  "date": fixture.get("date"),
                  "timestamp": fixture.get("timestamp"),
                  "status": status,

                  "country": country,
                  "league": league_name,
                  "leagueId": league.get("id"),
                  "season": league.get("season"),
                  "round": league.get("round"),

                  "priority": level,

                  "home": {
                      "id": home.get("id"),
                      "name": home.get("name"),
                      "logo": home.get("logo")
                  },

                  "away": {
                      "id": away.get("id"),
                      "name": away.get("name"),
                      "logo": away.get("logo")
                  }
              }

              filtered.append(item)

          # Feed cronologico completo
          filtered.sort(
              key=lambda x: x.get("timestamp") or 0
          )

          output = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "API-Football",
              "total": len(filtered),
              "matches": filtered
          }

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ==========================================
          # SHORTLIST INTERNA BETLAB
          # ==========================================
          # Per ora ordiniamo per affidabilita'
          # strutturale della competizione.
          # NON e' ancora una previsione.
          # ==========================================

          shortlist = sorted(
              filtered,
              key=lambda x: (
                  -x["priority"],
                  x.get("timestamp") or 0
              )
          )

          shortlist_output = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "totalCandidates": len(shortlist),
              "candidates": shortlist
          }

          with open(SHORTLIST, "w", encoding="utf-8") as f:
              json.dump(
                  shortlist_output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("Partite API:", len(matches))
          print("Partite BETLAB:", len(filtered))
          print("Candidate shortlist:", len(shortlist))
          print()

          levels = {3: 0, 2: 0, 1: 0}

          for match in shortlist:
              levels[match["priority"]] += 1

          print("Priorita' 3:", levels[3])
          print("Priorita' 2:", levels[2])
          print("Priorita' 1:", levels[1])
          print()

          print("Prime candidate:")

          for match in shortlist[:20]:
              print(
                  f'P{match["priority"]} | '
                  f'{match["league"]} | '
                  f'{match["home"]["name"]} - '
                  f'{match["away"]["name"]}'
              )

          print()
          print("BETLAB PRESELECTION ENGINE OK")
          PY

      - name: Salva dati BETLAB
        run: |
          git config user.name "BETLAB AI Bot"
          git config user.email "actions@github.com"

          git add data/betlab-matches.json
          git add data/betlab-shortlist.json

          if git diff --cached --quiet
          then
            echo "Nessun aggiornamento."
          else
            git commit -m "Aggiorna feed e shortlist BETLAB"

            git pull --rebase origin main

            git push origin main
          fi
