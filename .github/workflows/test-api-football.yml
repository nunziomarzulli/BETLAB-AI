name: Aggiorna feed BETLAB

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Scarica partite API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          mkdir -p data

          TODAY=$(date -u +%Y-%m-%d)

          echo "================================="
          echo "BETLAB DATA ENGINE"
          echo "Data: $TODAY"
          echo "================================="

          curl --fail --silent --show-error \
            --request GET \
            --url "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            --header "x-apisports-key: $API_FOOTBALL_KEY" \
            -o data/api-football-raw.json

      - name: Costruisci feed BETLAB
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          INPUT = "data/api-football-raw.json"
          OUTPUT = "data/betlab-matches.json"

          with open(INPUT, encoding="utf-8") as f:
              data = json.load(f)

          if data.get("errors"):
              print("ERRORE API:")
              print(data["errors"])
              raise SystemExit(1)

          matches = data.get("response", [])

          allowed = {
              ("Italy", "Serie A"),
              ("Italy", "Serie B"),

              ("England", "Premier League"),
              ("England", "Championship"),
              ("England", "League One"),
              ("England", "League Two"),
              ("England", "FA Cup"),
              ("England", "League Cup"),

              ("Spain", "La Liga"),
              ("Spain", "Segunda División"),
              ("Spain", "Copa del Rey"),

              ("Germany", "Bundesliga"),
              ("Germany", "2. Bundesliga"),
              ("Germany", "DFB Pokal"),

              ("France", "Ligue 1"),
              ("France", "Ligue 2"),
              ("France", "Coupe de France"),

              ("Portugal", "Primeira Liga"),
              ("Portugal", "Segunda Liga"),
              ("Portugal", "Taça de Portugal"),

              ("Netherlands", "Eredivisie"),
              ("Netherlands", "Eerste Divisie"),

              ("Belgium", "Jupiler Pro League"),

              ("Scotland", "Premiership"),
              ("Scotland", "Championship"),

              ("Turkey", "Süper Lig"),
              ("Greece", "Super League 1"),
              ("Austria", "Bundesliga"),
              ("Switzerland", "Super League"),
              ("Denmark", "Superliga"),
              ("Norway", "Eliteserien"),
              ("Sweden", "Allsvenskan"),

              ("Brazil", "Serie A"),
              ("Brazil", "Serie B"),

              ("Argentina", "Liga Profesional Argentina"),

              ("USA", "Major League Soccer"),

              ("Mexico", "Liga MX"),

              ("World", "UEFA Champions League"),
              ("World", "UEFA Europa League"),
              ("World", "UEFA Europa Conference League"),
              ("World", "UEFA Nations League"),
              ("World", "World Cup"),
              ("World", "Euro Championship"),
              ("World", "CONMEBOL Libertadores"),
              ("World", "CONMEBOL Sudamericana")
          }

          filtered = []

          for match in matches:
              league = match.get("league", {})

              country = league.get("country", "")
              league_name = league.get("name", "")

              if (country, league_name) not in allowed:
                  continue

              fixture = match.get("fixture", {})
              teams = match.get("teams", {})

              home = teams.get("home", {})
              away = teams.get("away", {})

              filtered.append({
                  "fixtureId": fixture.get("id"),
                  "date": fixture.get("date"),
                  "timestamp": fixture.get("timestamp"),
                  "status": fixture.get("status", {}).get("short"),

                  "country": country,
                  "league": league_name,
                  "leagueId": league.get("id"),
                  "season": league.get("season"),
                  "round": league.get("round"),

                  "home": {
                      "id": home.get("id"),
                      "name": home.get("name"),
                      "logo": home.get("logo")
                  },

                  "away": {
                      "id": away.get("id"),
                      "name": away.get("name"),
                      "logo": away.get("logo")
                  }
              })

          filtered.sort(
              key=lambda x: x.get("timestamp") or 0
          )

          output = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "API-Football",
              "total": len(filtered),
              "matches": filtered
          }

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("Partite ricevute:", len(matches))
          print("Partite BETLAB:", len(filtered))
          print()

          competitions = {}

          for match in filtered:
              key = match["country"] + " | " + match["league"]
              competitions[key] = competitions.get(key, 0) + 1

          print("Competizioni BETLAB:")

          for name, count in sorted(competitions.items()):
              print(f"- {name}: {count}")

          print()
          print("BETLAB FEED OK")
          PY

      - name: Salva feed BETLAB
        run: |
          git config user.name "BETLAB AI Bot"
          git config user.email "actions@github.com"

          git add data/betlab-matches.json

          if git diff --cached --quiet
          then
            echo "Nessun aggiornamento."
          else
            git commit -m "Aggiorna feed BETLAB"

            git pull --rebase origin main

            git push origin main
          fi
