name: Aggiorna feed BETLAB

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. REPOSITORY
      # =========================================================

      - name: Scarica repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. PARTITE DEL GIORNO
      # =========================================================

      - name: Scarica partite API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |
          mkdir -p data

          TODAY=$(TZ=Europe/Rome date +%Y-%m-%d)

          echo "================================="
          echo "BETLAB DATA ENGINE"
          echo "Data: $TODAY"
          echo "================================="

          curl --fail --silent --show-error \
            --request GET \
            --url "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            --header "x-apisports-key: $API_FOOTBALL_KEY" \
            -o data/api-football-raw.json


      # =========================================================
      # 3. MOTORE BETLAB
      # =========================================================

      - name: Analizza partite BETLAB
        run: |
          python3 - <<'PY'

          import json
          import os
          import re
          import unicodedata

          from datetime import datetime, timezone


          RAW = "data/api-football-raw.json"
          HISTORY = "data/betlab-history.json"
          MATCHES = "data/betlab-matches.json"
          SHORTLIST = "data/betlab-shortlist.json"
          ANALYSIS = "data/betlab-analysis.json"


          # =====================================================
          # CAMPIONATI
          # =====================================================

          priority = {

              ("Italy", "Serie A"): 3,
              ("England", "Premier League"): 3,
              ("Spain", "La Liga"): 3,
              ("Germany", "Bundesliga"): 3,
              ("France", "Ligue 1"): 3,

              ("World", "UEFA Champions League"): 3,
              ("World", "UEFA Europa League"): 3,
              ("World", "UEFA Europa Conference League"): 3,

              ("Italy", "Serie B"): 2,
              ("England", "Championship"): 2,
              ("Spain", "Segunda División"): 2,
              ("Germany", "2. Bundesliga"): 2,
              ("France", "Ligue 2"): 2,

              ("Portugal", "Primeira Liga"): 2,
              ("Netherlands", "Eredivisie"): 2,
              ("Belgium", "Jupiler Pro League"): 2,
              ("Turkey", "Süper Lig"): 2,
              ("Scotland", "Premiership"): 2,

              ("Brazil", "Serie A"): 2,
              ("Argentina", "Liga Profesional Argentina"): 2,

              ("USA", "Major League Soccer"): 2,
              ("Mexico", "Liga MX"): 2,

              ("Greece", "Super League 1"): 1,
              ("Austria", "Bundesliga"): 1,
              ("Switzerland", "Super League"): 1,
              ("Denmark", "Superliga"): 1,
              ("Norway", "Eliteserien"): 1,
              ("Sweden", "Allsvenskan"): 1
          }


          # =====================================================
          # NORMALIZZAZIONE NOMI
          # =====================================================

          def normalize_team(name):

              if not name:
                  return ""

              name = unicodedata.normalize(
                  "NFKD",
                  name
              )

              name = "".join(
                  char
                  for char in name
                  if not unicodedata.combining(char)
              )

              name = name.lower()

              replacements = {
                  "&": " and ",
                  "utd": "united",
                  "man utd": "manchester united",
                  "man city": "manchester city",
                  "inter milan": "inter",
                  "internazionale": "inter",
                  "psg": "paris saint germain"
              }

              for old, new in replacements.items():
                  name = name.replace(
                      old,
                      new
                  )

              # Rimuoviamo suffissi molto comuni
              # che cambiano fra provider.

              tokens_to_remove = [
                  "fc",
                  "cf",
                  "afc",
                  "ac",
                  "sc",
                  "calcio",
                  "football club"
              ]

              for token in tokens_to_remove:

                  name = re.sub(
                      r"\b" +
                      re.escape(token) +
                      r"\b",
                      " ",
                      name
                  )

              name = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  name
              )

              name = re.sub(
                  r"\s+",
                  " ",
                  name
              ).strip()

              return name


          # =====================================================
          # CARICA API
          # =====================================================

          with open(
              RAW,
              encoding="utf-8"
          ) as f:

              api_data = json.load(f)

          if api_data.get("errors"):

              print("ERRORE API:")
              print(api_data["errors"])

              raise SystemExit(1)

          api_matches = api_data.get(
              "response",
              []
          )


          # =====================================================
          # CARICA STORICO
          # =====================================================

          if os.path.exists(HISTORY):

              with open(
                  HISTORY,
                  encoding="utf-8"
              ) as f:

                  history_data = json.load(f)

              history = history_data.get(
                  "matches",
                  []
              )

          else:

              history = []


          print()
          print("=================================")
          print("BETLAB ANALYSIS ENGINE")
          print("=================================")

          print(
              "Partite API:",
              len(api_matches)
          )

          print(
              "Storico disponibile:",
              len(history)
          )


          # =====================================================
          # AGGIORNA LO STORICO CON I RISULTATI DI OGGI
          # =====================================================

          history_api_ids = {

              str(match.get("fixtureId"))

              for match in history

              if (
                  match.get("source")
                  != "OpenFootball"
                  and match.get("fixtureId")
                  is not None
              )
          }

          completed_statuses = {
              "FT",
              "AET",
              "PEN"
          }

          added_today = 0

          for match in api_matches:

              fixture = match.get(
                  "fixture",
                  {}
              )

              status = (
                  fixture
                  .get("status", {})
                  .get("short")
              )

              if status not in completed_statuses:
                  continue

              fixture_id = fixture.get("id")

              if fixture_id is None:
                  continue

              if str(fixture_id) in history_api_ids:
                  continue

              teams = match.get(
                  "teams",
                  {}
              )

              home = teams.get(
                  "home",
                  {}
              )

              away = teams.get(
                  "away",
                  {}
              )

              goals = match.get(
                  "goals",
                  {}
              )

              if goals.get("home") is None:
                  continue

              if goals.get("away") is None:
                  continue

              league = match.get(
                  "league",
                  {}
              )

              history.append({

                  "fixtureId":
                      fixture_id,

                  "source":
                      "API-Football",

                  "date":
                      fixture.get("date"),

                  "timestamp":
                      fixture.get("timestamp"),

                  "status":
                      status,

                  "country":
                      league.get("country"),

                  "league":
                      league.get("name"),

                  "leagueId":
                      league.get("id"),

                  "season":
                      league.get("season"),

                  "round":
                      league.get("round"),

                  "home": {

                      "id":
                          home.get("id"),

                      "name":
                          home.get("name")
                  },

                  "away": {

                      "id":
                          away.get("id"),

                      "name":
                          away.get("name")
                  },

                  "goals": {

                      "home":
                          goals.get("home"),

                      "away":
                          goals.get("away")
                  }

              })

              history_api_ids.add(
                  str(fixture_id)
              )

              added_today += 1


          # =====================================================
          # PREPARA INDICE STORICO PER NOME
          # =====================================================

          team_history = {}

          for match in history:

              home_name = (
                  match
                  .get("home", {})
                  .get("name")
              )

              away_name = (
                  match
                  .get("away", {})
                  .get("name")
              )

              home_key = normalize_team(
                  home_name
              )

              away_key = normalize_team(
                  away_name
              )

              if home_key:

                  team_history.setdefault(
                      home_key,
                      []
                  ).append(match)

              if away_key:

                  team_history.setdefault(
                      away_key,
                      []
                  ).append(match)


          # =====================================================
          # CREA PARTITE IDONEE
          # =====================================================

          future = []

          for match in api_matches:

              fixture = match.get(
                  "fixture",
                  {}
              )

              league = match.get(
                  "league",
                  {}
              )

              teams = match.get(
                  "teams",
                  {}
              )

              country = league.get(
                  "country",
                  ""
              )

              league_name = league.get(
                  "name",
                  ""
              )

              level = priority.get(
                  (
                      country,
                      league_name
                  )
              )

              if level is None:
                  continue

              status = (
                  fixture
                  .get("status", {})
                  .get("short")
              )

              if status not in (
                  "NS",
                  "TBD"
              ):
                  continue

              home = teams.get(
                  "home",
                  {}
              )

              away = teams.get(
                  "away",
                  {}
              )

              if not home.get("name"):
                  continue

              if not away.get("name"):
                  continue

              future.append({

                  "fixtureId":
                      fixture.get("id"),

                  "date":
                      fixture.get("date"),

                  "timestamp":
                      fixture.get("timestamp"),

                  "status":
                      status,

                  "country":
                      country,

                  "league":
                      league_name,

                  "leagueId":
                      league.get("id"),

                  "season":
                      league.get("season"),

                  "round":
                      league.get("round"),

                  "priority":
                      level,

                  "home": {

                      "id":
                          home.get("id"),

                      "name":
                          home.get("name"),

                      "logo":
                          home.get("logo")
                  },

                  "away": {

                      "id":
                          away.get("id"),

                      "name":
                          away.get("name"),

                      "logo":
                          away.get("logo")
                  }

              })


          future.sort(
              key=lambda x: (
                  -x["priority"],
                  x.get("timestamp") or 0
              )
          )


          # =====================================================
          # CALCOLO FORMA
          # =====================================================

          def calculate_form(
              team_name,
              target_date
          ):

              team_key = normalize_team(
                  team_name
              )

              games = team_history.get(
                  team_key,
                  []
              )

              valid_games = []

              target_day = str(
                  target_date or ""
              )[:10]

              for match in games:

                  match_day = str(
                      match.get(
                          "date",
                          ""
                      )
                  )[:10]

                  if not match_day:
                      continue

                  if (
                      target_day
                      and match_day >= target_day
                  ):
                      continue

                  valid_games.append(
                      match
                  )


              valid_games.sort(
                  key=lambda x:
                      str(
                          x.get(
                              "date",
                              ""
                          )
                      ),
                  reverse=True
              )

              valid_games = valid_games[:5]


              wins = 0
              draws = 0
              losses = 0

              goals_for = 0
              goals_against = 0

              points = 0

              recent = []


              for match in valid_games:

                  home_name = (
                      match
                      .get("home", {})
                      .get("name")
                  )

                  away_name = (
                      match
                      .get("away", {})
                      .get("name")
                  )

                  home_key = normalize_team(
                      home_name
                  )

                  away_key = normalize_team(
                      away_name
                  )

                  goals = match.get(
                      "goals",
                      {}
                  )

                  home_goals = goals.get(
                      "home"
                  )

                  away_goals = goals.get(
                      "away"
                  )

                  if (
                      home_goals is None
                      or away_goals is None
                  ):
                      continue


                  if team_key == home_key:

                      gf = home_goals
                      ga = away_goals

                      opponent = away_name
                      venue = "HOME"

                  elif team_key == away_key:

                      gf = away_goals
                      ga = home_goals

                      opponent = home_name
                      venue = "AWAY"

                  else:

                      continue


                  if gf > ga:

                      result = "W"

                      wins += 1
                      points += 3

                  elif gf == ga:

                      result = "D"

                      draws += 1
                      points += 1

                  else:

                      result = "L"

                      losses += 1


                  goals_for += gf
                  goals_against += ga


                  recent.append({

                      "date":
                          match.get("date"),

                      "opponent":
                          opponent,

                      "venue":
                          venue,

                      "goalsFor":
                          gf,

                      "goalsAgainst":
                          ga,

                      "result":
                          result,

                      "source":
                          match.get(
                              "source",
                              "API-Football"
                          )
                  })


              played = len(recent)


              return {

                  "teamKey":
                      team_key,

                  "played":
                      played,

                  "wins":
                      wins,

                  "draws":
                      draws,

                  "losses":
                      losses,

                  "goalsFor":
                      goals_for,

                  "goalsAgainst":
                      goals_against,

                  "points":
                      points,

                  "pointsPerGame":
                      (
                          round(
                              points / played,
                              2
                          )
                          if played
                          else None
                      ),

                  "avgGoalsFor":
                      (
                          round(
                              goals_for / played,
                              2
                          )
                          if played
                          else None
                      ),

                  "avgGoalsAgainst":
                      (
                          round(
                              goals_against / played,
                              2
                          )
                          if played
                          else None
                      ),

                  "recent":
                      recent
              }


          # =====================================================
          # ANALISI PRIME 5
          # =====================================================

          analysis = []

          print()
          print("PARTITE DA ANALIZZARE")
          print()


          for candidate in future[:5]:

              home = candidate["home"]
              away = candidate["away"]

              home_form = calculate_form(
                  home["name"],
                  candidate["date"]
              )

              away_form = calculate_form(
                  away["name"],
                  candidate["date"]
              )


              analysis.append({

                  "fixtureId":
                      candidate["fixtureId"],

                  "date":
                      candidate["date"],

                  "country":
                      candidate["country"],

                  "league":
                      candidate["league"],

                  "home": {

                      "id":
                          home.get("id"),

                      "name":
                          home["name"],

                      "form":
                          home_form
                  },

                  "away": {

                      "id":
                          away.get("id"),

                      "name":
                          away["name"],

                      "form":
                          away_form
                  }

              })


              print(
                  f'{home["name"]} - '
                  f'{away["name"]}'
              )

              print(
                  f'  {home["name"]}: '
                  f'{home_form["wins"]}V '
                  f'{home_form["draws"]}N '
                  f'{home_form["losses"]}P | '
                  f'{home_form["goalsFor"]}-'
                  f'{home_form["goalsAgainst"]} | '
                  f'{home_form["played"]} gare'
              )

              print(
                  f'  {away["name"]}: '
                  f'{away_form["wins"]}V '
                  f'{away_form["draws"]}N '
                  f'{away_form["losses"]}P | '
                  f'{away_form["goalsFor"]}-'
                  f'{away_form["goalsAgainst"]} | '
                  f'{away_form["played"]} gare'
              )

              print()


          # =====================================================
          # SALVA FILE
          # =====================================================

          history.sort(
              key=lambda x:
                  str(
                      x.get(
                          "date",
                          ""
                      )
                  )
          )


          history_output = {

              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "total":
                  len(history),

              "sources": [
                  "API-Football",
                  "OpenFootball"
              ],

              "matches":
                  history
          }


          matches_output = {

              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "source":
                  "API-Football",

              "total":
                  len(future),

              "matches":
                  future
          }


          shortlist = future[:30]


          shortlist_output = {

              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "total":
                  len(shortlist),

              "candidates":
                  shortlist
          }


          analysis_output = {

              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "engine":
                  "BETLAB ANALYSIS ENGINE V3",

              "historyMatches":
                  len(history),

              "matchesAnalyzed":
                  len(analysis),

              "analysis":
                  analysis
          }


          with open(
              HISTORY,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  history_output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          with open(
              MATCHES,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  matches_output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          with open(
              SHORTLIST,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  shortlist_output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          with open(
              ANALYSIS,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  analysis_output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # =====================================================
          # RISULTATO
          # =====================================================

          teams_with_data = 0
          teams_without_data = 0

          for item in analysis:

              for side in (
                  "home",
                  "away"
              ):

                  played = (
                      item[side]
                      ["form"]
                      ["played"]
                  )

                  if played > 0:
                      teams_with_data += 1
                  else:
                      teams_without_data += 1


          print("=================================")
          print("RISULTATO BETLAB V3")
          print("=================================")

          print(
              "Storico totale:",
              len(history)
          )

          print(
              "Nuovi risultati API:",
              added_today
          )

          print(
              "Partite idonee oggi:",
              len(future)
          )

          print(
              "Partite analizzate:",
              len(analysis)
          )

          print(
              "Squadre con storico:",
              teams_with_data
          )

          print(
              "Squadre senza storico:",
              teams_without_data
          )

          print()
          print(
              "BETLAB ANALYSIS ENGINE V3 OK"
          )

          PY


      # =========================================================
      # 4. SALVA
      # =========================================================

      - name: Salva dati BETLAB
        run: |
          git config user.name "BETLAB AI Bot"
          git config user.email "actions@github.com"

          git add data/betlab-history.json
          git add data/betlab-matches.json
          git add data/betlab-shortlist.json
          git add data/betlab-analysis.json

          if git diff --cached --quiet
          then
            echo "Nessun aggiornamento."
          else
            git commit -m "Aggiorna analisi BETLAB V3"

            git pull --rebase origin main

            git push origin main
          fi
