                                       canonical((api_teams.get("home") or {}).get("name")),
                                       canonical((api_teams.get("away") or {}).get("name"))))
              supported_bookmakers = {
                  "B365": "Bet365", "BFD": "Betfred", "BW": "Bwin",
                  "PS": "Pinnacle", "WH": "William Hill", "VC": "BetVictor",
                  "IW": "Interwetten", "LB": "Ladbrokes", "SJ": "Stan James",
                  "1XB": "1xBet"
              }
              now_timestamp = int(datetime.now(ROME).timestamp())
              end_date = TODAY + timedelta(days=DAYS_AHEAD)
              for row in fixture_rows:
                  if not isinstance(row, dict):
                      continue
                  division = str(row.get("Div") or "").strip()
                  if division not in football_data_leagues:
                      continue
                  day = parse_csv_result_date(row.get("Date"))
                  if day is None or not TODAY <= day <= end_date:
                      continue
                  home = str(row.get("HomeTeam") or "").strip()
                  away = str(row.get("AwayTeam") or "").strip()
                  if not home or not away or canonical(home) == canonical(away):
                      continue
                  time_value = str(row.get("Time") or "").strip()
                  # Non inventare un orario mancante: si salta la riga.
                  if not re.fullmatch(r"\d{1,2}:\d{2}(?::\d{2})?", time_value):
                      continue
                  try:
                      hh, mm, *ss = map(int, time_value.split(":"))
                      kickoff = datetime(day.year, day.month, day.day, hh, mm,
                                         ss[0] if ss else 0,
                                         tzinfo=ZoneInfo("Europe/London"))
                  except ValueError:
                      continue
                  kickoff_timestamp = int(kickoff.timestamp())
                  if kickoff_timestamp <= now_timestamp:
                      continue
                  iso_day = day.isoformat()
                  identity = (iso_day, canonical(home), canonical(away))
                  if identity in known_api_games:
                      continue
                  known_api_games.add(identity)
                  country, league_name = football_data_leagues[division]
                  # ID locale deterministicamente derivato dalle squadre e dalla data:
                  # non e' un fixture ID di API-Football.
                  digest = hashlib.sha256("|".join(identity).encode("utf-8")).digest()
                  fixture_id = 900_000_000_000_000 + int.from_bytes(digest[:6], "big")

                  bookmakers = []
                  for prefix, bookmaker_name in supported_bookmakers.items():
                      trio = [safe_float(row.get(prefix + x)) for x in ("H", "D", "A")]
                      if any(v is None or not math.isfinite(v) or not 1.02 <= v <= 100
                             for v in trio):
                          continue
                      margin = sum(1.0/v for v in trio)
                      if not 1.005 <= margin <= 1.25:
                          continue
                      bets = [{"name": "Match Winner", "values": [
                          {"value": selection, "odd": str(round(v,3))}
                          for selection, v in zip(("Home", "Draw", "Away"), trio)]}]
                      # Quote Under/Over 2.5 solo quando la fonte le documenta.
                      over = safe_float(row.get(prefix + ">2.5"))
                      under = safe_float(row.get(prefix + "<2.5"))
                      if (over is not None and under is not None and
                          math.isfinite(over) and math.isfinite(under) and
                          1.02 <= over <= 100 and 1.02 <= under <= 100 and
                          1.005 <= 1/over + 1/under <= 1.25):
                          bets.append({"name": "Goals Over/Under", "values": [
                              {"value": "Over 2.5", "odd": str(round(over,3))},
                              {"value": "Under 2.5", "odd": str(round(under,3))}]})
                      bookmakers.append({"name": bookmaker_name, "bets": bets})

                  fixture = {
