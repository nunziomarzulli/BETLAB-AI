name: Aggiorna feed BETLAB

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"

permissions:
  contents: write

jobs:
  update-betlab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aggiorna BETLAB con pronostici e quote
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import math
          import unicodedata
          import urllib.request
          import urllib.parse

          from pathlib import Path
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from collections import defaultdict


          # ============================================================
          # CONFIG
          # ============================================================

          API_KEY = os.environ.get("API_FOOTBALL_KEY")

          if not API_KEY:
              raise SystemExit(
                  "ERRORE: API_FOOTBALL_KEY mancante."
              )

          DATA_DIR = Path("data")
          FUTURE_DIR = DATA_DIR / "future"

          DATA_DIR.mkdir(
              exist_ok=True
          )

          FUTURE_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          HISTORY_FILE = (
              DATA_DIR /
              "betlab-history.json"
          )

          MATCHES_FILE = (
              DATA_DIR /
              "betlab-matches.json"
          )

          SHORTLIST_FILE = (
              DATA_DIR /
              "betlab-shortlist.json"
          )

          ANALYSIS_FILE = (
              DATA_DIR /
              "betlab-analysis.json"
          )


          # ============================================================
          # API
          # ============================================================

          def api_get(
              endpoint,
              params
          ):

              query = urllib.parse.urlencode(
                  params
              )

              url = (
                  "https://v3.football.api-sports.io/"
                  + endpoint
                  + "?"
                  + query
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key":
                          API_KEY
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=40
              ) as response:

                  data = json.loads(
                      response
                      .read()
                      .decode("utf-8")
                  )

              errors = data.get(
                  "errors"
              )

              if errors:
                  raise RuntimeError(
                      f"ERRORE API {endpoint}: {errors}"
                  )

              return data


          # ============================================================
          # NORMALIZZAZIONE
          # ============================================================

          CLUB_WORDS = {
              "fc",
              "cf",
              "ac",
              "sc",
              "club",
              "football",
              "calcio"
          }


          TEAM_ALIASES = {

              "atletico mg":
                  "atletico mineiro",

              "ca mineiro":
                  "atletico mineiro",

              "clube atletico mineiro":
                  "atletico mineiro",

              "atletico mineiro":
                  "atletico mineiro",

              "rb bragantino":
                  "bragantino",

              "red bull bragantino":
                  "bragantino",

              "bragantino":
                  "bragantino",

              "real sociedad ii":
                  "real sociedad b",

              "real sociedad b":
                  "real sociedad b",

              "las palmas":
                  "las palmas",

              "ud las palmas":
                  "las palmas",

              "valladolid":
                  "real valladolid",

              "real valladolid":
                  "real valladolid",

              "sporting gijon":
                  "sporting gijon",

              "real sporting de gijon":
                  "sporting gijon",

              "sporting de gijon":
                  "sporting gijon",

              "castellon":
                  "castellon",

              "cd castellon":
                  "castellon",

              "mallorca":
                  "mallorca",

              "rcd mallorca":
                  "mallorca",

              "inter milan":
                  "inter",

              "internazionale":
                  "inter",

              "inter":
                  "inter",

              "ac milan":
                  "milan",

              "milan":
                  "milan",

              "manchester united":
                  "manchester united",

              "man utd":
                  "manchester united",

              "manchester city":
                  "manchester city",

              "man city":
                  "manchester city",

              "wolverhampton":
                  "wolves",

              "wolverhampton wanderers":
                  "wolves",

              "wolves":
                  "wolves",

              "paris saint germain":
                  "psg",

              "paris saint-germain":
                  "psg",

              "psg":
                  "psg",

              "bayern munich":
                  "bayern munich",

              "bayern munchen":
                  "bayern munich",

              "fc bayern munchen":
                  "bayern munich",

              "atletico madrid":
                  "atletico madrid",

              "atletico de madrid":
                  "atletico madrid"
          }


          def basic_normalize(
              value
          ):

              value = str(
                  value or ""
              )

              value = unicodedata.normalize(
                  "NFKD",
                  value
              )

              value = "".join(
                  c
                  for c in value
                  if not unicodedata.combining(c)
              )

              value = value.lower()

              value = value.replace(
                  "&",
                  " and "
              )

              value = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  value
              )

              words = [
                  word
                  for word in value.split()
                  if word not in CLUB_WORDS
              ]

              return " ".join(
                  words
              ).strip()


          def canonical_team(
              value
          ):

              key = basic_normalize(
                  value
              )

              return TEAM_ALIASES.get(
                  key,
                  key
              )


          # ============================================================
          # LEAGUE PRIORITY
          # ============================================================

          def league_priority(
              country,
              league
          ):

              country_key = basic_normalize(
                  country
              )

              league_key = basic_normalize(
                  league
              )


              priority_5 = [

                  ("italy", "serie a"),
                  ("england", "premier league"),
                  ("spain", "la liga"),
                  ("germany", "bundesliga"),
                  ("france", "ligue 1"),

                  ("world", "uefa champions league"),
                  ("world", "uefa europa league"),
                  ("world", "uefa europa conference league")
              ]


              priority_4 = [

                  ("italy", "serie b"),
                  ("england", "championship"),
                  ("spain", "segunda division"),
                  ("germany", "2 bundesliga"),
                  ("france", "ligue 2"),
                  ("portugal", "primeira liga"),
                  ("netherlands", "eredivisie"),
                  ("belgium", "jupiler pro league"),
                  ("turkey", "super lig")
              ]


              priority_3 = [

                  ("brazil", "serie a"),
                  ("argentina", "liga profesional argentina"),
                  ("scotland", "premiership"),
                  ("usa", "major league soccer"),
                  ("mexico", "liga mx")
              ]


              priority_2 = [

                  ("greece", "super league 1"),
                  ("austria", "bundesliga"),
                  ("switzerland", "super league"),
                  ("denmark", "superliga"),
                  ("norway", "eliteserien"),
                  ("sweden", "allsvenskan")
              ]


              for c, l in priority_5:

                  if (
                      country_key == c
                      and
                      league_key == l
                  ):
                      return 5


              for c, l in priority_4:

                  if (
                      country_key == c
                      and
                      league_key == l
                  ):
                      return 4


              for c, l in priority_3:

                  if (
                      country_key == c
                      and
                      league_key == l
                  ):
                      return 3


              for c, l in priority_2:

                  if (
                      country_key == c
                      and
                      league_key == l
                  ):
                      return 2


              return 0


          # ============================================================
          # HISTORY
          # ============================================================

          if HISTORY_FILE.exists():

              with HISTORY_FILE.open(
                  "r",
                  encoding="utf-8"
              ) as f:

                  history_data = json.load(
                      f
                  )

              if isinstance(
                  history_data,
                  dict
              ):

                  history = (
                      history_data.get(
                          "matches"
                      )
                      or
                      history_data.get(
                          "history"
                      )
                      or
                      []
                  )

              elif isinstance(
                  history_data,
                  list
              ):

                  history = history_data

              else:

                  history = []

          else:

              history = []


          initial_history_count = len(
              history
          )


          # ============================================================
          # DATE
          # ============================================================

          rome = ZoneInfo(
              "Europe/Rome"
          )

          now = datetime.now(
              rome
          )

          today = now.date()

          tomorrow = (
              today
              +
              timedelta(days=1)
          )


          # ============================================================
          # CARICA OGGI + DOMANI
          # ============================================================

          api_fixtures = []

          days_loaded = []


          for day in [
              today,
              tomorrow
          ]:

              day_string = (
                  day.isoformat()
              )

              data = api_get(
                  "fixtures",
                  {
                      "date":
                          day_string
                  }
              )

              fixtures = (
                  data.get(
                      "response"
                  )
                  or
                  []
              )

              days_loaded.append(
                  (
                      day_string,
                      len(fixtures)
                  )
              )

              api_fixtures.extend(
                  fixtures
              )

              output_file = (
                  FUTURE_DIR /
                  f"{day_string}.json"
              )

              with output_file.open(
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # ============================================================
          # API FIXTURE UNIQUE
          # ============================================================

          unique_api = {}

          for item in api_fixtures:

              fixture = (
                  item.get(
                      "fixture"
                  )
                  or
                  {}
              )

              fixture_id = (
                  fixture.get(
                      "id"
                  )
              )

              if fixture_id is not None:

                  unique_api[
                      fixture_id
                  ] = item


          api_fixtures = list(
              unique_api.values()
          )


          # ============================================================
          # AGGIUNGI RISULTATI API ALLO STORICO
          # ============================================================

          finished_statuses = {
              "FT",
              "AET",
              "PEN"
          }


          existing_fixture_ids = set()

          for item in history:

              fixture_id = (
                  item.get(
                      "fixtureId"
                  )
                  or
                  item.get(
                      "fixture_id"
                  )
              )

              if fixture_id:

                  existing_fixture_ids.add(
                      str(fixture_id)
                  )


          new_history_results = 0


          for item in api_fixtures:

              fixture = (
                  item.get(
                      "fixture"
                  )
                  or
                  {}
              )

              status = (
                  fixture.get(
                      "status"
                  )
                  or
                  {}
              )

              short_status = (
                  status.get(
                      "short"
                  )
              )

              if short_status not in finished_statuses:
                  continue


              fixture_id = (
                  fixture.get(
                      "id"
                  )
              )

              if (
                  fixture_id
                  and
                  str(fixture_id)
                  in existing_fixture_ids
              ):
                  continue


              teams = (
                  item.get(
                      "teams"
                  )
                  or
                  {}
              )

              goals = (
                  item.get(
                      "goals"
                  )
                  or
                  {}
              )

              league = (
                  item.get(
                      "league"
                  )
                  or
                  {}
              )


              home_name = (
                  (
                      teams.get(
                          "home"
                      )
                      or
                      {}
                  ).get(
                      "name"
                  )
              )

              away_name = (
                  (
                      teams.get(
                          "away"
                      )
                      or
                      {}
                  ).get(
                      "name"
                  )
              )

              home_goals = (
                  goals.get(
                      "home"
                  )
              )

              away_goals = (
                  goals.get(
                      "away"
                  )
              )


              if (
                  not home_name
                  or
                  not away_name
                  or
                  home_goals is None
                  or
                  away_goals is None
              ):
                  continue


              history.append({

                  "fixtureId":
                      fixture_id,

                  "date":
                      fixture.get(
                          "date"
                      ),

                  "timestamp":
                      fixture.get(
                          "timestamp",
                          0
                      ),

                  "country":
                      league.get(
                          "country"
                      ),

                  "league":
                      league.get(
                          "name"
                      ),

                  "home":
                      home_name,

                  "away":
                      away_name,

                  "homeGoals":
                      home_goals,

                  "awayGoals":
                      away_goals,

                  "source":
                      "api-football"

              })


              if fixture_id:

                  existing_fixture_ids.add(
                      str(fixture_id)
                  )


              new_history_results += 1


          # ============================================================
          # DEDUPE LOGICO STORICO
          # ============================================================

          def history_date_key(
              item
          ):

              raw = str(
                  item.get(
                      "date"
                  )
                  or
                  ""
              )

              return raw[:10]


          def history_home(
              item
          ):

              value = item.get(
                  "home"
              )

              if isinstance(
                  value,
                  dict
              ):

                  return value.get(
                      "name"
                  )

              return value


          def history_away(
              item
          ):

              value = item.get(
                  "away"
              )

              if isinstance(
                  value,
                  dict
              ):

                  return value.get(
                      "name"
                  )

              return value


          def history_goals(
              item
          ):

              home_goals = item.get(
                  "homeGoals"
              )

              away_goals = item.get(
                  "awayGoals"
              )

              if (
                  home_goals is not None
                  and
                  away_goals is not None
              ):

                  return (
                      home_goals,
                      away_goals
                  )


              goals = (
                  item.get(
                      "goals"
                  )
                  or
                  {}
              )

              return (
                  goals.get(
                      "home"
                  ),
                  goals.get(
                      "away"
                  )
              )


          logical_history = {}


          for item in history:

              home_name = history_home(
                  item
              )

              away_name = history_away(
                  item
              )

              home_goals, away_goals = (
                  history_goals(
                      item
                  )
              )


              if (
                  not home_name
                  or
                  not away_name
                  or
                  home_goals is None
                  or
                  away_goals is None
              ):
                  continue


              key = (

                  history_date_key(
                      item
                  ),

                  canonical_team(
                      home_name
                  ),

                  canonical_team(
                      away_name
                  )

              )


              old = logical_history.get(
                  key
              )


              if old is None:

                  logical_history[
                      key
                  ] = item

              else:

                  old_source = (
                      old.get(
                          "source"
                      )
                      or
                      ""
                  )

                  new_source = (
                      item.get(
                          "source"
                      )
                      or
                      ""
                  )

                  if (
                      new_source
                      ==
                      "api-football"
                      and
                      old_source
                      !=
                      "api-football"
                  ):

                      logical_history[
                          key
                      ] = item


          history_unique = list(
              logical_history.values()
          )


          # ============================================================
          # TEAM HISTORY
          # ============================================================

          team_history = defaultdict(
              list
          )


          for item in history_unique:

              home_name = history_home(
                  item
              )

              away_name = history_away(
                  item
              )

              home_goals, away_goals = (
                  history_goals(
                      item
                  )
              )


              if (
                  not home_name
                  or
                  not away_name
                  or
                  home_goals is None
                  or
                  away_goals is None
              ):
                  continue


              date_key = history_date_key(
                  item
              )


              team_history[
                  canonical_team(
                      home_name
                  )
              ].append({

                  "date":
                      date_key,

                  "gf":
                      int(home_goals),

                  "ga":
                      int(away_goals),

                  "home":
                      True

              })


              team_history[
                  canonical_team(
                      away_name
                  )
              ].append({

                  "date":
                      date_key,

                  "gf":
                      int(away_goals),

                  "ga":
                      int(home_goals),

                  "home":
                      False

              })


          for key in team_history:

              team_history[
                  key
              ].sort(
                  key=lambda x:
                      x["date"]
              )


          # ============================================================
          # FORM
          # ============================================================

          def calculate_form(
              team_name,
              target_date
          ):

              key = canonical_team(
                  team_name
              )

              games = [
                  game
                  for game in team_history.get(
                      key,
                      []
                  )
                  if game["date"]
                  <
                  target_date
              ]


              games = games[-5:]


              wins = 0
              draws = 0
              losses = 0
              gf = 0
              ga = 0
              points = 0


              recent = []


              for game in games:

                  gf += game["gf"]
                  ga += game["ga"]


                  if game["gf"] > game["ga"]:

                      wins += 1
                      points += 3
                      result = "V"

                  elif game["gf"] == game["ga"]:

                      draws += 1
                      points += 1
                      result = "N"

                  else:

                      losses += 1
                      result = "P"


                  recent.append({

                      "date":
                          game["date"],

                      "gf":
                          game["gf"],

                      "ga":
                          game["ga"],

                      "result":
                          result

                  })


              played = len(
                  games
              )


              return {

                  "played":
                      played,

                  "wins":
                      wins,

                  "draws":
                      draws,

                  "losses":
                      losses,

                  "gf":
                      gf,

                  "ga":
                      ga,

                  "points":
                      points,

                  "ppg":
                      round(
                          points / played,
                          2
                      )
                      if played
                      else 0,

                  "avgGF":
                      round(
                          gf / played,
                          2
                      )
                      if played
                      else 0,

                  "avgGA":
                      round(
                          ga / played,
                          2
                      )
                      if played
                      else 0,

                  "recent":
                      recent
              }


          # ============================================================
          # CANDIDATI
          # ============================================================

          future_statuses = {
              "NS",
              "TBD"
          }


          candidates = []


          for item in api_fixtures:

              fixture = (
                  item.get(
                      "fixture"
                  )
                  or
                  {}
              )

              status = (
                  fixture.get(
                      "status"
                  )
                  or
                  {}
              )

              if (
                  status.get(
                      "short"
                  )
                  not in future_statuses
              ):
                  continue


              league = (
                  item.get(
                      "league"
                  )
                  or
                  {}
              )

              country = (
                  league.get(
                      "country"
                  )
                  or
                  ""
              )

              league_name = (
                  league.get(
                      "name"
                  )
                  or
                  ""
              )


              priority = league_priority(
                  country,
                  league_name
              )


              if priority <= 0:
                  continue


              teams = (
                  item.get(
                      "teams"
                  )
                  or
                  {}
              )

              home = (
                  teams.get(
                      "home"
                  )
                  or
                  {}
              )

              away = (
                  teams.get(
                      "away"
                  )
                  or
                  {}
              )


              home_name = (
                  home.get(
                      "name"
                  )
              )

              away_name = (
                  away.get(
                      "name"
                  )
              )


              if (
                  not home_name
                  or
                  not away_name
              ):
                  continue


              fixture_date = (
                  fixture.get(
                      "date"
                  )
                  or
                  ""
              )


              target_date = (
                  fixture_date[:10]
              )


              home_form = calculate_form(
                  home_name,
                  target_date
              )

              away_form = calculate_form(
                  away_name,
                  target_date
              )


              history_score = (
                  home_form[
                      "played"
                  ]
                  +
                  away_form[
                      "played"
                  ]
              )


              candidates.append({

                  "fixtureId":
                      fixture.get(
                          "id"
                      ),

                  "date":
                      fixture_date,

                  "timestamp":
                      fixture.get(
                          "timestamp",
                          0
                      ),

                  "country":
                      country,

                  "league":
                      league_name,

                  "leagueId":
                      league.get(
                          "id"
                      ),

                  "priority":
                      priority,

                  "home": {

                      "id":
                          home.get(
                              "id"
                          ),

                      "name":
                          home_name,

                      "form":
                          home_form

                  },

                  "away": {

                      "id":
                          away.get(
                              "id"
                          ),

                      "name":
                          away_name,

                      "form":
                          away_form

                  },

                  "historyScore":
                      history_score,

                  "dataCoverage":
                      round(
                          history_score / 10,
                          2
                      ),

                  "prediction": {
                      "available":
                          False
                  }

              })


          # ============================================================
          # SORT CANDIDATI
          # ============================================================

          def candidate_rank(
              match
          ):

              home_played = (
                  match["home"]
                  ["form"]
                  ["played"]
              )

              away_played = (
                  match["away"]
                  ["form"]
                  ["played"]
              )


              complete = (
                  1
                  if
                  home_played >= 5
                  and
                  away_played >= 5
                  else
                  0
              )


              both = (
                  1
                  if
                  home_played > 0
                  and
                  away_played > 0
                  else
                  0
              )


              return (

                  -complete,
                  -both,
                  -match[
                      "historyScore"
                  ],
                  -match[
                      "priority"
                  ],
                  match[
                      "timestamp"
                  ]

              )


          candidates.sort(
              key=candidate_rank
          )


          # ============================================================
          # PREDICTION ENGINE
          # ============================================================

          def adjusted_confidence(
              raw,
              sample_size
          ):

              factor = min(
                  sample_size / 10,
                  1
              )

              adjusted = (
                  0.50
                  +
                  (
                      raw
                      -
                      0.50
                  )
                  *
                  factor
              )

              return adjusted


          def build_prediction(
              match
          ):

              home_games = (
                  match["home"]
                  ["form"]
                  ["recent"]
              )

              away_games = (
                  match["away"]
                  ["form"]
                  ["recent"]
              )


              if (
                  not home_games
                  or
                  not away_games
              ):

                  return {
                      "available":
                          False,

                      "reason":
                          "Storico insufficiente"
                  }


              sample = (
                  len(home_games)
                  +
                  len(away_games)
              )


              markets = []


              def add_market(
                  market,
                  prediction,
                  raw
              ):

                  confidence = (
                      adjusted_confidence(
                          raw,
                          sample
                      )
                  )

                  markets.append({

                      "market":
                          market,

                      "prediction":
                          prediction,

                      "confidence":
                          confidence

                  })


              # --------------------------------------------------------
              # 1X2 / DOUBLE CHANCE
              # --------------------------------------------------------

              home_positive = sum(

                  1
                  for game in home_games
                  if game["result"]
                  in ("V", "N")

              )


              away_positive = sum(

                  1
                  for game in away_games
                  if game["result"]
                  in ("V", "N")

              )


              home_win = sum(

                  1
                  for game in home_games
                  if game["result"]
                  ==
                  "V"

              )


              away_win = sum(

                  1
                  for game in away_games
                  if game["result"]
                  ==
                  "V"

              )


              home_draw = sum(

                  1
                  for game in home_games
                  if game["result"]
                  ==
                  "N"

              )


              away_draw = sum(

                  1
                  for game in away_games
                  if game["result"]
                  ==
                  "N"

              )


              home_loss = sum(

                  1
                  for game in home_games
                  if game["result"]
                  ==
                  "P"

              )


              away_loss = sum(

                  1
                  for game in away_games
                  if game["result"]
                  ==
                  "P"

              )


              raw_home = (
                  (
                      home_win
                      +
                      away_loss
                  )
                  /
                  sample
              )


              raw_draw = (
                  (
                      home_draw
                      +
                      away_draw
                  )
                  /
                  sample
              )


              raw_away = (
                  (
                      away_win
                      +
                      home_loss
                  )
                  /
                  sample
              )


              add_market(
                  "Esito Finale",
                  "1",
                  raw_home
              )

              add_market(
                  "Esito Finale",
                  "X",
                  raw_draw
              )

              add_market(
                  "Esito Finale",
                  "2",
                  raw_away
              )


              raw_1x = (
                  (
                      home_positive
                      +
                      (
                          len(away_games)
                          -
                          away_win
                      )
                  )
                  /
                  sample
              )


              raw_x2 = (
                  (
                      away_positive
                      +
                      (
                          len(home_games)
                          -
                          home_win
                      )
                  )
                  /
                  sample
              )


              raw_12 = (
                  (
                      (
                          len(home_games)
                          -
                          home_draw
                      )
                      +
                      (
                          len(away_games)
                          -
                          away_draw
                      )
                  )
                  /
                  sample
              )


              add_market(
                  "Doppia Chance",
                  "1X",
                  raw_1x
              )

              add_market(
                  "Doppia Chance",
                  "X2",
                  raw_x2
              )

              add_market(
                  "Doppia Chance",
                  "12",
                  raw_12
              )


              # --------------------------------------------------------
              # GOAL / NO GOAL
              # --------------------------------------------------------

              all_games = (
                  home_games
                  +
                  away_games
              )


              btts = sum(

                  1
                  for game in all_games
                  if game["gf"] > 0
                  and game["ga"] > 0

              )


              raw_goal = (
                  btts
                  /
                  sample
              )


              add_market(
                  "Goal / No Goal",
                  "GOAL",
                  raw_goal
              )

              add_market(
                  "Goal / No Goal",
                  "NO GOAL",
                  1 - raw_goal
              )


              # --------------------------------------------------------
              # OVER UNDER
              # --------------------------------------------------------

              for line in [
                  1.5,
                  2.5,
                  3.5
              ]:

                  over_count = sum(

                      1
                      for game in all_games
                      if (
                          game["gf"]
                          +
                          game["ga"]
                      )
                      >
                      line

                  )


                  raw_over = (
                      over_count
                      /
                      sample
                  )


                  add_market(
                      "Totale Gol",
                      f"OVER {line}",
                      raw_over
                  )


                  add_market(
                      "Totale Gol",
                      f"UNDER {line}",
                      1 - raw_over
                  )


              # --------------------------------------------------------
              # PARI / DISPARI
              # --------------------------------------------------------

              even_count = sum(

                  1
                  for game in all_games
                  if (
                      game["gf"]
                      +
                      game["ga"]
                  )
                  %
                  2
                  ==
                  0

              )


              raw_even = (
                  even_count
                  /
                  sample
              )


              add_market(
                  "Pari / Dispari",
                  "PARI",
                  raw_even
              )

              add_market(
                  "Pari / Dispari",
                  "DISPARI",
                  1 - raw_even
              )


              # --------------------------------------------------------
              # SOMMA GOL
              # --------------------------------------------------------

              ranges = {
                  "0-1": 0,
                  "2-3": 0,
                  "4-5": 0,
                  "6+": 0
              }


              for game in all_games:

                  total = (
                      game["gf"]
                      +
                      game["ga"]
                  )


                  if total <= 1:

                      ranges[
                          "0-1"
                      ] += 1

                  elif total <= 3:

                      ranges[
                          "2-3"
                      ] += 1

                  elif total <= 5:

                      ranges[
                          "4-5"
                      ] += 1

                  else:

                      ranges[
                          "6+"
                      ] += 1


              for label, count in ranges.items():

                  add_market(
                      "Somma Gol",
                      label,
                      count / sample
                  )


              # --------------------------------------------------------
              # MIGLIORE MERCATO
              # --------------------------------------------------------

              markets.sort(
                  key=lambda item:
                      item[
                          "confidence"
                      ],
                  reverse=True
              )


              best = markets[0]


              confidence_percent = round(
                  best[
                      "confidence"
                  ]
                  *
                  100,
                  1
              )


              if confidence_percent < 55:

                  return {

                      "available":
                          False,

                      "reason":
                          "Indice insufficiente"

                  }


              return {

                  "available":
                      True,

                  "market":
                      best[
                          "market"
                      ],

                  "prediction":
                      best[
                          "prediction"
                      ],

                  "confidence":
                      confidence_percent,

                  "sample":
                      sample

              }


          # ============================================================
          # QUOTE
          # ============================================================

          def odds_clean(
              value
          ):

              return str(
                  value or ""
              ).strip().lower()


          def odds_market_matches(
              pick,
              market
          ):

              p = odds_clean(
                  pick
              )

              m = odds_clean(
                  market
              )


              if (
                  "first half" in m
                  or
                  "second half" in m
                  or
                  "1st half" in m
                  or
                  "2nd half" in m
              ):

                  return False


              if p in (
                  "1",
                  "x",
                  "2"
              ):

                  return m in (
                      "match winner",
                      "1x2"
                  )


              if p in (
                  "1x",
                  "x2",
                  "12"
              ):

                  return (
                      "double chance"
                      in m
                  )


              if (
                  p.startswith(
                      "over "
                  )
                  or
                  p.startswith(
                      "under "
                  )
              ):

                  return (
                      "over/under"
                      in m
                      or
                      "total goals"
                      in m
                  )


              if p in (
                  "goal",
                  "no goal",
                  "gg",
                  "ng"
              ):

                  return (
                      "both teams score"
                      in m
                      or
                      "both teams to score"
                      in m
                  )


              if p in (
                  "pari",
                  "dispari",
                  "odd",
                  "even"
              ):

                  return (
                      "odd/even"
                      in m
                      or
                      "odd even"
                      in m
                  )


              return False


          def odds_selection_matches(
              pick,
              value
          ):

              p = odds_clean(
                  pick
              )

              v = odds_clean(
                  value
              )


              if p == "1":

                  return v in (
                      "home",
                      "1"
                  )


              if p == "x":

                  return v in (
                      "draw",
                      "x"
                  )


              if p == "2":

                  return v in (
                      "away",
                      "2"
                  )


              compact = v.replace(
                  " ",
                  ""
              )


              if p == "1x":

                  return compact in (
                      "1x",
                      "home/draw",
                      "homedraw",
                      "homeordraw"
                  )


              if p == "x2":

                  return compact in (
                      "x2",
                      "draw/away",
                      "drawaway",
                      "draworaway"
                  )


              if p == "12":

                  return compact in (
                      "12",
                      "home/away",
                      "homeaway",
                      "homeoraway"
                  )


              if (
                  p.startswith(
                      "over "
                  )
                  or
                  p.startswith(
                      "under "
                  )
              ):

                  return p == v


              if p in (
                  "goal",
                  "gg"
              ):

                  return v in (
                      "yes",
                      "goal",
                      "gg"
                  )


              if p in (
                  "no goal",
                  "ng"
              ):

                  return v in (
                      "no",
                      "no goal",
                      "ng"
                  )


              if p in (
                  "pari",
                  "even"
              ):

                  return v in (
                      "even",
                      "pari"
                  )


              if p in (
                  "dispari",
                  "odd"
              ):

                  return v in (
                      "odd",
                      "dispari"
                  )


              return False


          def find_quote(
              fixture_id,
              prediction
          ):

              try:

                  data = api_get(
                      "odds",
                      {
                          "fixture":
                              fixture_id
                      }
                  )

              except Exception as error:

                  print(
                      "Errore quote fixture",
                      fixture_id,
                      ":",
                      error
                  )

                  return None


              response = (
                  data.get(
                      "response"
                  )
                  or
                  []
              )


              pick = (
                  prediction.get(
                      "prediction"
                  )
              )


              found = []


              for block in response:

                  for bookmaker in (
                      block.get(
                          "bookmakers"
                      )
                      or
                      []
                  ):

                      bookmaker_name = (
                          bookmaker.get(
                              "name"
                          )
                          or
                          "Bookmaker"
                      )


                      for bet in (
                          bookmaker.get(
                              "bets"
                          )
                          or
                          []
                      ):

                          market_name = (
                              bet.get(
                                  "name"
                              )
                              or
                              ""
                          )


                          if not odds_market_matches(
                              pick,
                              market_name
                          ):
                              continue


                          for value in (
                              bet.get(
                                  "values"
                              )
                              or
                              []
                          ):

                              selection = (
                                  value.get(
                                      "value"
                                  )
                              )

                              odd = (
                                  value.get(
                                      "odd"
                                  )
                              )


                              if not odds_selection_matches(
                                  pick,
                                  selection
                              ):
                                  continue


                              try:

                                  odd_number = float(
                                      odd
                                  )

                              except:

                                  continue


                              found.append({

                                  "odd":
                                      odd_number,

                                  "bookmaker":
                                      bookmaker_name,

                                  "apiMarket":
                                      market_name,

                                  "apiSelection":
                                      selection

                              })


              if not found:
                  return None


              return max(
                  found,
                  key=lambda item:
                      item[
                          "odd"
                      ]
              )


          # ============================================================
          # ANALIZZA
          # ============================================================

          shortlist = (
              candidates[:50]
          )


          analysis = []


          for match in shortlist[:30]:

              prediction = build_prediction(
                  match
              )


              match[
                  "prediction"
              ] = prediction


              if (
                  prediction.get(
                      "available"
                  )
                  is True
              ):

                  quote = find_quote(
                      match[
                          "fixtureId"
                      ],
                      prediction
                  )


                  if quote:

                      prediction[
                          "oddAvailable"
                      ] = True

                      prediction[
                          "odd"
                      ] = quote[
                          "odd"
                      ]

                      prediction[
                          "bookmaker"
                      ] = quote[
                          "bookmaker"
                      ]

                      prediction[
                          "apiMarket"
                      ] = quote[
                          "apiMarket"
                      ]

                      prediction[
                          "apiSelection"
                      ] = quote[
                          "apiSelection"
                      ]

                  else:

                      prediction[
                          "oddAvailable"
                      ] = False

                      prediction[
                          "odd"
                      ] = None

              else:

                  prediction[
                      "oddAvailable"
                  ] = False

                  prediction[
                      "odd"
                  ] = None


              analysis.append(
                  match
              )


          # ============================================================
          # ORDINA PRONOSTICI UTILIZZABILI PRIMA
          # ============================================================

          def analysis_rank(
              match
          ):

              prediction = (
                  match.get(
                      "prediction"
                  )
                  or
                  {}
              )


              prediction_available = (
                  1
                  if prediction.get(
                      "available"
                  )
                  else
                  0
              )


              odd_available = (
                  1
                  if prediction.get(
                      "oddAvailable"
                  )
                  else
                  0
              )


              confidence = float(
                  prediction.get(
                      "confidence"
                  )
                  or
                  0
              )


              return (

                  -odd_available,
                  -prediction_available,
                  -confidence,
                  -match[
                      "historyScore"
                  ],
                  -match[
                      "priority"
                  ],
                  match[
                      "timestamp"
                  ]

              )


          analysis.sort(
              key=analysis_rank
          )


          # ============================================================
          # SALVA FILE
          # ============================================================

          history_output = {

              "updatedAt":
