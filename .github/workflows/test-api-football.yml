          def attach_best_odds(fixture_id, candidates):
              """Una quota rappresentativa, non il massimo isolato.
              Mediana delle quote di bookmaker distinti sullo stesso mercato
              e sulla stessa selezione. La quota pubblicata viene davvero
              offerta da un bookmaker, non e' un prezzo costruito.
              """
              blocks = get_fixture_odds(fixture_id)
              for candidate in candidates:
                  offered = {}
                  for block in blocks:
                      for bookmaker in block.get("bookmakers") or []:
                          bookmaker_name = str(bookmaker.get("name") or "Bookmaker")
                          for bet in bookmaker.get("bets") or []:
                              market_name = bet.get("name") or ""
                              for value in bet.get("values") or []:
                                  api_value = value.get("value")
                                  if not selection_matches(candidate, market_name, api_value):
                                      continue
                                  odd = safe_float(value.get("odd"))
                                  if odd is None or not math.isfinite(odd) or odd <= 1.00 or odd > 1000:
                                      continue
                                  # Una sola offerta per bookmaker e mercato.
                                  # Non trasformare differenze di bookmaker in
                                  # una ricerca sistematica del massimo prezzo.
                                  key = (bookmaker_name.lower(), normalize(market_name))
                                  datum = {
                                      "odd": odd,
                                      "bookmaker": bookmaker_name,
                                      "apiMarket": market_name,
                                      "apiSelection": str(api_value)
                                  }
                                  if key not in offered or odd < offered[key]["odd"]:
                                      offered[key] = datum
                  prices = sorted(offered.values(), key=lambda row: row["odd"])
                  if not prices:
                      continue
                  # Scarta offerte fortemente divergenti se esiste un consenso.
                  middle = prices[len(prices)//2]["odd"] if len(prices) % 2 else (
                      prices[len(prices)//2-1]["odd"] + prices[len(prices)//2]["odd"]
                  ) / 2
                  inliers = [row for row in prices if 0.80 * middle <= row["odd"] <= 1.20 * middle]
                  if not inliers:
                      continue
                  # Per un numero pari di fonti preferisci l'osservazione
                  # inferiore: scegli una quota davvero quotata, conservativa.
                  chosen = inliers[(len(inliers)-1)//2]
                  candidate["oddAvailable"] = True
                  candidate["odd"] = round(chosen["odd"], 3)
                  candidate["bookmaker"] = chosen["bookmaker"]
                  candidate["apiMarket"] = chosen["apiMarket"]
                  candidate["apiSelection"] = chosen["apiSelection"]
                  candidate["oddsSources"] = len(inliers)
                  candidate["oddsObserved"] = len(prices)
                  candidate["oddsQuality"] = "multi_source" if len(inliers) >= 2 else "single_source"
                  candidate["value"] = round(candidate["modelProbability"] * chosen["odd"], 3)
              return candidates


          # ==========================================================
          # CONSENSO 1X2: quote di almeno tre bookmaker indipendenti.
          # Rimuoviamo l'overround per una distribuzione 1/X/2 coerente.
          # Non equivale alla probabilita' vera; e' un confronto di mercato.
          # Se la copertura e' bassa o i book non concordano, non autorizza
          # pronostici sui segni 1X2/doppia chance.
          # ==========================================================
          def market_1x2_consensus(fixture_id):
              by_bookmaker = {}
              for block in odds_cache.get(fixture_id, []):
                  for book in block.get("bookmakers") or []:
                      name = str(book.get("name") or "").strip().lower()
                      if not name:
                          continue
                      for bet in book.get("bets") or []:
                          if normalize(bet.get("name")) not in {"match winner", "1x2"}:
                              continue
                          trio = {}
                          for entry in bet.get("values") or []:
                              item = normalize(entry.get("value"))
                              side = {"home":"1", "1":"1", "draw":"X", "x":"X", "away":"2", "2":"2"}.get(item)
                              odd = safe_float(entry.get("odd"))
                              if side and odd is not None and math.isfinite(odd) and 1.02 <= odd <= 100:
                                  trio[side] = odd
                          if len(trio) != 3:
                              continue
                          implied = {k: 1.0 / v for k,v in trio.items()}
                          margin_total = sum(implied.values())
                          # Ignora triple chiaramente incoerenti o troppo vecchie.
                          if not 1.005 <= margin_total <= 1.25:
                              continue
                          fair = {k: implied[k] / margin_total for k in ("1","X","2")}
                          by_bookmaker[name] = fair
              points = list(by_bookmaker.values())
              n = len(points)
              if n < 3:
                  return {"available": False, "sourceCount": n,
                          "status": "meno_di_tre_bookmaker"}
              def median(nums):
                  nums = sorted(nums)
                  k = len(nums) // 2
                  return nums[k] if len(nums) % 2 else (nums[k-1] + nums[k]) / 2
              raw = {k: median([row[k] for row in points]) for k in ("1","X","2")}
              dispersion = max(max(row[k] for row in points) - min(row[k] for row in points)
                               for k in ("1","X","2"))
              if dispersion > 0.14:
                  return {"available": False, "sourceCount": n,
                          "status": "quote_discordanti",
                          "dispersion": round(dispersion, 4)}
              total = sum(raw.values())
              fair = {k: round(v / total, 5) for k,v in raw.items()}
              return {"available": True, "sourceCount": n, "status": "verificato",
                      "probabilities": fair, "dispersion": round(dispersion, 4),
                      "method": "mediana_probabilita_quote_1x2_senza_margine"}

          # La forza degli avversari e' una PROXY: punti medi recenti,
          # NON una classifica ufficiale. Non sono disponibili dati societari.
          def opponent_strength(games, before_date):
              values = []
              for game in games:
                  opponent = str(game.get("opponent") or "").strip()
                  if not opponent:
                      continue
                  past = team_games(opponent, before_date)
                  relevant = [g for g in past if 0 < (datetime.fromisoformat(before_date).date()
                      - datetime.fromisoformat(g["date"]).date()).days <= 120]
                  if len(relevant) < 5:
                      continue
                  sample = team_stats(relevant)
                  values.append(sample["ppg"])
              return {
                  "coverage": len(values),
                  "gamesExamined": len(games),
                  "opponentsAvgPPG": round(sum(values) / len(values), 3) if len(values) >= 3 else None,
                  "status": "stimabile" if len(values) >= 3 else "non_verificabile"
              }

          def consensus_for_market(consensus, market, selection):
              if not consensus.get("available"):
                  return None
              p = consensus["probabilities"]
              if market == "1X2":
                  return p.get(selection)
              if market == "Doppia Chance":
                  return {"1X":p["1"]+p["X"], "X2":p["X"]+p["2"],
                          "12":p["1"]+p["2"]}.get(selection)
              return None

          def consecutive_wins(games):
              streak = 0
              for game in reversed(games):
                  if game["gf"] > game["ga"]:
                      streak += 1
                  else:
                      break
              return streak


          def draw_market_odd(fixture_id):
              values = []
              for block in odds_cache.get(fixture_id, []):
                  for bookmaker in block.get("bookmakers") or []:
                      for bet in bookmaker.get("bets") or []:
                          m = normalize(bet.get("name"))
                          if m not in {"match winner", "1x2", "full time result",
                                       "fulltime result", "match result"}:
                              continue
                          for item in bet.get("values") or []:
                              if normalize(item.get("value")) not in {"draw", "x"}:
                                  continue
                              odd = safe_float(item.get("odd"))
                              if odd is not None and 1.01 < odd < 15:
                                  values.append(odd)
              if not values:
                  return None
              values.sort()
              return round(values[len(values)//2], 3)


