              "queens park rangers fc": "qpr",
              "derby county": "derby",
              "derby county fc": "derby",
              "cardiff city": "cardiff",
              "cardiff city fc": "cardiff",
              "bristol c": "bristol city",
              "bristol city fc": "bristol city",
              "blackburn rovers": "blackburn",
              "blackburn rovers fc": "blackburn",
