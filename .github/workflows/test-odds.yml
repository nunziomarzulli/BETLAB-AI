name: BETLAB Test Risultati Esatti

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-correct-score:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analizza quote risultato esatto
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python3 <<'PY'

          import json
          import os
          import urllib.request
          import urllib.parse


          API_KEY = os.environ["API_FOOTBALL_KEY"]


          # ==========================================================
          # API
          # ==========================================================

          def api_get(endpoint, params):

              query = urllib.parse.urlencode(params)

              url = (
                  "https://v3.football.api-sports.io/"
                  + endpoint
                  + "?"
                  + query
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=40
              ) as response:

                  data = json.loads(
                      response.read().decode("utf-8")
                  )

              if data.get("errors"):
                  raise RuntimeError(
                      str(data["errors"])
                  )

              return data


          # ==========================================================
          # CARICA BETLAB
          # ==========================================================

          with open(
              "data/betlab-analysis.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          matches = (
              data.get("analysis")
              or
              data.get("matches")
              or
              []
          )


          matches = [
              match
              for match in matches
              if (
                  match.get(
                      "prediction",
                      {}
                  ).get("available")
                  is True
              )
          ]


          print("")
          print("==========================================")
          print("BETLAB - TEST RISULTATI ESATTI")
          print("==========================================")
          print("")
          print(
              "Partite con pronostico:",
              len(matches)
          )
          print("")


          # ==========================================================
          # OGNI PARTITA
          # ==========================================================

          for index, match in enumerate(
              matches,
              start=1
          ):

              fixture_id = match.get("fixtureId")

              home = (
                  match.get("home", {})
                  .get("name", "Casa")
              )

              away = (
                  match.get("away", {})
                  .get("name", "Trasferta")
              )


              print("")
              print("==========================================")
              print(
                  f"{index}. {home} - {away}"
              )
              print(
                  "Fixture:",
                  fixture_id
              )
              print("==========================================")


              # ------------------------------------------------------
              # LEGGI TUTTE LE PAGINE ODDS
              # ------------------------------------------------------

              page = 1

              all_blocks = []


              while True:

                  odds_data = api_get(
                      "odds",
                      {
                          "fixture": fixture_id,
                          "page": page
                      }
                  )


                  blocks = (
                      odds_data.get("response")
                      or
                      []
                  )


                  all_blocks.extend(blocks)


                  paging = (
                      odds_data.get("paging")
                      or
                      {}
                  )


                  current_page = int(
                      paging.get("current")
                      or
                      page
                  )

                  total_pages = int(
                      paging.get("total")
                      or
                      1
                  )


                  print(
                      f"Pagina quote {current_page}/{total_pages}"
                  )


                  if current_page >= total_pages:
                      break


                  page += 1


              # ------------------------------------------------------
              # CERCA CORRECT SCORE
              # ------------------------------------------------------

              correct_scores = []


              for block in all_blocks:

                  bookmakers = (
                      block.get("bookmakers")
                      or
                      []
                  )


                  for bookmaker in bookmakers:

                      bookmaker_name = (
                          bookmaker.get("name")
                          or
                          "Bookmaker"
                      )


                      bets = (
                          bookmaker.get("bets")
                          or
                          []
                      )


                      for bet in bets:

                          market_name = (
                              bet.get("name")
                              or
                              ""
                          )


                          market_lower = (
                              market_name.lower()
                          )


                          if not (
                              "correct score"
                              in market_lower

                              or

                              "exact score"
                              in market_lower
                          ):
                              continue


                          values = (
                              bet.get("values")
                              or
                              []
                          )


                          for value in values:

                              selection = str(
                                  value.get("value")
                                  or
                                  ""
                              ).strip()


                              odd_raw = (
                                  value.get("odd")
                              )


                              try:

                                  odd = float(
                                      odd_raw
                                  )

                              except:

                                  continue


                              correct_scores.append({

                                  "score":
                                      selection,

                                  "odd":
                                      odd,

                                  "bookmaker":
                                      bookmaker_name,

                                  "market":
                                      market_name

                              })


              # ------------------------------------------------------
              # RISULTATI
              # ------------------------------------------------------

              if not correct_scores:

                  print("")
                  print(
                      "NESSUN MERCATO RISULTATO ESATTO TROVATO"
                  )

                  continue


              # dedupe: teniamo quota migliore per risultato

              best_by_score = {}


              for item in correct_scores:

                  score = item["score"]

                  old = best_by_score.get(score)


                  if (
                      old is None
                      or
                      item["odd"] > old["odd"]
                  ):

                      best_by_score[score] = item


              results = list(
                  best_by_score.values()
              )


              results.sort(
                  key=lambda item:
                      item["odd"]
              )


              print("")
              print(
                  "RISULTATI ESATTI DISPONIBILI:",
                  len(results)
              )

              print("")


              for item in results:

                  print(
                      f'{item["score"]:>8}'
                      f'  @ {item["odd"]:.2f}'
                      f'  | {item["bookmaker"]}'
                      f'  | {item["market"]}'
                  )


              # ------------------------------------------------------
              # QUOTE VICINE A 20
              # ------------------------------------------------------

              target = 20.0


              nearest = sorted(
                  results,
                  key=lambda item:
                      abs(
                          item["odd"]
                          -
                          target
                      )
              )[:5]


              print("")
              print("------------------------------------------")
              print("QUOTE PIU VICINE A 20.00")
              print("------------------------------------------")


              for item in nearest:

                  print(
                      f'{item["score"]}'
                      f' @ {item["odd"]:.2f}'
                      f' | {item["bookmaker"]}'
                  )


          print("")
          print("==========================================")
          print("FINE TEST")
          print("==========================================")

          PY
