name: Aggiorna partite BETLAB

on:
  workflow_dispatch:

  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Scarica partite disponibili
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          mkdir -p data

          curl --fail --silent --show-error \
            -H "X-Auth-Token: $FOOTBALL_DATA_TOKEN" \
            "https://api.football-data.org/v4/matches" \
            -o data/matches.json

          echo "Partite ricevute:"

          python3 - <<'PY'
          import json

          with open("data/matches.json", encoding="utf-8") as f:
              data = json.load(f)

          matches = data.get("matches", [])

          print("Totale partite:", len(matches))

          competitions = {}

          for match in matches:
              competition = match.get("competition", {})
              name = competition.get("name", "Sconosciuto")
              competitions[name] = competitions.get(name, 0) + 1

          print("\nCompetizioni:")
          for name, count in sorted(competitions.items()):
              print(f"- {name}: {count}")
          PY

      - name: Salva aggiornamento
        run: |
          git config user.name "BETLAB AI Bot"
          git config user.email "actions@github.com"

          git add data/matches.json

          if git diff --cached --quiet; then
            echo "Nessun aggiornamento."
          else
            git commit -m "Aggiorna partite BETLAB"
            git push
          fi
