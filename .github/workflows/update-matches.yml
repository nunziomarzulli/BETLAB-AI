name: Aggiorna partite BETLAB

on:
  workflow_dispatch:

  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Scarica campionati BETLAB
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          mkdir -p data

          curl --fail --silent --show-error \
            -H "X-Auth-Token: $FOOTBALL_DATA_TOKEN" \
            "https://api.football-data.org/v4/matches?competitions=CL,PPL,PL,DED,BL1,FL1,SA,PD,ELC,BSA,WC,EC&dateFrom=2026-10-02&dateTo=2026-10-12" \
            -o data/matches.json

          echo "================================="
          echo "BETLAB - DATI RICEVUTI"
          echo "================================="

          python3 - <<'PY'
          import json

          with open("data/matches.json", encoding="utf-8") as f:
              data = json.load(f)

          matches = data.get("matches", [])

          print("Totale partite:", len(matches))
          print()

          competitions = {}

          for match in matches:
              competition = match.get("competition", {})
              area = match.get("area", {})

              name = competition.get("name", "Sconosciuto")
              country = area.get("name", "Internazionale")

              key = f"{country} | {name}"
              competitions[key] = competitions.get(key, 0) + 1

          print("Competizioni trovate:")

          for name, count in sorted(competitions.items()):
              print(f"- {name}: {count}")

          print()
          print("Periodo analizzato: 02/10/2026 - 12/10/2026")
          PY

      - name: Salva aggiornamento
        run: |
          git config user.name "BETLAB AI Bot"
          git config user.email "actions@github.com"

          git add data/matches.json

          if git diff --cached --quiet; then
            echo "Nessun aggiornamento."
          else
            git commit -m "Aggiorna calendario multi-campionato BETLAB"
            git push
          fi
