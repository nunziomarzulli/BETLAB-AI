<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BETLAB AI</title>

<style>
:root{
  --green:#16a05d;
  --green-dark:#087742;
  --green-light:#eaf7f0;
  --text:#171717;
  --muted:#777;
  --border:#e2e2e2;
  --background:#f5f6f7;
  --white:#ffffff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--background);
  color:var(--text);
}

header{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.logo span{
  color:var(--green);
}

.engine{
  font-size:11px;
  color:#888;
  text-transform:uppercase;
}

main{
  max-width:1100px;
  margin:18px auto 50px;
  padding:0 15px;
}

/* CALENDARIO */

.calendar{
  background:#fff;
  border:1px solid var(--border);
  border-radius:9px;
  overflow:hidden;
  margin-bottom:12px;
}

.days{
  display:flex;
  overflow-x:auto;
  scrollbar-width:thin;
  border-bottom:1px solid var(--border);
}

.day{
  flex:0 0 105px;
  padding:10px 5px 9px;
  text-align:center;
  cursor:pointer;
  border-right:1px solid var(--border);
  background:#fff;
  color:#777;
  font-size:10px;
}

.day:hover{
  background:#fafafa;
}

.day .label{
  font-weight:600;
}

.day .date{
  display:block;
  margin-top:3px;
  font-size:13px;
  font-weight:700;
  color:#222;
}

.day .games{
  display:block;
  margin-top:3px;
  font-size:9px;
  color:#999;
}

.day.active{
  background:var(--green-light);
  color:var(--green-dark);
  border-bottom:3px solid var(--green);
}

.day.active .date{
  color:var(--green-dark);
}

/* SEARCH */

.tools{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px;
}

.search{
  position:relative;
  flex:1;
}

.search input{
  width:100%;
  height:38px;
  border:1px solid #ddd;
  border-radius:6px;
  padding:0 12px 0 36px;
  outline:none;
  font-size:13px;
}

.search input:focus{
  border-color:#aaa;
}

.search-icon{
  position:absolute;
  left:12px;
  top:9px;
  color:#999;
}

.total{
  min-width:75px;
  text-align:right;
  color:#777;
  font-size:11px;
}

/* DATA SELEZIONATA */

.day-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:13px 2px 9px;
  font-size:12px;
}

.day-title strong{
  font-size:13px;
}

.version{
  color:#999;
  font-size:10px;
}

/* NAZIONE */

.country{
  margin-bottom:15px;
}

.country-title{
  padding:7px 9px;
  font-size:11px;
  font-weight:700;
  color:#666;
  text-transform:uppercase;
}

/* CAMPIONATO */

.competition{
  background:#fff;
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  margin-bottom:8px;
}

.competition-header{
  height:42px;
  padding:0 11px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.competition-left{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  font-weight:700;
}

.competition-logo{
  width:21px;
  height:21px;
  object-fit:contain;
}

.arrow{
  color:#999;
  font-size:10px;
}

/* PARTITA */

.match{
  min-height:55px;
  display:grid;
  grid-template-columns:60px 1fr 85px;
  align-items:center;
  padding:5px 10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.match:last-child{
  border-bottom:0;
}

.match:hover{
  background:#fafafa;
}

.time{
  color:#666;
  font-size:11px;
  font-weight:600;
}

.teams{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.team{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:500;
}

.crest{
  width:18px;
  height:18px;
  object-fit:contain;
}

.analysis{
  justify-self:end;
  border:1px solid #d6d6d6;
  border-radius:5px;
  padding:6px 8px;
  background:#fff;
  color:#555;
  font-size:10px;
  font-weight:700;
}

.match:hover .analysis{
  border-color:var(--green);
  color:var(--green-dark);
}

/* EMPTY */

.empty,
.loading,
.error{
  background:#fff;
  border:1px solid var(--border);
  border-radius:8px;
  padding:45px 20px;
  text-align:center;
  color:#777;
  font-size:13px;
}

.empty strong{
  display:block;
  color:#333;
  font-size:15px;
  margin-bottom:7px;
}

.error{
  color:#a33;
  border-color:#e5bbbb;
}

/* FOOTER */

footer{
  max-width:1100px;
  margin:30px auto;
  padding:20px;
  border-top:1px solid #ddd;
  text-align:center;
  color:#999;
  font-size:10px;
  line-height:1.8;
}

/* MOBILE */

@media(max-width:650px){

  .header-inner{
    height:56px;
  }

  .engine{
    display:none;
  }

  main{
    margin-top:8px;
    padding:0 7px;
  }

  .day{
    flex-basis:88px;
  }

  .tools{
    flex-direction:column;
    align-items:stretch;
  }

  .total{
    text-align:right;
  }

  .match{
    grid-template-columns:48px 1fr 68px;
    padding:5px 7px;
  }

  .analysis{
    padding:5px;
    font-size:9px;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      BETLAB <span>AI</span>
    </div>

    <div class="engine">
      Data Engine · Multi League
    </div>

  </div>

</header>


<main>

  <div class="calendar">

    <div
      class="days"
      id="days">
    </div>

    <div class="tools">

      <div class="search">

        <span class="search-icon">
          ⌕
        </span>

        <input
          id="search"
          type="text"
          placeholder="Cerca squadra o campionato..."
        >

      </div>

      <div class="total">
        <span id="matchCount">0</span>
        partite
      </div>

    </div>

  </div>


  <div class="day-title">

    <strong id="selectedDate">
      Partite
    </strong>

    <span class="version">
      BETLAB V0.4
    </span>

  </div>


  <div id="content">

    <div class="loading">
      Caricamento partite...
    </div>

  </div>

</main>


<footer>

  BETLAB AI · Analisi statistica sperimentale ·
  Nessuna vincita è garantita

  <br>

  Data provided by football-data.org

</footer>


<script>

/* =========================================
   BETLAB AI V0.4
========================================= */

let allMatches = [];

let selectedDay = null;


/* =========================================
   CARICAMENTO DATI
========================================= */

async function loadData(){

  try{

    const response = await fetch(
      "data/matches.json?v=" + Date.now()
    );


    if(!response.ok){

      throw new Error(
        "Impossibile caricare matches.json"
      );

    }


    const data = await response.json();


    allMatches = data.matches || [];


    allMatches.sort(
      (a,b) =>
        new Date(a.utcDate) -
        new Date(b.utcDate)
    );


    createDayNavigation();

  }

  catch(error){

    console.error(error);


    document
      .getElementById("content")
      .innerHTML = `

        <div class="error">

          Errore nel caricamento
          delle partite.

        </div>

      `;

  }

}


/* =========================================
   DATA LOCALE ITALIANA
========================================= */

function localDateKey(date){

  const parts =
    new Intl.DateTimeFormat(
      "it-IT",
      {
        timeZone:"Europe/Rome",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    )
    .formatToParts(date);


  const year =
    parts.find(
      part => part.type === "year"
    ).value;


  const month =
    parts.find(
      part => part.type === "month"
    ).value;


  const day =
    parts.find(
      part => part.type === "day"
    ).value;


  return `${year}-${month}-${day}`;

}


/* =========================================
   CALENDARIO CONTINUO
========================================= */

function createDayNavigation(){

  const container =
    document.getElementById("days");


  container.innerHTML = "";


  /*
    Creiamo:
    ieri
    oggi
    + 9 giorni

    Nessun giorno viene saltato.
  */

  const today = new Date();

  today.setHours(
    12,
    0,
    0,
    0
  );


  selectedDay =
    localDateKey(today);


  for(
    let offset = -1;
    offset <= 9;
    offset++
  ){

    const date =
      new Date(today);


    date.setDate(
      today.getDate() + offset
    );


    const dateKey =
      localDateKey(date);


    /*
      Nome giorno
    */

    let label;


    if(offset === -1){

      label = "IERI";

    }

    else if(offset === 0){

      label = "OGGI";

    }

    else if(offset === 1){

      label = "DOMANI";

    }

    else{

      label =
        new Intl.DateTimeFormat(
          "it-IT",
          {
            weekday:"short"
          }
        )
        .format(date)
        .replace(".","")
        .toUpperCase();

    }


    /*
      Data DD/MM
    */

    const formattedDate =
      new Intl.DateTimeFormat(
        "it-IT",
        {
          day:"2-digit",
          month:"2-digit"
        }
      )
      .format(date);


    /*
      Numero partite presenti
      nel nostro feed
    */

    const count =
      allMatches.filter(
        match =>
          localDateKey(
            new Date(match.utcDate)
          ) === dateKey
      ).length;


    const element =
      document.createElement("div");


    element.className =
      "day" +
      (
        dateKey === selectedDay
          ? " active"
          : ""
      );


    element.innerHTML = `

      <span class="label">
        ${label}
      </span>

      <span class="date">
        ${formattedDate}
      </span>

      <span class="games">
        ${count} ${count === 1 ? "partita" : "partite"}
      </span>

    `;


    element.onclick = () => {

      selectedDay =
        dateKey;


      document
        .querySelectorAll(".day")
        .forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


      element
        .classList
        .add("active");


      renderMatches();

    };


    container.appendChild(
      element
    );

  }


  /*
    Centra OGGI
  */

  setTimeout(
    () => {

      const active =
        container.querySelector(
          ".active"
        );


      if(active){

        active.scrollIntoView({
          behavior:"smooth",
          block:"nearest",
          inline:"center"
        });

      }

    },
    100
  );


  renderMatches();

}


/* =========================================
   PARTITE
========================================= */

function renderMatches(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const matches =
    allMatches.filter(
      match => {


        /*
          FILTRO DATA
        */

        const matchDate =
          localDateKey(
            new Date(match.utcDate)
          );


        if(
          matchDate !== selectedDay
        ){

          return false;

        }


        /*
          FILTRO RICERCA
        */

        if(!search){

          return true;

        }


        const home =
          (
            match.homeTeam?.name ||
            match.homeTeam?.shortName ||
            ""
          ).toLowerCase();


        const away =
          (
            match.awayTeam?.name ||
            match.awayTeam?.shortName ||
            ""
          ).toLowerCase();


        const competition =
          (
            match.competition?.name ||
            ""
          ).toLowerCase();


        const country =
          (
            match.area?.name ||
            ""
          ).toLowerCase();


        return (

          home.includes(search) ||

          away.includes(search) ||

          competition.includes(search) ||

          country.includes(search)

        );

      }
    );


  document
    .getElementById("matchCount")
    .textContent =
      matches.length;


  updateSelectedDate();


  if(
    matches.length === 0
  ){

    document
      .getElementById("content")
      .innerHTML = `

        <div class="empty">

          <strong>
            Nessuna partita disponibile
          </strong>

          Il feed BETLAB non contiene
          incontri per questa giornata.

        </div>

      `;

    return;

  }


  /*
    Raggruppamento:
    NAZIONE -> CAMPIONATO
  */

  const groups = {};


  matches.forEach(
    match => {


      const country =
        match.area?.name ||
        "Internazionale";


      const competition =
        match.competition?.name ||
        "Competizione";


      if(!groups[country]){

        groups[country] = {};

      }


      if(
        !groups[country][competition]
      ){

        groups[country][competition] =
          [];

      }


      groups[country][competition]
        .push(match);

    }
  );


  let html = "";


  Object
    .keys(groups)
    .sort()
    .forEach(
      country => {


        html += `

          <section class="country">

            <div class="country-title">
              ${escapeHtml(country)}
            </div>

        `;


        Object
          .keys(groups[country])
          .sort()
          .forEach(
            competition => {


              const games =
                groups[country][competition];


              const competitionData =
                games[0]?.competition ||
                {};


              const logo =
                competitionData.emblem
                  ? `

                    <img
                      class="competition-logo"
                      src="${competitionData.emblem}"
                      alt=""
                    >

                  `
                  : "";


              const id =
                "league-" +
                Math.random()
                  .toString(36)
                  .substring(2);


              html += `

                <div class="competition">


                  <div
                    class="competition-header"
                    onclick="
                      toggleCompetition(
                        '${id}',
                        this
                      )
                    "
                  >


                    <div class="competition-left">

                      ${logo}

                      <span>
                        ${escapeHtml(competition)}
                      </span>

                    </div>


                    <span class="arrow">
                      ▼
                    </span>


                  </div>


                  <div
                    class="competition-matches"
                    id="${id}"
                  >

              `;


              games.forEach(
                match => {

                  html +=
                    createMatchRow(
                      match
                    );

                }
              );


              html += `

                  </div>

                </div>

              `;

            }
          );


        html += `

          </section>

        `;

      }
    );


  document
    .getElementById("content")
    .innerHTML =
      html;

}


/* =========================================
   RIGA PARTITA
========================================= */

function createMatchRow(match){

  const date =
    new Date(
      match.utcDate
    );


  const time =
    new Intl.DateTimeFormat(
      "it-IT",
      {
        timeZone:"Europe/Rome",
        hour:"2-digit",
        minute:"2-digit"
      }
    )
    .format(date);


  const home =
    match.homeTeam?.shortName ||
    match.homeTeam?.name ||
    "Casa";


  const away =
    match.awayTeam?.shortName ||
    match.awayTeam?.name ||
    "Trasferta";


  const homeLogo =
    match.homeTeam?.crest
      ? `

        <img
          class="crest"
          src="${match.homeTeam.crest}"
          alt=""
        >

      `
      : "";


  const awayLogo =
    match.awayTeam?.crest
      ? `

        <img
          class="crest"
          src="${match.awayTeam.crest}"
          alt=""
        >

      `
      : "";


  return `

    <div
      class="match"
      data-match-id="${match.id || ""}"
    >


      <div class="time">
        ${time}
      </div>


      <div class="teams">


        <div class="team">

          ${homeLogo}

          <span>
            ${escapeHtml(home)}
          </span>

        </div>


        <div class="team">

          ${awayLogo}

          <span>
            ${escapeHtml(away)}
          </span>

        </div>


      </div>


      <div class="analysis">
        ANALISI ›
      </div>


    </div>

  `;

}


/* =========================================
   DATA SELEZIONATA
========================================= */

function updateSelectedDate(){

  if(!selectedDay){

    return;

  }


  const date =
    new Date(
      selectedDay +
      "T12:00:00"
    );


  const formatted =
    new Intl.DateTimeFormat(
      "it-IT",
      {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    )
    .format(date);


  const text =
    formatted
      .charAt(0)
      .toUpperCase() +
    formatted.slice(1);


  document
    .getElementById(
      "selectedDate"
    )
    .textContent =
      text;

}


/* =========================================
   APRI / CHIUDI CAMPIONATO
========================================= */

function toggleCompetition(
  id,
  header
){

  const element =
    document.getElementById(id);


  const arrow =
    header.querySelector(
      ".arrow"
    );


  if(
    element.style.display ===
    "none"
  ){

    element.style.display =
      "block";

    arrow.textContent =
      "▼";

  }

  else{

    element.style.display =
      "none";

    arrow.textContent =
      "▶";

  }

}


/* =========================================
   PROTEZIONE HTML
========================================= */

function escapeHtml(text){

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================
   RICERCA
========================================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderMatches
  );


/* =========================================
   START
========================================= */

loadData();

</script>

</body>
</html>
