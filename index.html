<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BETLAB AI</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #16233a 0%,
          #0b1220 40%,
          #070b12 100%
        );

      color: #ffffff;
    }


    /* =========================================================
       HEADER
       ========================================================= */

    header {
      width: 100%;
      padding: 22px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(7,11,18,0.80);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .brand span {
      color: #4ade80;
    }

    .engine-status {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 12px;
      color: #9ca3af;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 12px rgba(74,222,128,0.8);
    }


    /* =========================================================
       MAIN
       ========================================================= */

    main {
      width: 100%;
      max-width: 760px;

      margin: 0 auto;
      padding: 70px 20px 80px;
    }


    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero h1 {
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .hero h1 span {
      color: #4ade80;
    }

    .hero p {
      margin-top: 14px;
      color: #9ca3af;
      font-size: 15px;
      line-height: 1.5;
    }


    /* =========================================================
       CONTROL PANEL
       ========================================================= */

    .panel {
      background: rgba(17,24,39,0.88);

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 22px;

      padding: 26px;

      box-shadow:
        0 30px 70px rgba(0,0,0,0.35);
    }

    .field {
      margin-bottom: 24px;
    }

    .field-label {
      display: block;

      margin-bottom: 10px;

      color: #d1d5db;

      font-size: 13px;
      font-weight: 700;
    }


    /* =========================================================
       IMPORTO
       ========================================================= */

    .amount-box {
      position: relative;
    }

    .currency {
      position: absolute;

      left: 18px;
      top: 50%;

      transform: translateY(-50%);

      font-size: 22px;
      font-weight: 800;

      color: #4ade80;
    }

    #amount {
      width: 100%;

      padding: 17px 18px 17px 48px;

      border-radius: 14px;

      border: 1px solid rgba(255,255,255,0.10);

      outline: none;

      background: #0b1220;

      color: white;

      font-size: 20px;
      font-weight: 800;
    }

    #amount:focus {
      border-color: #4ade80;
    }


    /* =========================================================
       NUMERO PARTITE
       ========================================================= */

    .match-count {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .count-button {
      padding: 14px 10px;

      border: 1px solid rgba(255,255,255,0.10);

      border-radius: 12px;

      background: #0b1220;

      color: #d1d5db;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .count-button:hover {
      border-color: rgba(74,222,128,0.55);
    }

    .count-button.active {
      background: #4ade80;
      color: #07100a;
      border-color: #4ade80;
    }


    /* =========================================================
       CREA GIOCATA
       ========================================================= */

    #createBet {
      width: 100%;

      border: 0;

      border-radius: 14px;

      padding: 18px;

      background: #4ade80;

      color: #07100a;

      font-size: 15px;
      font-weight: 900;

      cursor: pointer;

      transition: 0.2s ease;
    }

    #createBet:hover {
      transform: translateY(-1px);
      background: #5bea8d;
    }

    #createBet:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }


    /* =========================================================
       STATUS
       ========================================================= */

    #status {
      margin-top: 14px;

      min-height: 20px;

      text-align: center;

      color: #9ca3af;

      font-size: 12px;
    }


    /* =========================================================
       RESULT
       ========================================================= */

    #result {
      display: none;
      margin-top: 32px;
    }

    #result.visible {
      display: block;
    }

    .result-title {
      margin-bottom: 16px;

      font-size: 21px;
      font-weight: 900;
    }


    /* =========================================================
       MATCH CARD
       ========================================================= */

    .match-card {
      margin-bottom: 13px;

      padding: 18px;

      border-radius: 17px;

      background: rgba(17,24,39,0.92);

      border: 1px solid rgba(255,255,255,0.08);
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;

      margin-bottom: 14px;
    }

    .match-info {
      min-width: 0;
    }

    .match-league {
      margin-bottom: 6px;

      color: #6b7280;

      font-size: 11px;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .match-name {
      font-size: 17px;
      font-weight: 850;
      line-height: 1.3;
    }

    .match-date {
      flex-shrink: 0;

      color: #9ca3af;

      font-size: 11px;
      text-align: right;
    }


    /* =========================================================
       PRONOSTICO
       ========================================================= */

    .prediction-box {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      padding: 15px;

      border-radius: 13px;

      background: #0b1220;

      border: 1px solid rgba(74,222,128,0.18);
    }

    .prediction-left {
      min-width: 0;
    }

    .prediction-label {
      margin-bottom: 4px;

      color: #6b7280;

      font-size: 10px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .prediction-value {
      color: #4ade80;

      font-size: 22px;
      font-weight: 950;
    }

    .prediction-market {
      margin-top: 3px;

      color: #9ca3af;

      font-size: 11px;
    }


    /* =========================================================
       INDICE
       ========================================================= */

    .confidence {
      flex-shrink: 0;

      text-align: center;

      min-width: 68px;

      padding: 9px 10px;

      border-radius: 11px;

      background: rgba(74,222,128,0.10);
    }

    .confidence-number {
      display: block;

      color: #4ade80;

      font-size: 18px;
      font-weight: 900;
    }

    .confidence-label {
      display: block;

      margin-top: 2px;

      color: #6b7280;

      font-size: 9px;
      font-weight: 700;

      text-transform: uppercase;
    }


    /* =========================================================
       SUMMARY
       ========================================================= */

    .summary {
      margin-top: 18px;

      padding: 20px;

      border-radius: 17px;

      background: rgba(17,24,39,0.92);

      border: 1px solid rgba(255,255,255,0.08);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;

      padding: 8px 0;

      color: #9ca3af;

      font-size: 13px;
    }

    .summary-row strong {
      color: white;
    }


    /* =========================================================
       ERROR
       ========================================================= */

    .message {
      padding: 20px;

      border-radius: 16px;

      background: rgba(17,24,39,0.92);

      border: 1px solid rgba(255,255,255,0.08);

      color: #d1d5db;

      line-height: 1.5;

      text-align: center;
    }

    .message strong {
      color: white;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      padding: 30px 20px;

      text-align: center;

      color: #4b5563;

      font-size: 11px;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      main {
        padding-top: 45px;
      }

      .panel {
        padding: 20px;
      }

      .match-top {
        display: block;
      }

      .match-date {
        margin-top: 7px;
        text-align: left;
      }

      .prediction-value {
        font-size: 19px;
      }

    }

  </style>
</head>


<body>

  <header>

    <div class="header-inner">

      <div class="brand">
        BETLAB <span>AI</span>
      </div>

      <div class="engine-status">

        <span class="status-dot"></span>

        <span id="engineText">
          BETLAB pronto
        </span>

      </div>

    </div>

  </header>


  <main>

    <section class="hero">

      <h1>
        Cosa <span>giochiamo?</span>
      </h1>

      <p>
        Scegli l'importo e quante partite vuoi.
        BETLAB analizza i dati e seleziona un solo
        pronostico per ogni partita.
      </p>

    </section>


    <section class="panel">

      <div class="field">

        <label
          class="field-label"
          for="amount"
        >
          Quanto vuoi giocare?
        </label>

        <div class="amount-box">

          <span class="currency">
            €
          </span>

          <input
            id="amount"
            type="number"
            min="1"
            step="1"
            value="5"
          >

        </div>

      </div>


      <div class="field">

        <span class="field-label">
          Quante partite?
        </span>

        <div class="match-count">

          <button
            class="count-button active"
            data-count="2"
            type="button"
          >
            2
          </button>

          <button
            class="count-button"
            data-count="3"
            type="button"
          >
            3
          </button>

          <button
            class="count-button"
            data-count="4"
            type="button"
          >
            4
          </button>

          <button
            class="count-button"
            data-count="5"
            type="button"
          >
            5
          </button>

        </div>

      </div>


      <button
        id="createBet"
        type="button"
      >
        CREA LA GIOCATA
      </button>


      <div id="status">
        BETLAB pronto
      </div>

    </section>


    <section id="result"></section>

  </main>


  <footer>
    BETLAB AI · Analisi statistica automatizzata
  </footer>


  <script>

    /* =========================================================
       STATO
       ========================================================= */

    let selectedCount = 2;

    let betlabData = null;


    const amountInput =
      document.getElementById(
        "amount"
      );


    const createButton =
      document.getElementById(
        "createBet"
      );


    const statusElement =
      document.getElementById(
        "status"
      );


    const resultElement =
      document.getElementById(
        "result"
      );


    const engineText =
      document.getElementById(
        "engineText"
      );


    /* =========================================================
       SELETTORE NUMERO PARTITE
       ========================================================= */

    document
      .querySelectorAll(
        ".count-button"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".count-button"
                )
                .forEach(
                  item => {
                    item.classList.remove(
                      "active"
                    );
                  }
                );


              button.classList.add(
                "active"
              );


              selectedCount =
                Number(
                  button.dataset.count
                );

            }
          );

        }
      );


    /* =========================================================
       CARICA DATI
       ========================================================= */

    async function loadData() {

      statusElement.textContent =
        "Caricamento analisi BETLAB...";


      engineText.textContent =
        "Analisi dati";


      try {

        const response =
          await fetch(
            "data/betlab-analysis.json?v="
            +
            Date.now(),
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Impossibile caricare i dati BETLAB."
          );

        }


        betlabData =
          await response.json();


        const matches =
          getAnalysisArray(
            betlabData
          );


        const available =
          matches.filter(
            match => {
              return (
                match.prediction
                &&
                match.prediction.available
                === true
              );
            }
          );


        statusElement.textContent =
          available.length
          +
          " pronostici disponibili";


        engineText.textContent =
          "BETLAB pronto";


      } catch (error) {

        console.error(
          error
        );


        statusElement.textContent =
          "Errore caricamento dati";


        engineText.textContent =
          "Dati non disponibili";

      }

    }


    /* =========================================================
       TROVA ARRAY ANALISI
       ========================================================= */

    function getAnalysisArray(data) {

      if (
        data
        &&
        Array.isArray(
          data.analysis
        )
      ) {

        return data.analysis;

      }


      if (
        data
        &&
        Array.isArray(
          data.matches
        )
      ) {

        return data.matches;

      }


      if (
        Array.isArray(
          data
        )
      ) {

        return data;

      }


      return [];

    }


    /* =========================================================
       FORMATTA DATA
       ========================================================= */

    function formatDate(
      dateString
    ) {

      if (!dateString) {
        return "";
      }


      const date =
        new Date(
          dateString
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return dateString;

      }


      return new Intl.DateTimeFormat(
        "it-IT",
        {
          weekday: "short",
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(
        date
      );

    }


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================================================
       CREA CARD
       ========================================================= */

    function createMatchCard(
      match
    ) {

      const homeName =
        match.home?.name
        ??
        "Casa";


      const awayName =
        match.away?.name
        ??
        "Trasferta";


      const league =
        match.league
        ??
        "";


      const country =
        match.country
        ??
        "";


      const prediction =
        match.prediction
        ??
        {};


      const selection =
        prediction.prediction
        ??
        "-";


      const market =
        prediction.market
        ??
        "Mercato";


      const confidence =
        Number(
          prediction.confidence
          ??
          0
        );


      return `
        <article class="match-card">

          <div class="match-top">

            <div class="match-info">

              <div class="match-league">
                ${escapeHtml(country)}
                ${country && league ? " · " : ""}
                ${escapeHtml(league)}
              </div>

              <div class="match-name">
                ${escapeHtml(homeName)}
                –
                ${escapeHtml(awayName)}
              </div>

            </div>

            <div class="match-date">
              ${escapeHtml(
                formatDate(
                  match.date
                )
              )}
            </div>

          </div>


          <div class="prediction-box">

            <div class="prediction-left">

              <div class="prediction-label">
                Pronostico BETLAB
              </div>

              <div class="prediction-value">
                ${escapeHtml(selection)}
              </div>

              <div class="prediction-market">
                ${escapeHtml(market)}
              </div>

            </div>


            <div class="confidence">

              <span class="confidence-number">
                ${confidence.toFixed(0)}%
              </span>

              <span class="confidence-label">
                indice
              </span>

            </div>

          </div>

        </article>
      `;

    }


    /* =========================================================
       CREA GIOCATA
       ========================================================= */

    function createBet() {

      const amount =
        Number(
          amountInput.value
        );


      if (
        !Number.isFinite(amount)
        ||
        amount <= 0
      ) {

        statusElement.textContent =
          "Inserisci un importo valido.";

        return;

      }


      if (!betlabData) {

        statusElement.textContent =
          "I dati BETLAB non sono ancora disponibili.";

        return;

      }


      const allMatches =
        getAnalysisArray(
          betlabData
        );


      /*
       * Qui entrano SOLO partite
       * per cui il Prediction Engine
       * ha prodotto una selezione.
       */

      const predictedMatches =
        allMatches.filter(
          match => {

            return (
              match.prediction
              &&
              match.prediction.available
              === true
              &&
              match.prediction.prediction
            );

          }
        );


      /*
       * Il workflow le ha già ordinate
       * secondo qualità dei dati e indice.
       */

      const selectedMatches =
        predictedMatches.slice(
          0,
          selectedCount
        );


      if (
        selectedMatches.length === 0
      ) {

        resultElement.innerHTML = `
          <div class="message">

            <strong>
              Nessun pronostico disponibile.
            </strong>

            <br><br>

            BETLAB non ha trovato partite
            con dati sufficienti per produrre
            una selezione.

          </div>
        `;


        resultElement.classList.add(
          "visible"
        );


        statusElement.textContent =
          "Nessuna giocata disponibile.";

        return;

      }


      let html = `
        <div class="result-title">
          La tua giocata
        </div>
      `;


      selectedMatches.forEach(
        match => {

          html +=
            createMatchCard(
              match
            );

        }
      );


      html += `
        <div class="summary">

          <div class="summary-row">

            <span>
              Partite
            </span>

            <strong>
              ${selectedMatches.length}
            </strong>

          </div>


          <div class="summary-row">

            <span>
              Importo
            </span>

            <strong>
              ${amount.toLocaleString(
                "it-IT",
                {
                  style: "currency",
                  currency: "EUR"
                }
              )}
            </strong>

          </div>

        </div>
      `;


      /*
       * Se l'utente ne chiede più di quelle
       * realmente analizzabili, NON inventiamo
       * pronostici.
       */

      if (
        selectedMatches.length
        <
        selectedCount
      ) {

        html += `
          <div
            class="message"
            style="margin-top:13px"
          >

            Hai richiesto
            <strong>
              ${selectedCount}
            </strong>
            partite.

            <br><br>

            Al momento BETLAB ne considera
            utilizzabili
            <strong>
              ${selectedMatches.length}
            </strong>.

          </div>
        `;

      }


      resultElement.innerHTML =
        html;


      resultElement.classList.add(
        "visible"
      );


      statusElement.textContent =
        selectedMatches.length
        +
        " pronostico"
        +
        (
          selectedMatches.length === 1
          ? ""
          : "i"
        )
        +
        " selezionato"
        +
        (
          selectedMatches.length === 1
          ? ""
          : "i"
        )
        +
        ".";


      resultElement.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    /* =========================================================
       CLICK
       ========================================================= */

    createButton.addEventListener(
      "click",
      createBet
    );


    /* =========================================================
       AVVIO
       ========================================================= */

    loadData();

  </script>

</body>
</html>
