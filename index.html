<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BETLAB AI</title>

<style>
:root{
  --green:#16a05d;
  --green-dark:#0d7c46;
  --green-light:#eaf7f0;
  --text:#171717;
  --muted:#777;
  --border:#e5e5e5;
  --soft:#f6f7f8;
  --white:#fff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#f4f5f6;
  color:var(--text);
}

header{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:23px;
  font-weight:800;
  letter-spacing:-.5px;
}

.logo span{
  color:var(--green);
}

.engine{
  font-size:12px;
  color:#888;
}

main{
  max-width:1100px;
  margin:18px auto 50px;
  padding:0 15px;
}

.toolbar{
  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:12px;
}

.days{
  display:flex;
  align-items:center;
  overflow-x:auto;
  border-bottom:1px solid var(--border);
}

.day{
  min-width:120px;
  padding:13px 15px;
  text-align:center;
  cursor:pointer;
  border-right:1px solid var(--border);
  color:#666;
  font-size:12px;
  background:#fff;
}

.day:hover{
  background:#fafafa;
}

.day strong{
  display:block;
  color:#222;
  font-size:13px;
  margin-top:3px;
}

.day.active{
  color:var(--green-dark);
  background:var(--green-light);
  border-bottom:3px solid var(--green);
}

.day.active strong{
  color:var(--green-dark);
}

.tools{
  display:flex;
  gap:10px;
  padding:12px;
  align-items:center;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  border:1px solid #ddd;
  border-radius:7px;
  padding:10px 12px 10px 36px;
  font-size:14px;
  outline:none;
}

.search input:focus{
  border-color:#aaa;
}

.search-icon{
  position:absolute;
  left:12px;
  top:9px;
  color:#999;
}

.counter{
  font-size:12px;
  color:#777;
  white-space:nowrap;
}

.info-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:14px 2px 10px;
  font-size:13px;
  color:#777;
}

.info-bar strong{
  color:#222;
}

.country{
  margin-bottom:14px;
}

.country-title{
  padding:8px 11px;
  font-size:12px;
  font-weight:700;
  color:#666;
  text-transform:uppercase;
  letter-spacing:.4px;
}

.competition{
  background:#fff;
  border:1px solid var(--border);
  border-radius:9px;
  overflow:hidden;
  margin-bottom:8px;
}

.competition-header{
  height:43px;
  padding:0 12px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
}

.competition-name{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:13px;
  font-weight:700;
}

.competition-logo{
  width:22px;
  height:22px;
  object-fit:contain;
}

.arrow{
  color:#999;
  font-size:12px;
}

.matches{
  display:block;
}

.match{
  min-height:54px;
  display:grid;
  grid-template-columns:65px 1fr 110px;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:5px 12px;
  cursor:pointer;
  transition:.1s;
}

.match:last-child{
  border-bottom:0;
}

.match:hover{
  background:#fafafa;
}

.time{
  font-size:12px;
  font-weight:600;
  color:#666;
}

.teams{
  display:grid;
  grid-template-columns:1fr;
  gap:4px;
}

.team{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  font-weight:500;
}

.crest{
  width:19px;
  height:19px;
  object-fit:contain;
}

.analysis{
  justify-self:end;
  border:1px solid #d6d6d6;
  border-radius:6px;
  padding:6px 9px;
  background:#fff;
  color:#555;
  font-size:11px;
  font-weight:600;
}

.match:hover .analysis{
  border-color:var(--green);
  color:var(--green-dark);
}

.empty{
  background:#fff;
  border:1px solid var(--border);
  border-radius:9px;
  padding:50px 20px;
  text-align:center;
  color:#777;
}

.empty strong{
  display:block;
  color:#333;
  margin-bottom:6px;
}

.loading{
  background:#fff;
  border:1px solid var(--border);
  border-radius:9px;
  padding:40px;
  text-align:center;
  color:#777;
}

.error{
  background:#fff;
  border:1px solid #e3b6b6;
  border-radius:9px;
  padding:25px;
  color:#a23a3a;
}

footer{
  max-width:1100px;
  margin:30px auto;
  padding:20px 15px;
  border-top:1px solid #ddd;
  color:#999;
  font-size:11px;
  text-align:center;
  line-height:1.8;
}

@media(max-width:650px){

  .header-inner{
    height:57px;
  }

  .engine{
    display:none;
  }

  main{
    padding:0 8px;
    margin-top:8px;
  }

  .tools{
    flex-direction:column;
    align-items:stretch;
  }

  .counter{
    text-align:right;
  }

  .match{
    grid-template-columns:48px 1fr 70px;
    padding:6px 8px;
  }

  .analysis{
    padding:5px;
    font-size:10px;
  }

  .day{
    min-width:95px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">BETLAB <span>AI</span></div>
    <div class="engine">DATA ENGINE · MULTI LEAGUE</div>
  </div>
</header>

<main>

<div class="toolbar">

  <div class="days" id="days"></div>

  <div class="tools">

    <div class="search">
      <span class="search-icon">⌕</span>
      <input
        id="search"
        type="text"
        placeholder="Cerca squadra o campionato..."
      >
    </div>

    <div class="counter">
      <span id="matchCount">0</span> partite
    </div>

  </div>

</div>

<div class="info-bar">
  <div>
    <strong id="selectedDate">Partite</strong>
  </div>

  <div>
    BETLAB V0.3
  </div>
</div>

<div id="content">
  <div class="loading">Caricamento partite...</div>
</div>

</main>

<footer>
  BETLAB AI · Analisi statistica sperimentale · Nessuna vincita è garantita
  <br>
  Data provided by football-data.org
</footer>


<script>

let allMatches = [];
let selectedDay = null;


/* -------------------------
   DATA
------------------------- */

async function loadData(){

  try{

    const response = await fetch(
      "data/matches.json?v=" + Date.now()
    );

    if(!response.ok){
      throw new Error("Errore caricamento dati");
    }

    const data = await response.json();

    allMatches = data.matches || [];

    allMatches.sort(
      (a,b) => new Date(a.utcDate) - new Date(b.utcDate)
    );

    createDayNavigation();

  }

  catch(error){

    console.error(error);

    document.getElementById("content").innerHTML = `
      <div class="error">
        Impossibile caricare i dati delle partite.
      </div>
    `;

  }

}


/* -------------------------
   DATE
------------------------- */

function localDateKey(date){

  return new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:"Europe/Rome",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).format(date);

}


function createDayNavigation(){

  const dates = [...new Set(
    allMatches.map(
      match => localDateKey(new Date(match.utcDate))
    )
  )];

  const container = document.getElementById("days");

  container.innerHTML = "";

  if(dates.length === 0){
    renderMatches();
    return;
  }


  /*
    Se oggi esiste nei dati viene selezionato.
    Altrimenti viene scelta la prima giornata disponibile.
  */

  const today = localDateKey(new Date());

  selectedDay =
    dates.includes(today)
      ? today
      : dates[0];


  dates.forEach(dateKey => {

    const date = new Date(dateKey + "T12:00:00");

    const weekday =
      new Intl.DateTimeFormat(
        "it-IT",
        {weekday:"short"}
      ).format(date);

    const formatted =
      new Intl.DateTimeFormat(
        "it-IT",
        {
          day:"2-digit",
          month:"2-digit"
        }
      ).format(date);


    const item = document.createElement("div");

    item.className =
      "day" +
      (dateKey === selectedDay ? " active" : "");

    item.innerHTML = `
      ${weekday}
      <strong>${formatted}</strong>
    `;


    item.onclick = () => {

      selectedDay = dateKey;

      document.querySelectorAll(".day")
        .forEach(x => x.classList.remove("active"));

      item.classList.add("active");

      renderMatches();

    };


    container.appendChild(item);

  });


  renderMatches();

}


/* -------------------------
   RENDER
------------------------- */

function renderMatches(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  let matches =
    allMatches.filter(match => {

      const date =
        localDateKey(new Date(match.utcDate));

      if(date !== selectedDay){
        return false;
      }


      const home =
        (
          match.homeTeam?.name ||
          match.homeTeam?.shortName ||
          ""
        ).toLowerCase();


      const away =
        (
          match.awayTeam?.name ||
          match.awayTeam?.shortName ||
          ""
        ).toLowerCase();


      const competition =
        (
          match.competition?.name ||
          ""
        ).toLowerCase();


      const country =
        (
          match.area?.name ||
          ""
        ).toLowerCase();


      if(search){

        return (
          home.includes(search) ||
          away.includes(search) ||
          competition.includes(search) ||
          country.includes(search)
        );

      }

      return true;

    });


  document.getElementById("matchCount")
    .textContent = matches.length;


  updateDateTitle();


  if(matches.length === 0){

    document.getElementById("content").innerHTML = `
      <div class="empty">
        <strong>Nessuna partita</strong>
        Nessun incontro disponibile per questa selezione.
      </div>
    `;

    return;

  }


  /*
     COUNTRY -> COMPETITION -> MATCHES
  */

  const countries = {};


  matches.forEach(match => {

    const country =
      match.area?.name ||
      "Internazionale";


    const competition =
      match.competition?.name ||
      "Competizione";


    if(!countries[country]){
      countries[country] = {};
    }


    if(!countries[country][competition]){
      countries[country][competition] = [];
    }


    countries[country][competition].push(match);

  });


  let html = "";


  Object.keys(countries)
    .sort()
    .forEach(country => {

      html += `
        <div class="country">

          <div class="country-title">
            ${escapeHtml(country)}
          </div>
      `;


      Object.keys(countries[country])
        .sort()
        .forEach(competition => {

          const games =
            countries[country][competition];


          const competitionData =
            games[0]?.competition || {};


          const emblem =
            competitionData.emblem
              ? `
                <img
                  class="competition-logo"
                  src="${competitionData.emblem}"
                  alt=""
                >
              `
              : "";


          const competitionId =
            "competition-" +
            Math.random()
              .toString(36)
              .substring(2);


          html += `

            <div class="competition">

              <div
                class="competition-header"
                onclick="toggleCompetition('${competitionId}',this)"
              >

                <div class="competition-name">

                  ${emblem}

                  ${escapeHtml(competition)}

                </div>

                <div class="arrow">
                  ▼
                </div>

              </div>


              <div
                class="matches"
                id="${competitionId}"
              >

          `;


          games.forEach(match => {

            html += createMatchRow(match);

          });


          html += `
              </div>
            </div>
          `;

        });


      html += `</div>`;

    });


  document.getElementById("content").innerHTML = html;

}


/* -------------------------
   MATCH
------------------------- */

function createMatchRow(match){

  const date =
    new Date(match.utcDate);


  const time =
    new Intl.DateTimeFormat(
      "it-IT",
      {
        timeZone:"Europe/Rome",
        hour:"2-digit",
        minute:"2-digit"
      }
    ).format(date);


  const home =
    match.homeTeam?.shortName ||
    match.homeTeam?.name ||
    "Casa";


  const away =
    match.awayTeam?.shortName ||
    match.awayTeam?.name ||
    "Trasferta";


  const homeCrest =
    match.homeTeam?.crest
      ? `
        <img
          class="crest"
          src="${match.homeTeam.crest}"
          alt=""
        >
      `
      : "";


  const awayCrest =
    match.awayTeam?.crest
      ? `
        <img
          class="crest"
          src="${match.awayTeam.crest}"
          alt=""
        >
      `
      : "";


  return `

    <div
      class="match"
      data-match-id="${match.id || ""}"
    >

      <div class="time">
        ${time}
      </div>


      <div class="teams">

        <div class="team">
          ${homeCrest}
          ${escapeHtml(home)}
        </div>

        <div class="team">
          ${awayCrest}
          ${escapeHtml(away)}
        </div>

      </div>


      <div class="analysis">
        ANALISI ›
      </div>

    </div>

  `;

}


/* -------------------------
   UI
------------------------- */

function toggleCompetition(id,header){

  const element =
    document.getElementById(id);

  const arrow =
    header.querySelector(".arrow");


  if(element.style.display === "none"){

    element.style.display = "block";
    arrow.textContent = "▼";

  }else{

    element.style.display = "none";
    arrow.textContent = "▶";

  }

}


function updateDateTitle(){

  if(!selectedDay){
    return;
  }

  const date =
    new Date(selectedDay + "T12:00:00");


  const text =
    new Intl.DateTimeFormat(
      "it-IT",
      {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    ).format(date);


  document.getElementById("selectedDate")
    .textContent =
      text.charAt(0).toUpperCase() +
      text.slice(1);

}


/* -------------------------
   SECURITY
------------------------- */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* -------------------------
   SEARCH
------------------------- */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderMatches
  );


loadData();

</script>

</body>
</html>
